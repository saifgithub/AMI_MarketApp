area: floor
code: FLOOR
title: Floor tab & home shell
order: 5
covers:
  - mobile/lib/screens/floor/**
  - mobile/lib/screens/home_shell.dart
summary: |
  The Floor is client composition over other areas' endpoints (journal team
  calls, sector watch, daily challenge, Academy unlock state, inbox bell). The
  API cases prove a brand-new user's cold-start Floor reads answer cleanly with
  honest empty states and are private; the manual cases cover the shell and
  the visual checks. Bottom tabs are Floor / Portfolio / [Game, flag-gated] /
  Lessons / You.
cases:
  - id: UAT-FLOOR-001
    title: Sector Watch answers 200 with an explicit empty state for a new user
    layer: api
    plans: [floor_pass]
    steps:
      - GET /v1/sector-watch/{user_id} for a user with no watchlist or holdings
      - GET another user's sector watch; GET with no token
    expected:
      - 200 with state "empty", tickers_considered 0 and null sector, leader and headline (degrade states ride the body, CR183/CR040)
      - Another user's id is 404 (CR183 - it must not confirm the id exists); no token is 401

  - id: UAT-FLOOR-002
    title: Every read the Floor makes on cold start succeeds for a brand-new user
    layer: api
    plans: [floor_pass]
    steps:
      - GET journal (team calls), lessons by_lesson, lesson requirements, daily_challenge today, messages, notifications unread_count, sector-watch
    expected:
      - All 200 with empty-but-valid bodies - no 5xx, and no null where the client expects a list
      - The Floor Pass journal read reports retention_days 30
      - requirements lists the 12 agents all locked (the Your Firm screen's source)

  - id: UAT-FLOOR-003
    title: Bottom navigation shows the right tabs in the right order
    layer: manual
    plans: [floor_pass]
    preconditions:
      - TestFlight build on an iPhone
    steps:
      - Launch signed in and read the bottom bar; tap each tab
      - Repeat with the Game flag off, then on
    expected:
      - Tabs read FLOOR, PORTFOLIO, LESSONS, YOU; with the flag on a GAME tab sits between Portfolio and Lessons
      - Each tab keeps its own navigation stack (go deep, switch away, switch back, still deep)
      - The ad banner and ticker tape sit below the bar; a paid plan has no ad banner

  - id: UAT-FLOOR-004
    title: Floor cards render sensible empty and filled states
    layer: manual
    plans: [floor_pass, trader]
    preconditions:
      - One brand-new account, one account with holdings, a watchlist and a past Room run
    steps:
      - Open the Floor tab on each account
      - Pull to refresh; toggle light and dark
    expected:
      - On the new account the portfolio, team calls, sector watch and unactioned calls cards show honest empty states, not spinners or zeroes dressed as data
      - On the filled account the cards show real tickers, deltas and a sector leader headline; unactioned calls open the right ticker
      - The daily challenge card is present on both and nothing clips at iPhone 13 width

  - id: UAT-FLOOR-005
    title: Your Firm shows locked and unlocked agents and unlocks after the fifth lesson
    layer: manual
    plans: [floor_pass]
    preconditions:
      - A Floor Pass tester who has passed four of the five Fundamentals Analyst gateway lessons
    steps:
      - Open Your Firm; tap the locked Fundamentals Analyst
      - Pass the fifth gateway quiz in Lessons and return to the Floor
    expected:
      - The locked sheet lists the five gateway lessons with 4 of 5 done
      - After the pass the agent shows unlocked on the Floor without a restart, with the unlock celebration shown once

  - id: UAT-FLOOR-006
    title: The Floor inbox (envelope) button opens the inbox inside the tab navigator
    layer: manual
    plans: [floor_pass]
    steps:
      - Tap the envelope (inbox) button on the Floor; open a message; go back
    expected:
      - The inbox opens with the bottom bar still visible (DEF457) and back returns to the Floor, not to a blank screen

  - id: UAT-FLOOR-007
    title: Your Firm shows the twelve agents in desk bands, locked ones dimmed, and a locked agent opens its unlock sheet
    layer: device
    plans: [floor_pass]
    steps:
      - 'On the Floor scroll to the YOUR FIRM row and open it'
      - 'Tap the Fundamentals Analyst'
    expected:
      - 'The firm wall lists the twelve agents by their CR160 titles with an "N of 12 unlocked" summary, in desk bands top to bottom: a YOU hex, the Chief Investment Officer, ANALYST DESK, RESEARCH, EXECUTION and RISK side by side when the content column is at least about 332 pt wide (e.g. a 390 pt iPhone), stacked as two bands on narrower phones (most 360 dp Android phones), then CONCIERGE - reports to you (CR159)'
      - 'Each band header carries its own filled/total seat count (for example 0/4 on a new account) and no band scrolls sideways at the largest system text size'
      - 'A locked agent opens a sheet with HOW TO UNLOCK, its five gateway lessons, GO TO LESSONS and an "N / 5 gateway lessons passed" progress line'
      - 'Dismissing the sheet returns to the firm wall'

  - id: UAT-FLOOR-008
    title: The Floor inbox (envelope) button opens the inbox with the bottom bar still visible
    layer: device
    plans: [floor_pass]
    steps:
      - 'On the Floor tap the envelope (inbox) button in the header (an envelope since DEF481; the bell is Notifications)'
      - 'Go back'
    expected:
      - 'The MESSAGES inbox opens and the bottom bar (FLOOR / PORTFOLIO / LESSONS / YOU) is still on screen (DEF457)'
      - 'Back returns to the Floor'

  - id: UAT-FLOOR-009
    title: A locked agent's GO TO LESSONS switches to the LESSONS tab
    layer: manual
    plans: [floor_pass]
    steps:
      - 'On the Floor, tap a locked agent; in its sheet tap GO TO LESSONS'
    expected:
      - 'The LESSONS tab opens and the bottom bar highlights LESSONS; no second Lessons screen is stacked on the Floor (DEF476)'
      - 'Tapping FLOOR returns to the Floor as it was left'

  - id: UAT-FLOOR-010
    title: The Floor's persistent chrome raises no layout errors
    layer: manual
    plans: [floor_pass]
    preconditions:
      - 'A QA build (error sink on) on a small phone, system text at its largest, Floor Pass plan so the house-ad strip shows'
    steps:
      - 'Open the Floor, dismiss the "Not now" prompt, watch the ticker tape scroll for 30 seconds'
      - 'Read the QA error sink'
    expected:
      - 'The bottom ticker tape scrolls and the house-ad strip fits its row (its call to action shortens with an ellipsis rather than overflowing)'
      - 'No RenderFlex overflow is recorded for either (DEF482)'

  - id: UAT-FLOOR-011
    title: The Floor shows a rejoin banner only while one of the user's Rooms is still running
    layer: manual
    plans: [any]
    preconditions:
      - 'A funded account'
    steps:
      - 'Open the app with no Room running and read the top of the Floor'
      - 'Run UAT-ROOM-028 (close the app mid-Room, reopen) and read the top of the Floor'
    expected:
      - 'With no Room running, the Floor shows no rejoin banner'
      - 'With a Room still running, the Floor shows "Your Room on <ticker> is still running." with REJOIN, and opening the app never jumps into the Room by itself'
    notes: 'DEF506 (Saiful 2026-11-20). The full rejoin and no-second-charge checks are UAT-ROOM-028.'

  - id: UAT-FLOOR-012
    title: The Floor's SIM PORTFOLIO card prints the book value with a $ prefix and no decimals
    layer: device
    plans: [floor_pass]
    steps:
      - 'Open the Floor tab and read the SIM PORTFOLIO card (first card of the carousel)'
      - 'Repeat with the phone language set to Bahasa Melayu, then Arabic'
    expected:
      - 'The headline reads the book value as $<amount> (for example $100,000): a $ prefix, thousands separators, no cents'
      - 'The line under it reads "<stake> to start" on an untouched book, or "<pnl> all-time · <cash> cash · <n> positions" with cash as $<amount>; a negative P&L reads -$<amount>'
      - 'In Bahasa Melayu and Arabic the $ is still a prefix and no amount reads RM: money on a US book is dollars whatever the phone language'
    notes: 'CR282 lane F1 (2026-11-24): the card prints through the one money formatter (formatMoney, features/markets/money.dart). The Floor card always shows the US book; Bursa has no Floor card in phase 1, so there is no Bursa Floor case. The executor asserts the English run; the Malay and Arabic repeat is a visual check.'
