area: platform
code: PLAT
title: Platform, version gate & UAT seeding
order: 1
covers:
  - backend/app/main.py
  - backend/app/api/dependencies.py
  - backend/app/services/client_release_floor.py
  - backend/app/middleware/http_audit.py
  - backend/app/middleware/version_gate.py
  - mobile/lib/services/api/trace_ids.dart
  - mobile/lib/widgets/trace_ref_line.dart
  - mobile/lib/screens/version_gate/**
summary: |
  The backend is up, ready, and tells old builds to update. Also proves the UAT
  seeding path itself (tagged anonymous user, admin plan/credit changes) so
  every later area can trust its preconditions.
cases:
  - id: UAT-PLAT-001
    title: Health and readiness report green
    layer: api
    plans: [anon]
    steps:
      - GET /v1/health
      - GET /v1/ready
    expected:
      - /v1/health is 200 with status "ok" and a git sha version
      - /v1/ready is 200 with ready true and no failed probes

  - id: UAT-PLAT-002
    title: Release floor blocks builds below min_build and passes current ones
    layer: api
    plans: [anon]
    steps:
      - GET /v1/client/release-floor to read min_build
      - GET /v1/client/release-floor?build=<min_build - 1>&platform=ios
      - GET /v1/client/release-floor?build=<min_build>&platform=android
    expected:
      - The below-floor build gets action "block" and an Apple store/TestFlight URL (the generic TestFlight page until IOS_TESTFLIGHT_JOIN_URL is set — CR121)
      - The at-floor build gets action "ok" (or "nag"), and the Android store URL is a Play Store link
      - 'The Android store URL equals the ANDROID_PLAY_STORE_URL setting: on Alpha the personal package `ai.agenticmarketintel.ami_trade`; on Beta, boot refuses that personal package (DEF511, 2026-11-20)'

  - id: UAT-PLAT-003
    title: UAT seeding creates a tagged anonymous user the admin API can re-plan and credit
    layer: api
    plans: [floor_pass, trader]
    steps:
      - POST /v1/auth/anon with the UAT device tag
      - Admin PATCH plan to trader, admin POST credits +5
      - Admin GET the user
    expected:
      - The user exists with last_app_version "uat" (excluded from real-user counts)
      - Plan reads trader and credits rose by 5
      - The user's own bearer token authenticates GET /v1/auth/me

  - id: UAT-PLAT-004
    title: Old build sees the forced-update screen
    layer: manual
    plans: [any]
    preconditions:
      - An iPhone with a TestFlight build older than the current release floor (or Saiful raises the floor temporarily via the admin console)
    steps:
      - Launch the app
    expected:
      - A blocking "Update required" screen with a working store button; no other screen is reachable

  - id: UAT-PLAT-005
    title: A current build launches past the version gate to the Floor
    layer: device
    plans: [any]
    steps:
      - 'Cold-launch the app'
    expected:
      - 'No forced-update screen appears'
      - 'The Floor and its bottom bar are on screen'

  - id: UAT-PLAT-006
    title: The forced-update button never fails silently
    layer: manual
    plans: [any]
    preconditions:
      - 'A build below the floor, with the release-floor response served without a store_url (or a store link the phone cannot open)'
    steps:
      - 'On the "Update required" screen, tap UPDATE NOW'
    expected:
      - 'A message tells the user AMI could not open the store and where to update from; the button is never a silent no-op (DEF473)'

  - id: UAT-PLAT-007
    title: Every error response carries a trace id in its header and body
    layer: api
    plans: [anon]
    steps:
      - GET a path that does not exist (404)
      - GET /v1/feedback/updates with no token (401)
      - POST /v1/feedback/bug with required fields missing, from a synthetic client IP (422)
      - Repeat the 401 with a client-supplied X-Request-Id of a freshly generated UUID
    expected:
      - 'Each error carries an X-Request-Id header that is a UUID, and the JSON body carries the same value as request_id; detail keeps its existing shape (a string for 404/401, a list for 422)'
      - 'Two errors never share an id'
      - 'The client-supplied X-Request-Id is ignored: the response carries a different, server-minted id (the id is the http_audit primary key and must never be client-chosen)'
    notes: CR239 / WP-38. The live "grep the id in docker logs ami_api_alpha and find the http_audit row" half is run by Saiful on the rig.

  - id: UAT-PLAT-008
    title: An error state on the phone shows a small copyable "Ref:" trace reference
    layer: manual
    plans: [any]
    preconditions:
      - 'The operator arms the Alpha fault switch for the lab user only, e.g. UAT_FAULT_INJECT={"<lab-user-uuid>": ["GET /v1/messages"]} in the Alpha env, then recreates api-alpha (the log shows uat_fault_inject_active); the operator removes it and recreates the container after the run'
    steps:
      - 'Open the Inbox (GET /v1/messages answers 503 for the lab user only)'
      - 'Read the error state; tap the "Ref: xxxxxxxx" line'
      - 'Open You > SETTINGS > HELP > Report a problem and send a report'
    expected:
      - 'The error state shows its normal message plus a small "Ref: " followed by eight hex characters, never a raw exception'
      - 'Tapping it shows "Reference copied" and puts the full id on the clipboard'
      - 'TRY AGAIN that fails again shows the NEW id, not the first one, and an error cached before the screen opened still shows its Ref (DEF526)'
      - 'The same id is found in the backend log lines and the http_audit row of the failed request, and in the stored bug report (trace_ids, visible in the admin console)'
      - 'An error from a request that never reached the server shows no Ref line'
