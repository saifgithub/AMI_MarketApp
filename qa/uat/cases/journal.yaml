area: journal
code: JRNL
title: Decision journal, trash & the You tab
order: 14
covers:
  - backend/app/api/journal.py
  - backend/app/services/sim_trade_effects.py
  - mobile/lib/screens/journal/**
  - mobile/lib/screens/you/**
summary: |
  What the user does is captured to a private journal. Floor Pass reads a
  30-day window, paid plans read everything. Delete is a soft delete that
  round-trips through the trash and restore. Entries are owner-only and cannot
  be forged over HTTP (DEF371).
  DEF481 (2026-11-20, build 120): the journal-detail and trash back controls carry ami.nav.back. Accessibility identifiers only; nothing a
  user sees or does changed, so no case steps change.
cases:
  - id: UAT-JRNL-001
    title: Journal list reports the plan's retention window
    layer: api
    plans: [floor_pass, trader]
    steps:
      - GET /v1/journal/{user_id} as a Floor Pass user
      - Admin-set the same user to trader and GET again
      - Pass a lesson quiz first so the list is not empty
    expected:
      - Floor Pass response has retention_days 30 (FLOOR_PASS_RETENTION_DAYS)
      - Trader response has retention_days null (unlimited), and the entry is still listed
      - total equals the number of entries returned

  - id: UAT-JRNL-002
    title: Lesson completion is journalled and readable as an entry
    layer: api
    plans: [floor_pass]
    steps:
      - Pass a lesson quiz
      - GET the journal with entry_type=lesson_complete, and with a non-matching filter and a search term
      - GET the entry by id; GET an unknown entry id
    expected:
      - A lesson_complete entry names the lesson, carries the score payload and has no deleted_at
      - The type filter returns it, a different type filter does not, and q matches the lesson title
      - GET entry returns the same entry; an unknown id is 404

  - id: UAT-JRNL-003
    title: A note, tags and outcome persist on an entry
    layer: api
    plans: [floor_pass]
    steps:
      - POST /v1/journal/{user_id}/entry/{id}/note with note, tags and outcome win
      - GET the entry and the list
      - POST a note to an unknown entry id
    expected:
      - The response and a fresh GET both carry the note, tags and outcome
      - The note shows in the list view too
      - Unknown entry is 404

  - id: UAT-JRNL-004
    title: Delete, trash and restore round-trip
    layer: api
    plans: [trader]
    steps:
      - DELETE an entry
      - GET the list and GET /trash
      - POST restore
      - GET the list and trash again
      - DELETE and restore with unknown ids
    expected:
      - Delete is 204; the entry leaves the list and appears in trash with deleted_at set (retention_days null on trash)
      - Restore is 204; the entry returns to the list with deleted_at cleared and leaves the trash
      - Unknown ids are 404 for both delete and restore

  - id: UAT-JRNL-005
    title: Journal is private to its owner and cannot be forged
    layer: api
    plans: [floor_pass]
    steps:
      - User B lists, reads, annotates, deletes and restores user A's entry; reads A's trash
      - The same list route with no token
      - POST /v1/journal as an authenticated user
    expected:
      - Cross-user calls are 403 and A's entry is untouched
      - Unauthenticated is 401
      - The bare POST creates nothing (route removed by DEF371) - 404 or 405, never 2xx

  - id: UAT-JRNL-006
    title: Floor Pass window drops entries older than 30 days
    layer: api
    status: blocked
    blocked_on: Needs an entry backdated beyond 30 days; the only backdating hook (journal_store test helper) is not exposed over HTTP and there is no admin route for it. Needs Saiful's go for a UAT-only backdating route or a DB seed on melehost.
    plans: [floor_pass, trader]
    steps:
      - Create an entry dated 31 days ago for a Floor Pass user, list, upgrade to trader, list
    expected:
      - Floor Pass list omits the old entry; trader list includes it

  - id: UAT-JRNL-007
    title: Journal, trash and You tab behave on iPhone
    layer: manual
    plans: [floor_pass]
    preconditions:
      - TestFlight build on an iPhone with at least three journal entries
    steps:
      - On the You tab, scroll the insights section; open the journal and an entry detail; add a note
      - Swipe an entry to delete and tap UNDO on the snackbar
      - Delete another, open Trash, restore it
    expected:
      - Insights and journal render without clipping in light and dark
      - UNDO brings the entry straight back in place; Trash lists the deleted one and restore returns it
      - A 409 "newer entry has taken its place" restore shows the explanatory message, not "not found"

  - id: UAT-JRNL-008
    title: A placed trade and a blocked trade both appear in You > Journal
    layer: device
    plans: [floor_pass]
    preconditions:
      - 'A trade placed and a trade refused earlier in the same run (UAT-SIM-028, UAT-SIM-029)'
    steps:
      - 'You > JOURNAL; read the entries; filter by TRADE'
    expected:
      - 'The filled buy is listed as a TRADE entry naming the ticker and price'
      - 'The refused order is listed as BLOCKED with its reason'
      - 'Selling the whole position adds a closed entry titled "Closed <ticker> (MANUAL) — +$12.34" or "— -$12.34" (sign before the dollar sign, never $-12.34); opening it shows Closed price as $<price> and Realised P&L as +$12.34 or -$12.34 (never RM)'
    notes: 'CR282 lane F1 (2026-11-24): the journal detail rows use the one money formatter. DEF532 (AT:B1): a sell order is the app''s only manual exit, and it used to leave only "SELL n X … Opened at" with no closed entry (the Android run''s expectation 3 failure); it now writes the closed entry, asserted by UAT-JRNL-013. The executor of this case does not assert the format (the run''s own buy is still open, so it has no Realised P&L row); read it from a closed trade''s entry on the device.'

  - id: UAT-JRNL-009
    title: Entry detail outcome chips stay on-screen on a narrow phone with large text
    layer: manual
    plans: [floor_pass]
    platforms: [android]
    preconditions:
      - 'A phone about 360dp wide (or Android display size set to Large) with system font size at the largest setting; at least one TRADE journal entry'
    steps:
      - 'You > JOURNAL; open a TRADE entry; scroll to the note card'
    expected:
      - 'The OUTCOME label and the WIN, LOSS and PENDING chips are all fully visible inside the note card; chips that do not fit wrap onto a second line (DEF469)'
      - 'The detail header shows no overflow stripes or clipped title'

  - id: UAT-JRNL-010
    title: A trade placed without a Room verdict says "AMI advice", not "AI advice"
    layer: manual
    plans: [floor_pass]
    steps:
      - 'Place a trade without convening the Room; open its journal entry'
    expected:
      - 'The detail shows "AMI advice: Without - manual trade", translated in Arabic and Bahasa Melayu (DEF478)'

  - id: UAT-JRNL-011
    title: A Room whose verdict flipped shows a "Changed from X to Y" line in the Journal list and the full card in its detail
    layer: manual
    plans: [floor_pass]
    preconditions:
      - 'Two completed Rooms on the same ticker with different verdicts (a flip cannot be forced on a real-model Room; see UAT-ROOM-032)'
    steps:
      - 'You > JOURNAL; find the newer Room entry; open it'
    expected:
      - 'The list tile carries "Changed from <PREVIOUS> to <NEW>: " and the first changed input, or the same-inputs / not-compared sentence (CR267 WP-25)'
      - 'The detail shows the same CHANGED FROM card as the Room verdict card'


  - id: UAT-JRNL-012
    title: With Bursa on, a closed Bursa trade's journal entry reads its amounts in RM
    layer: device
    plans: [floor_pass]
    preconditions:
      - 'Build 0.1.0+130 or later (TestFlight internal or Play internal), which has AMI_BURSA on; store builds keep it off'
      - 'Alpha with MARKET_BURSA_ENABLED=true (on since 2026-11-24)'
      - 'A Bursa position (UAT-SIM-037) sold in full from its holding, in Bursa hours'
    steps:
      - 'You > JOURNAL; read the BUY 1155.KL entry; open the closed 1155.KL trade entry'
    expected:
      - 'The opened entry reads "BUY 100 1155.KL @ RM<price>" with "Opened at RM<price>" and no $ anywhere'
      - 'The closed entry title and summary read "Closed 1155.KL (MANUAL) — +RM<amount>" (or "— -RM<amount>") and "Sold 100 at RM<price>."'
      - 'Closed price and Realised P&L rows read RM<price> and +RM<amount> or -RM<amount> (a break-even close still shows the row, as +RM0.00); a US trade entry beside it still reads $'
      - 'On the closed entry, Opened at is the time of the BUY and Closed at the time of the sell (a buy at 5:35 PM sold at 5:36 PM reads Opened at 5:35 PM, never the close time) (DEF540)'
    notes: 'CR282 lane C/F1 + DEF532 (AT:B1): journal text takes its symbol from the ticker''s market (trading_math.markets.format_money) and the detail rows from formatMoney; a sell that closes shares writes the closed entry (it used to stay "SELL … Opened at $…"), and a Bursa stop/target close by the sweep is journaled too. Asserted at API level by UAT-JRNL-014 when Bursa is in session. Active since 2026-11-24: needs a run on build 0.1.0+130 or later (not release-blocking; a store build cannot run it).'

  - id: UAT-JRNL-013
    title: Selling a whole US position writes a closed Journal entry with the realised P&L in dollars
    layer: api
    plans: [trader]
    steps:
      - 'Patch a permissive mandate; buy 2 MSFT, then sell 2 MSFT (POST /v1/sim/submit)'
      - 'GET /v1/journal/{user_id}?entry_type=sim_trade'
    expected:
      - 'The list holds the BUY entry (pending) and one entry tagged closed titled "Closed MSFT (MANUAL) — <+|->$<amount>" with the sign before the dollar sign'
      - 'Its payload trade carries status closed, closed_price equal to the sell fill, and a realised_pnl equal to the lots endpoint total'
      - 'The summary reads "Sold 2 at $<fill>."; no entry reads "$-" or "$+"'
    notes: 'DEF532 (AT:B1). Off-hours market orders fill at the last close (see test_sim_trading), so this does not depend on US market hours.'

  - id: UAT-JRNL-014
    title: A Bursa fill is journaled in ringgit (when the switch is on) and refused when it is off
    layer: api
    plans: [trader]
    steps:
      - 'Place a market BUY of 100 1155.KL'
      - 'GET /v1/journal/{user_id}?entry_type=sim_trade'
    expected:
      - 'Switch off: the order is refused 422 and the Journal holds no 1155.KL entry'
      - 'Switch on and Bursa in session: the fill is journaled as "BUY 100 1155.KL @ RM<price>" with no $ in the title or summary; selling the 100 adds "Closed 1155.KL (MANUAL) — <+|->RM<amount>"'
      - 'Switch on and Bursa closed: the order rests (no fill), and nothing is journaled until it fills'
    notes: 'DEF532 (AT:B1). Which of the last two applies depends on the time of day on Alpha; the executor asserts whichever the server reports and never skips.'
