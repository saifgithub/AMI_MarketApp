area: support
code: SUPP
title: Bug reports, AMI help library & telemetry
order: 16
covers:
  - backend/app/api/feedback.py
  - backend/app/api/ai_coach.py
  - backend/app/api/telemetry.py
  - mobile/lib/screens/feedback/**
  - mobile/lib/screens/coach/**
summary: |
  Users can report a bug with or without a session; the endpoint is
  IP-rate-limited and refuses bad input. The resolution feed is private.
  Telemetry ingest is per-user and idempotent while the segment read is
  admin-only. The help library (ai_coach) serves static, well-formed Q&A with
  no LLM call. Bug reports filed by this suite land in the real triage queue and
  are prefixed "[CR263 UAT - ignore]"; at most three are filed per run.
cases:
  - id: UAT-SUPP-001
    title: A signed-in user can submit a bug report
    layer: api
    plans: [floor_pass]
    steps:
      - POST /v1/feedback/bug (multipart) with a valid category, a "[CR263 UAT - ignore]" title, app_version, platform ios and a bearer token
    expected:
      - 201 with an id, status open and created_at; no attachment path
      - The same user's GET /v1/feedback/updates is still empty (open reports are not resolution updates)

  - id: UAT-SUPP-002
    title: An anonymous caller can still submit a bug report
    layer: api
    plans: [anon]
    steps:
      - POST /v1/feedback/bug with no Authorization header and platform android_gms
    expected:
      - 201 with an id and status open (the report is kept even without a user_id)

  - id: UAT-SUPP-003
    title: Missing fields, an empty title and a disallowed attachment are refused
    layer: api
    plans: [anon]
    steps:
      - POST with missing required fields, an empty title, an unsupported attachment MIME (text/plain)
    expected:
      - Missing fields and empty title are 422; text/plain attachment is 415
      - Nothing is stored for any of these

  - id: UAT-SUPP-004
    title: Bug-report submission is rate-limited per IP
    layer: api
    plans: [anon]
    steps:
      - POST invalid bug reports (nothing enters the triage queue) from this client, without the operator exemption header, until the first 429 (at most 6 - the bucket may already be partly spent)
      - POST one more with a spoofed X-Forwarded-For and cf-connecting-ip
    expected:
      - Every response before the first 429 is 422, and a 429 arrives within 6 requests with rate_limit_exceeded (DEF186, 5 per hour)
      - The spoofed-header request is still 429 - forwarded headers from an untrusted peer open no new bucket (DEF464); per-IP key separation itself is covered by the DEF464 unit tests

  - id: UAT-SUPP-005
    title: Resolution updates and acknowledgements are private to the reporter
    layer: api
    plans: [floor_pass]
    steps:
      - GET /v1/feedback/updates with and without a token
      - POST /v1/feedback/{random_id}/ack with and without a token
    expected:
      - Updates is 200 and a list for the owner, 401 with no token
      - Ack of an unknown report is 404 for a signed-in user (same as someone else's), 401 with no token

  - id: UAT-SUPP-006
    title: Telemetry ingest is per-user, validated and idempotent
    layer: api
    plans: [floor_pass]
    steps:
      - POST /v1/telemetry/events with two events
      - POST the same batch again
      - POST an unknown event_type, an empty batch, and a batch with no token
    expected:
      - First batch returns accepted 2, duplicates 0; the replay returns accepted 0, duplicates 2
      - Unknown event_type is 422 naming the allowed set; empty batch is 422; no token is 401
      - The payload has no way to name another user (extra user_id is ignored, rows land under the token's user)

  - id: UAT-SUPP-007
    title: Telemetry segment counts are admin-only
    layer: api
    plans: [floor_pass]
    steps:
      - GET /v1/telemetry/segments with no token and with a normal user token
      - GET with the admin secret over a window containing a just-ingested event
      - GET with since >= until
    expected:
      - Anonymous and normal-user calls are 403 and return no counts
      - Admin gets 200 with users, bounce, convene, depth, locales and dropped_events, counting the UAT user (users at least 1)
      - since >= until is 422

  - id: UAT-SUPP-008
    title: AMI help library serves static, well-formed Q&A without the LLM
    layer: api
    plans: [anon]
    steps:
      - GET /v1/ai_coach/categories
      - GET by_category for each category; GET /search?q=stop loss; GET by_id for a hit
      - GET search with an empty q, an over-long q and limit 0; GET by_id for an unknown id
    expected:
      - Non-empty category list; every category returns a non-empty item list whose total equals its length
      - Every item has non-empty question, short_answer and long_answer, and a unique id
      - Search returns scored hits (stop-loss query hits the stop-loss Q&A); by_id returns the same record
      - Empty q, q over 200 chars and limit 0 are 422; unknown id is 404; a nonsense query returns 200 with zero hits

  - id: UAT-SUPP-011
    title: An unknown bug category or platform is a client error, never a 500
    layer: api
    plans: [anon]
    steps:
      - POST with category "nonsense" (valid platform)
      - POST with platform "palm" (valid category)
    expected:
      - Both are 422 (or another 4xx) naming the bad field, not 500 internal server error
      - Nothing is stored

  - id: UAT-SUPP-009
    title: In-app bug reporter and resolution toast work on iPhone
    layer: manual
    plans: [floor_pass]
    preconditions:
      - TestFlight build on an iPhone
      - Saiful flips one tester report to resolved with a resolution note from the admin side
    steps:
      - Open the bug reporter, pick a category, write a title prefixed "[CR263 UAT - ignore]", attach a screenshot, submit
      - Cold-start the app after the report is marked resolved
    expected:
      - Submit shows a confirmation and the photo is accepted; no crash on a large screenshot
      - A resolution toast shows the note verbatim exactly once and does not return on the next cold start

  - id: UAT-SUPP-010
    title: AMI help screen reads well and answers offline-style questions
    layer: manual
    plans: [floor_pass]
    steps:
      - Open the help / coach screen; browse a category; search for "stop loss" and for gibberish
    expected:
      - Categories and answers render with correct line wrapping; search shows relevant results and an honest empty state for gibberish
      - No screen says "the AI" - the assistant is named AMI

  - id: UAT-SUPP-012
    title: The bug-report sheet opens from Settings and refuses an empty submission (nothing is sent)
    layer: device
    plans: [any]
    steps:
      - 'You > SETTINGS > HELP > Report a problem'
      - 'Tap submit with the title empty'
    expected:
      - 'The sheet opens with a category, title and steps field'
      - 'Submitting with the required fields empty shows a validation message and sends nothing'
    notes: Never submits - submissions land in the real triage queue. On iOS blocked by DEF466 (the pane that holds Report a problem is below PROFILE).

  - id: UAT-SUPP-013
    title: The bug-report sheet and the Q&A library are localised and say AMI
    layer: manual
    plans: [floor_pass]
    preconditions:
      - 'App language set to Arabic (repeat in Bahasa Melayu)'
    steps:
      - 'Settings > HELP > Report a problem; read the categories, fields, photo options and send button'
      - 'Settings > HELP > Ask AMI; search for something with no match'
    expected:
      - 'Every label in the sheet is translated; the category ids the server receives are unchanged (DEF478)'
      - 'The library is titled "Ask AMI" (never "AI Coach"); its hint, empty result and RELATED LESSONS / RELATED AGENTS headings are translated'

  - id: UAT-SUPP-014
    title: A bug report stores the trace ids it carries and refuses malformed ones
    layer: api
    plans: [floor_pass]
    steps:
      - POST /v1/feedback/bug with two fresh UUIDs in trace_ids (comma-separated) and a "[CR263 UAT - ignore]" title
      - Admin GET the report
      - POST with a trace_ids value that is not a UUID list, and with six UUIDs, from a synthetic client IP
    expected:
      - 201; the admin detail shows trace_ids as the two UUIDs, comma-separated
      - Both malformed submissions are 422 and store nothing
    notes: CR239 / WP-38. Files one extra triage-queue report per run, closed out at once like SUPP-001/002.

  - id: UAT-SUPP-015
    title: A "Report this response" report rides the ordinary bug endpoint and names the Room and the desk
    layer: api
    plans: [floor_pass]
    steps:
      - POST /v1/feedback/bug with category wrong_data, a "[CR263 UAT - ignore]" title, route response:room:<uuid>:risk_officer and one trace id
      - Admin GET the report
    expected:
      - 201; the admin detail shows the same route and the trace id, so a report maps to one Room, one desk and the request log lines
      - There is no second reporting endpoint; the report is closed out at once like SUPP-001
    notes: CR278 / WP-36. The route shape is response:<surface>:<run id or ->:<agent id>[:t<turn>]. Files one extra triage-queue report per run.

  - id: UAT-SUPP-016
    title: Long-pressing a Concierge reply offers "Report this response" and opens the sheet filled in
    layer: device
    status: blocked
    blocked_on: The Appium script for this case is not written yet (CR278 shipped the cases and the app controls)
    plans: [any]
    steps:
      - Open the Concierge interview (a fresh install, or Settings > restart onboarding)
      - Long-press one of AMI's replies, then tap "Report this response"
      - Read the sheet, then close it without sending
      - Long-press one of your own messages
    expected:
      - A one-row sheet offers "Report this response"; tapping it opens the report sheet titled "Problem with a response from AMI" with the category set to Wrong data
      - Closing the sheet sends nothing
      - Long-pressing your own message offers nothing
    notes: CR278 / WP-36. The same gesture works on 1-on-1 and Brief replies and on Room desk rows.

  - id: UAT-SUPP-017
    title: The website waitlist stores a consented sign-up, refuses the rest, and the admin export hands it over once
    layer: api
    status: blocked
    blocked_on: CR267 WP-51 is not deployed to api-website yet and the suite has no WEBSITE_ADMIN_SECRET (put it in qa/uat/.uat.env as UAT_WEBSITE_ADMIN_SECRET). Flip to active after Saiful approves the deploy.
    plans: [anon]
    steps:
      - POST api-website /waitlist with a unique example.invalid address, consent true and platform ios
      - POST /waitlist for the same address again; POST one with consent false, one with the honeypot field filled, one with a malformed address
      - GET /admin/waitlist/export with no secret, with a wrong secret, and with the secret
      - POST /admin/waitlist/mark-invited for the new row (batch "uat"), then GET the export again
    expected:
      - First sign-up is 200 {ok true, new true}; the repeat is 200 {ok true, new false}
      - Missing consent is 422 consent_required; the honeypot answers 200 but its address never reaches the export; the malformed address is 200 {ok false}
      - The export is 403 without or with a wrong secret and CSV with the right one, listing the new address once with platform ios and a consent_at
      - After mark-invited the address is gone from the export
    notes: Targets the website API (UAT_WEBSITE_BASE_URL, default https://api-website.agenticmarketintel.ai), not the app backend. The test row is marked invited at once so no real invite batch ever contains it.
