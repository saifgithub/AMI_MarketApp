  - id: UAT-ROOM-037
    title: A debt-default warning names the user's own horizon and minimum coverage, and a covered one is dropped with the same numbers
    layer: manual
    llm: true
    plans: [trader]
    preconditions:
      - 'A backend and app build carrying CR285, with the Ling grader on ROOM_GRADER_LING_TERMINAL=v2'
      - 'Settings > RISK LIMITS > Debt-maturity horizon set to 60 and Minimum debt coverage set to 3.0 (the maximums), so any company with debt due in five years is held to the strictest test'
    steps:
      - 'Convene a Room on a US ticker with a debt-maturity schedule on its fact sheet (BGS, CAG or SO have drawn a debt-default flag) and wait for the verdict'
      - 'Open the verdict card and read the reason'
      - 'Set Debt-maturity horizon to 6 and Minimum debt coverage to 0.5 (the minimums), save, and convene the same ticker again'
    expected:
      - 'If the Room passes on a debt default, the reason ends with an AMI note in brackets, "AMI debt check: <amount> falls due within your 60-month horizon; cash and cash flow cover <X>×, below your minimum of 3.00×, so the debt risk counts against this trade." (the desk''s own horizon reads "the desk''s <N>-day horizon (longer than your 60-month setting)" when it is longer); the note is written by AMI itself, so it is there however the CIO worded the rest of the reason'
      - 'A Room whose debt-default flag is dropped ends its reason with the same note in the same words, "... cash and cash flow cover <X>×, at or above your minimum of <Y>×, so the debt risk was not counted."; with nothing due in the horizon it says "no principal falls due within your <N>-month horizon", and with no maturity schedule "no debt-maturity schedule is available for this company"'
      - 'The note appears once, with no "debt_default" wording, and on a Bursa (.KL) Room its amounts are in RM'
      - 'The same ticker is a new, charged Room because the mandate changed (UAT-ROOM-029); with the loosest numbers a flag that stood before is more likely to be covered'
    notes: 'CR285, 2026-11-26. A real-model Room cannot be steered to a debt-default flag, so the forced settings only make the numbers easy to see. The rule is pinned by backend/tests/unit/test_cr285_debt_coverage.py and the offline re-score in docs/forward_planning/CR267_beta_programme/terminal_v2/terminal_v2_materiality.md. Off on Alpha until ROOM_GRADER_LING_TERMINAL=v2. DEF553, 2026-11-26: Android AMI-DL-41 failed this case because the CIO''s narration dropped the numbers (the check stood, 0.36× against a 3.00× minimum, but the reason never said so); the runner now appends the AMI debt-check note itself, pinned by backend/tests/unit/test_def553_debt_check_note.py. A Room banked before the deploy lacks the note (grader tag termchk=d3 re-runs it once).'

  - id: UAT-ROOM-038
    title: A Bursa Room states the stock's PN17/GN3 status with the date of the list, or says it is unavailable
    layer: manual
    llm: true
    plans: [trader]
    preconditions:
      - 'A backend carrying CR286 deployed to Alpha, with MARKET_BURSA_ENABLED=true and a Bursa app build'
      - 'The weekly refresh has run on melehost at least once (ssh melehost "tail ~/ami_trade/logs/cr286_bursa_pn17_refresh.log"; its last line is the run result) or a human-entered seed was loaded with --from-file'
    steps:
      - 'Convene a Room on a 1155.KL (a stock that is not on Bursa''s PN17/GN3 list) and wait for the verdict'
      - 'Read the end of the Fundamentals Analyst''s turn'
      - 'If the refresh has not succeeded in the last 14 days, or has never succeeded, repeat and read the same line'
      - 'If any stock on the list is available (the refresh log or the sheet names one), convene a Room on it and read the same line'
    expected:
      - 'The Fundamentals Analyst''s turn ends with an AMI note beginning "Bursa PN17/GN3 status:" that says either "not on Bursa''s PN17/GN3 list (Bursa''s list updated <date>, read by AMI <date>)" or, for a listed stock, the category (PN17, GN3 or affected listed issuer under paragraph 8.03A), the plan stage, "trading suspended" when Bursa shows the company suspended, when AMI first saw it on the list, and "Bursa''s list updated <date>, read by AMI <date>"'
      - 'The two dates differ when Bursa has not updated its list since an earlier month (Bursa''s date is the page''s "Last updated" date, not the day AMI read it); a load without Bursa''s date says only "read by AMI <date>"'
      - 'When the last successful read is more than 14 days old, or none is on record, the note says "unavailable" with the last successful read date (or that none is on record) and never a status; if the latest attempt failed it names why (Bursa''s site refused the request, the page could not be read as a list, or could not be fetched)'
