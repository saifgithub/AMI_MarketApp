area: room
code: ROOM
title: Convene the Room
order: 6
covers:
  - backend/app/api/room.py
  - backend/app/api/room_rating.py
  - backend/app/api/sse.py
  - backend/app/services/room_bank.py
  - mobile/lib/screens/room/**
summary: |
  The 12-desk Room: a funded run streams every desk to a CIO verdict, is billed
  at the documented price, and is refused cleanly (no run, no verdict) when the
  user cannot pay. The cases test the guarantee, not the status code: a failure
  must never surface as a confident APPROVE (DEF059), and a run belongs to its
  owner alone. Alpha runs the Winzip funnel (GTM_FUNNEL=winzip), so a Floor Pass
  wall is the soft, cooldown-carrying kind. Tenure pull-back of analysts
  (CR098) is disabled on Alpha (ROOM_PULLBACK_DAYS_* = 0), so a withheld chair
  cannot be reached with a fresh account; the roster case asserts the full desk.
  DEF481 (2026-11-20, build 120): the Room back control carries ami.nav.back and the CONVENE button carries its ami.sheet id. Accessibility identifiers only; nothing a
  user sees or does changed, so no case steps change.
  WP-24 (2026-11-20): the old "same ticker within 24 h returns yesterday's Room"
  window is gone. A convene is handed a finished Room only when its INPUTS match
  (user, ticker, mandate content, the trading day's frozen fact sheet, policy
  version, model root, and the user's portfolio, ticker journal entries and any
  linked paper account); that return is free. A changed mandate, any trade, a new
  trading day, a new prompt generation or a different model is a new Room and is
  charged.
  A failed, cancelled, refunded or outage Room is never handed back.
  2026-11-22 DEF200 (deploy #20): this area's request handlers now run their blocking DB/file calls in the threadpool instead of on the event loop; no change to any response, status or behaviour, so its cases stand as written (the API cases re-run after the deploy). Also CR244 part 2 (deploy #20): the recent-filings feed (Macro & Events, Fundamentals) and the float + dollar-volume feed (Execution Desk, Conservative Risk Officer only) are switched on in Alpha; both ride the Room bank policy version, so a Room banked before the deploy is re-run once. Verdict shape unchanged.
cases:
  - id: UAT-ROOM-001
    title: A funded Room streams every desk through to a CIO verdict
    layer: api
    plans: [floor_pass]
    llm: true
    preconditions:
      - Fresh Floor Pass user holding exactly 8 credits (one Basic Room)
    steps:
      - POST /v1/room/stream for AAPL and read the SSE stream to the end
      - GET /v1/room/{run_id} from the X-Room-Run-Id header
    expected:
      - The stream is started, then phase / agent_token / agent_done events, exactly one verdict, then done; no error event and no event kind outside the documented set
      - At least 8 real desks finish speaking and the Chief Investment Officer (portfolio_manager) is one of them
      - The verdict has an action from APPROVE / REJECT / MODIFY / PASS / NO_VERDICT and a non-empty reason
      - The persisted run is completed, its verdict equals the streamed one, and every transcript entry names a real agent with content

  - id: UAT-ROOM-002
    title: A Floor Pass Room debits exactly the Basic price and no surcharge it cannot afford
    layer: api
    plans: [floor_pass]
    llm: true
    preconditions:
      - Fresh Floor Pass user holding exactly 8 credits
    steps:
      - Run the Room as in UAT-ROOM-001
      - Read the admin view of the balance afterwards
    expected:
      - done.credit_cost is 8 and the balance fell from 8 to 0 (or, if the run was refunded, is back at 8)
      - live_data_notice reports surcharge_charged 0 because the balance could not cover base plus surcharge
      - The persisted run's credit_cost is 8

  - id: UAT-ROOM-003
    title: The Room price shown to each plan matches the documented price list
    layer: api
    plans: [floor_pass, trader, floor_manager]
    steps:
      - For a Floor Pass, a Trader and a Floor Manager user, GET /v1/mandate/{user_id}
    expected:
      - room_cost is 8 for Floor Pass, 8 for Trader and 25 for Floor Manager

  - id: UAT-ROOM-004
    title: A Floor Manager Room debits the premium price
    layer: api
    plans: [floor_manager]
    llm: true
    preconditions:
      - Fresh Floor Manager user holding 500 credits
    steps:
      - POST /v1/room/stream for KO and read it to the end
    expected:
      - done.credit_cost is 25 plus 0, 2 or 4 live-data surcharge and refunded is false
      - The balance fell by exactly done.credit_cost

  - id: UAT-ROOM-005
    title: A Floor Pass user with no credits is refused, with no run and no verdict
    layer: api
    plans: [floor_pass]
    preconditions:
      - Fresh Floor Pass user holding 0 credits
    steps:
      - POST /v1/room/stream for AAPL
      - If the response carries a funnel cooldown, POST again during the cooldown
      - GET /v1/room/user/{user_id}
    expected:
      - 402 with detail.code insufficient_credits, cost 8, plan floor_pass, and no SSE body at all (no fabricated verdict or approval)
      - No X-Room-Run-Id header and the user's run list stays empty
      - Under the Winzip funnel the 402 carries cooldown_until / retry_after_seconds, and a second attempt inside the cooldown is refused the same way

  - id: UAT-ROOM-006
    title: A paid-plan user short of credits hits the hard wall untouched
    layer: api
    plans: [trader]
    preconditions:
      - Fresh Trader user holding 5 credits
    steps:
      - POST /v1/room/stream for AAPL
    expected:
      - 402 insufficient_credits with balance 5, cost 8, plan trader, a resets_at date, and no funnel field
      - The balance is still 5 and no run exists

  - id: UAT-ROOM-007
    title: Nobody else can read, retry or replay another user's run
    layer: api
    plans: [floor_pass, trader]
    llm: true
    steps:
      - With a finished run owned by user A, as user B GET /v1/room/{run_id}
      - As B GET /v1/room/user/{A}, POST /v1/room/runs/{run_id}/cio-retry, and POST /v1/room/stream with A's user_id in the body
    expected:
      - Each is refused 403 and returns no transcript, verdict or stream
      - B's own run list does not contain A's run, and A can still read it

  - id: UAT-ROOM-008
    title: Bad requests and missing auth are refused before anything is charged
    layer: api
    plans: [trader, anon]
    steps:
      - GET and cio-retry an unknown run id, and GET a malformed id
      - POST /v1/room/stream with a nonexistent ticker (ZZZZZZ), a blank ticker, and another user's id in the body
      - Call the Room routes with no bearer token
    expected:
      - Unknown run 404, malformed id 422, nonexistent ticker 422, blank ticker 400/422, mismatched body user 403
      - The user's balance is unchanged and no run row is created
      - Every Room route returns 401 without a token

  - id: UAT-ROOM-009
    title: Asking the CIO again is free and only offered after a CIO outage
    layer: api
    plans: [trader]
    llm: true
    steps:
      - After a finished run, read cio_retry_available from GET /v1/room/{run_id} and from the done event
      - POST /v1/room/runs/{run_id}/cio-retry and read the stream
    expected:
      - The two availability flags agree
      - The retry never changes the balance
      - For a run with a reasoned verdict (flag false) the retry is declined with an error event and a done event, no new verdict, and the stored verdict is untouched
      - For an outage PASS (flag true) the retry yields a verdict or an error, never silent success

  - id: UAT-ROOM-010
    title: A failed or scripted CIO never yields a confident approval
    layer: api
    plans: [floor_pass, trader, floor_manager]
    llm: true
    steps:
      - For each completed Room produced in this suite, read the persisted run
    expected:
      - Every run reached completed
      - An APPROVE is never issued by a scripted CIO or built on a scripted Execution Desk
      - An outage-shaped verdict (CIO down => PASS, or too few live desks => NO_VERDICT) is never a trade call, is flagged refunded, and the full price is returned
      - Out-of-credit attempts (UAT-ROOM-005/006) produced no verdict at all

  - id: UAT-ROOM-011
    title: A new account sees the full analyst roster
    layer: api
    plans: [floor_pass, trader]
    llm: true
    steps:
      - Read the SSE events and verdict of a Floor Pass run and a Trader run on day-0 accounts
    expected:
      - No agent_withheld event and verdict.opinions_not_included is empty
      - Fundamentals Analyst and Technical Strategist both finish speaking
    notes: Tenure pull-back (CR098) is off on Alpha (ROOM_PULLBACK_DAYS_*=0); revisit when a threshold is enabled and an aged account can be seeded.

  - id: UAT-ROOM-012
    title: Convening again with unchanged inputs returns the same Room and charges nothing
    layer: api
    plans: [floor_pass]
    llm: true
    preconditions:
      - The Floor Pass user from UAT-ROOM-001, now holding 0 credits, whose first Room finished with a real verdict (a refunded outage Room is never banked, so this case is skipped for it)
    steps:
      - POST /v1/room/stream again for the same ticker, with the mandate untouched
    expected:
      - 200 (not 402), the same run id, X-Room-Cached true and X-Room-Banked true, a replayed verdict equal to the original, and a done event
      - done.banked is true, done.credit_cost is 0 and done.refunded is false (the return cost this convene nothing, whatever the first Room cost)
      - The user still has exactly one run and the balance is unchanged
    notes: WP-24 (2026-11-20). Replaces the 24 h same-ticker window; the return now depends on the inputs, see UAT-ROOM-030 for the other half.

  - id: UAT-ROOM-013
    title: The live-data surcharge is disclosed and matches the debit
    layer: api
    plans: [trader]
    llm: true
    preconditions:
      - Fresh Trader user holding 150 credits
    steps:
      - Run a Room for MSFT and read live_data_notice and done
    expected:
      - live_data_notice.surcharge_charged is 0, 2 or 4
      - done.credit_cost and the persisted credit_cost equal 8 plus that surcharge, and the balance drop equals it - unless the run was an outage (DEF432), in which case refunded is true and the whole charge, surcharge included, is back

  - id: UAT-ROOM-014
    title: Convene sheet, live console, verdict card and cost line on a real iPhone
    layer: manual
    plans: [trader]
    preconditions:
      - TestFlight build on an iPhone, signed in as a Trader with credits
    steps:
      - Open the Room tab, pick a ticker and convene
      - Watch the console stream; lock the phone for 20 seconds mid-run, then unlock
      - Read the verdict card and the cost line; tap through the desk transcripts
    expected:
      - The sheet shows the Room price before convening; desks light up in order with colour per family
      - After the lock/unlock the run resumes or shows the finished verdict (the run is not lost)
      - The verdict card shows action, levels and reason; the cost line states what the Room cost
      - Agent names read Chief Investment Officer, Risk Officer, Execution Desk, Technical Strategist, Flow & Positioning, Macro & Events

  - id: UAT-ROOM-015
    title: Out-of-credits wall on a real iPhone
    layer: manual
    plans: [floor_pass]
    preconditions:
      - A Floor Pass test account with no credits (Saiful drains it from the admin console)
    steps:
      - Try to convene a Room
    expected:
      - A wall (not a crash or an empty console) with the credit price and, under Winzip, a live countdown to the next free Room
      - No verdict card appears and nothing is added to the Journal

  - id: UAT-ROOM-016
    title: Convening the Room on AAPL streams to a CIO verdict card with a decision
    layer: device
    llm: true
    plans: [floor_pass]
    preconditions:
      - 'The account has Room credits (the Convene sheet shows the price and the balance)'
    steps:
      - 'On the Floor tap CONVENE THE ROOM; read the price line; pick AAPL (if AAPL already ran on this account today, pick a US name it has not: MSFT, then NVDA); tap CONVENE'
      - 'Wait for the run to finish (up to ten minutes)'
    expected:
      - 'The Convene sheet states the Room price and the user''s credits before anything is charged, and says how much live news and social data can add ("up to +4 more ...") so the final charge is never a surprise (DEF495)'
      - 'The credits actually charged are the price shown, plus at most the "up to" amount'
      - 'The Room opens on AAPL and streams desk by desk'
      - 'The run ends on a verdict card with a decision (BUY / SELL / HOLD style action), not an error or an empty card'
      - 'Any entry, stop or target the verdict card quotes reads $<price> with the $ in front, on an English and on a Malay-language phone, and never RM on a US ticker'
    notes: 'CR282 lane F1 (2026-11-24): the verdict card and the existing-trade line use the one money formatter. The executor does not assert the format; read it from the run''s verdict screenshot. Same inputs, same Room (WP-24): a second same-day run on a ticker whose inputs have not changed shows "Inputs unchanged since your last run ... No credits used." instead of streaming, which is correct behaviour and not this case (AMI-DL-29) - pick another name.'

  - id: UAT-ROOM-017
    title: The Convene picker opens pre-filled when launched for a ticker
    layer: manual
    plans: [any]
    preconditions:
      - A watchlist containing GOOGL
    steps:
      - From the GOOGL watchlist action sheet tap CONVENE THE ROOM
    expected:
      - The picker shows GOOGL in the field with the Room price and balance line above it
      - Nothing is charged until CONVENE is tapped; opening the picker from the Floor still starts with an empty field

  - id: UAT-ROOM-018
    title: A slow Room run is waited out to its verdict, and a lost connection never silently gives up
    layer: manual
    plans: [any]
    preconditions:
      - A Room that takes several minutes (slow model day), or a device you can put in airplane mode briefly
    steps:
      - Convene the Room; once desks are speaking, switch to airplane mode for about 20 seconds, then back online
      - Repeat, this time staying offline for over two minutes before reconnecting
      - Tap CHECK AGAIN
    expected:
      - After the short drop the screen shows the 'Connection lost... still running' banner, then the transcript catches up and the run lands on its verdict - it never ends on 'Reconnect timed out'
      - After the long outage the screen shows an explicit card saying AMI cannot confirm the Room has finished, that the result is saved to the Journal, and a CHECK AGAIN button - not a silent stop
      - CHECK AGAIN resumes the wait and the verdict appears once the run has finished

  - id: UAT-ROOM-019
    title: Backing out of a Room that is still deliberating warns and keeps the run going
    layer: manual
    plans: [any]
    preconditions:
      - A funded account
    steps:
      - Convene the Room on AAPL and, while desks are still speaking, tap the back arrow (and separately use the system back gesture)
      - Tap STAY; then back again and tap LEAVE
      - Open the Journal after a few minutes
    expected:
      - A 'Leave the Room?' prompt says the Room keeps deliberating without you and the verdict will be saved to your Journal; nothing is dismissed silently
      - STAY keeps the live Room on screen; LEAVE returns to the previous screen
      - The AAPL verdict appears in the Journal once the run finishes; a finished Room leaves with no prompt

  - id: UAT-ROOM-020
    title: When the main model fails mid-Room, the app clears the discussion and says AMI switched to the backup
    layer: manual
    plans: [any]
    preconditions:
      - An Alpha backend whose primary LLM can be made to fail mid-run (operator action) with the backup slot configured
    steps:
      - Convene the Room and wait until a few desks have spoken
      - Have the operator take the primary LLM down so the run restarts on the backup
    expected:
      - The desks shown so far disappear and a notice reading 'AMI switched to its backup model and restarted the discussion.' is shown
      - The discussion then runs again from the first desk to a verdict; no turn from before the switch remains on screen

  - id: UAT-ROOM-021
    title: A Room stream stays open through a long silent model turn
    layer: manual
    plans: [any]
    preconditions:
      - A moment when the LLM is slow, or an operator-throttled LLM
    steps:
      - Convene the Room and keep it open while one desk takes over 100 seconds to start speaking
    expected:
      - The live connection is not dropped by the proxy's idle timeout (keepalive comments every 15 s); the Room continues to its verdict without showing the connection-lost banner

  - id: UAT-ROOM-022
    title: Review a Training session from the Room switches to the LESSONS tab
    layer: manual
    plans: [floor_pass]
    steps:
      - 'Open a Room that is waiting on its next session or is out of credits; tap Review a Training session'
    expected:
      - 'The LESSONS tab opens with LESSONS highlighted in the bottom bar, not a second Lessons screen over the Floor (DEF476)'

  - id: UAT-ROOM-023
    title: A finished Room's verdict carries the Street comparison, computed after the decision and labelled with its source
    layer: api
    plans: [floor_pass]
    llm: true
    preconditions:
      - Fresh Floor Pass user holding exactly 8 credits (one Basic Room), as in UAT-ROOM-001
    steps:
      - Run the Room on AAPL as in UAT-ROOM-001 and read the streamed verdict
      - GET /v1/room/{run_id} and read verdict.street_comparison
    expected:
      - The streamed and the persisted verdict both carry a street_comparison block whose source_label names the data source (Yahoo Finance via yfinance) and whose room_action equals the verdict action
      - When status is available it has a recognised street_rating, a street_stance of buy / hold / sell, a positive analyst_count when one is given, and agreement consistent with the action (approve with Buy agrees; approve with Sell differs and is flagged approved_against_street_sell; a PASS on a Buy name differs and is not flagged)
      - When status is unavailable it has an unavailable_reason and no rating, count or target - never an empty or zero rating
      - reasons_from_narrow_answers is present and empty (the narrow-question judge, WP-22, is not built)
      - No desk transcript line quotes the Street comparison's source label (the Room decides blind)

  - id: UAT-ROOM-024
    title: The verdict card shows how the Street rates the name, with its source, and the Settings switch hides it
    layer: manual
    plans: [floor_pass]
    preconditions:
      - 'A Floor Pass account with Room credits on a build with the Street-rating card (the default setting is ON)'
    steps:
      - 'On the Floor tap CONVENE THE ROOM, pick AAPL, tap CONVENE and wait for the verdict card'
      - 'Scroll the verdict card below the reasoning'
      - 'Open Settings, find STREET RATING and turn the switch off; go back to the Room result (or open the same run from the Journal)'
      - 'Turn the switch on again and look at the same result'
    expected:
      - 'A card headed HOW THE STREET RATES IT shows the Street rating, the number of analysts, the mean target and THE ROOM''S CALL, plus one plain sentence saying whether the two agree'
      - 'A line starting Source: names Yahoo Finance via yfinance, and a Rating read on date line is shown'
      - 'A name with no Street data shows No Street rating available for this run. instead of a blank or zero rating, and the Source: line is still there'
      - 'With the switch off the card is gone and the rest of the verdict is unchanged; with it on the card is back'
      - 'No text on the card tells the user to buy or sell, and none says the AI'

  - id: UAT-ROOM-025
    title: The Room owner can rate a verdict thumbs up or down, once, and change it; nobody else can
    layer: api
    plans: [floor_pass]
    llm: true
    preconditions:
      - A completed Room run (the one UAT-ROOM-001 streams)
    steps:
      - POST /v1/room/{run_id}/rating with helpful true as the owner, then again with helpful true, then with helpful false
      - POST it as another user, for an unknown run id, with no bearer, and with a non-boolean helpful or an extra field
      - Admin GET /v1/admin/room-ratings, and the same without the admin secret
    expected:
      - The first answer is stored (200, changed false); repeating it changes nothing; the third call returns helpful false with changed true; there is one rating per Room
      - Another user is 403, an unknown run is 404, no bearer is 401, a non-boolean or extra field is 422; none of them changes the stored answer
      - The admin read lists the run with its ticker, the verdict action and the final helpful value, and its totals count it once; without the admin secret it is 403
    notes: CR278 / WP-36. The rating is the Beta tester's "did the verdict and its reasons make sense" answer; the admin read feeds the WP-53 exit report.

  - id: UAT-ROOM-026
    title: In free-credits mode a Room is not charged and still runs; in paid mode the wall holds
    layer: api
    plans: [floor_pass]
    llm: true
    preconditions:
      - Fresh Floor Pass user holding 0 credits
    steps:
      - GET /v1/mandate/{user_id} and read room_cost
      - POST /v1/room/stream for AAPL and read the SSE stream to the end
    expected:
      - If room_cost is 0 (the host runs BETA_FREE_CREDITS=true) the Room is not refused, finishes with a verdict, done.credit_cost is 0, the persisted run's credit_cost is 0 and the balance is still 0
      - If room_cost is 8 (the host charges, as Alpha does) the Room is refused with 402 insufficient_credits and no run, exactly as UAT-ROOM-005
      - The advertised room_cost and the behaviour always agree; one is never free while the other charges
    notes: CR278 / WP-36. Alpha runs BETA_FREE_CREDITS=false, so there it asserts the wall; the free branch runs on the Beta host (WP-45).

  - id: UAT-ROOM-027
    title: After a Room a dismissible card asks if the verdict made sense, and a response can be reported
    layer: device
    status: blocked
    blocked_on: The Appium script for this case is not written yet (CR278 shipped the cases and the app controls; the rig script and a run on a build made with the Beta define are still to do)
    plans: [floor_pass]
    llm: true
    preconditions:
      - A Room has just finished on AAPL and shows its verdict
    steps:
      - Scroll under the verdict; read the card "Did the verdict and its reasons make sense?"
      - Tap the thumbs-up, then the thumbs-down
      - Tap the X on the card
      - Open the Room again from the Journal, or convene it again, and long-press any desk's row (or the verdict), then tap "Report this response"
      - Read the report sheet, then close it without sending
    expected:
      - The card sits under the verdict and cost line; the verdict's actions above it still work without touching the card
      - Tapping a thumb highlights it and the card says it was saved; the other thumb changes the answer
      - The X removes the card and nothing else on the screen moves or goes missing
      - The report sheet opens already titled "Problem with a response from <desk>", with the category set to Wrong data and a line naming the desk; closing it sends nothing
    notes: CR278 / WP-36. Pair with UAT-ROOM-025, which proves the stored answer.

  - id: UAT-ROOM-028
    title: Reopening the app during a running Room shows a rejoin banner on the Floor, and REJOIN returns to the Room without a second charge
    layer: manual
    plans: [any]
    llm: true
    preconditions:
      - A funded account; note the credit balance before starting
    steps:
      - Convene the Room on MSFT and, once the first desks have spoken, swipe the app away (fully close it)
      - Reopen the app within a few minutes while the Room is still running
      - Read the Floor; do not tap anything yet
      - Tap REJOIN on the banner
      - Let the run finish, then go back to the Floor
      - Separately, close the app during a run, wait for it to finish, then reopen
    expected:
      - The app opens on the Floor, not inside the Room, and a banner at the top says "Your Room on MSFT is still running." with a REJOIN button
      - Nothing is charged by reopening the app or by waiting on the Floor
      - REJOIN opens the MSFT Room, shows the "Welcome back" rejoin line, replays the desks that had already spoken, then continues live to the verdict
      - The credit balance after the run equals the balance before minus the one Room price; REJOIN did not start a second run or a second charge
      - The banner is gone after the run finishes
      - When the run finished while the app was closed, the Floor shows no banner and the verdict is already in the Journal
    notes: DEF506. Ruled by Saiful 2026-11-20 (open on the Floor, never auto-jump into the Room). The banner has identifiers ami.floor.rejoin_banner and ami.floor.rejoin_cta for the device rig. Pairs with UAT-ROOM-018/019, which cover a dropped connection and backing out.

  - id: UAT-ROOM-030
    title: A changed mandate is a new Room and is charged; the same inputs again are the banked Room
    layer: api
    plans: [trader]
    llm: true
    preconditions:
      - The Trader user from UAT-ROOM-003/013 who has run MSFT once with a real verdict (a refunded outage Room is not banked, so this case is skipped for it)
    steps:
      - POST /v1/room/stream for MSFT again with the mandate untouched
      - PATCH the user's mandate (max_drawdown_pct to a different value) and POST /v1/room/stream for MSFT again
      - POST /v1/room/stream for MSFT a third time, mandate untouched since the PATCH
    expected:
      - The first repeat returns the original run id with X-Room-Banked true, done.credit_cost 0, and the balance unchanged
      - After the PATCH the same ticker returns a DIFFERENT run id with no X-Room-Banked header, charged at the documented price, and the user now has two runs
      - The third convene returns the second run's id as a banked, free return
    notes: WP-24 (2026-11-20). One extra real Room run. The key is (user, ticker, mandate content, fact-sheet hash, policy version, model root, trading day); a new trading day or a new prompt/model changes it too but cannot be forced from the API, so those are covered by backend/tests/unit/test_cr267_wp24_room_bank.py.

  - id: UAT-ROOM-031
    title: A Room handed back for unchanged inputs says so on the Room and shows no cost
    layer: manual
    plans: [trader]
    llm: true
    preconditions:
      - A build that includes WP-24, signed in as a Trader with credits, who has already convened a Room on MSFT today and got a real verdict
      - Note the credit balance before the second convene
    steps:
      - Convene the Room on MSFT again without changing the mandate
      - Read the line under the verdict, and compare the credit balance with the one noted
      - Open Brief Your Agent, change one setting, then convene MSFT again
    expected:
      - The earlier Room is shown straight away, with a plain line "Inputs unchanged since your last run on <date> — showing that Room. No credits used." in place of any "This Room used N credits" line
      - The credit balance is the same as before the second convene
      - After the mandate change the Room runs live (desks speak in turn), the banked line is absent, and the cost line states what that Room cost
    notes: WP-24 (2026-11-20). The line carries identifier ami.room.banked_line for the device rig. The Arabic and Malay strings are English placeholders until translated. API half is UAT-ROOM-030.

  - id: UAT-ROOM-032
    title: A flipped verdict shows what changed, on the verdict card and in the Journal
    layer: manual
    plans: [trader]
    llm: true
    preconditions:
      - A build that includes CR267 WP-25, signed in as a Trader with credits, who already has a finished Room on one ticker (for example MSFT) whose verdict was not APPROVE
      - The user's mandate is then changed (Brief Your Agent or Mandate) so the next Room is a new run, not the banked one
    steps:
      - Convene the Room on that ticker again and wait for the verdict
      - If the new verdict differs from the previous one, read the card under the verdict heading; if it is the same, repeat after another mandate change until a Room's call differs
      - Open the Journal, find the new Room entry in the list, then open it
    expected:
      - 'A card under the verdict heading reads "CHANGED FROM <PREVIOUS> TO <NEW>" with the two verdict words, and lists one plain line per input that changed (for example the mandate change)'
      - 'When the Room ran on identical inputs the card says "Inputs were the same as your last Room on this name. The Room''s own debate reached a different call." and never lists a change'
      - 'When the answers behind the two Rooms are available the card lists "ANSWERS THAT CHANGED" with a short question label and "before → after" per row; when they are not available there is no such section and no apology line'
      - A Room whose call matches the previous one shows no such card
      - 'The Journal list entry carries one line "Changed from <PREVIOUS> to <NEW>: ..." and the opened entry shows the same card as the verdict card'
    notes: CR267 WP-25 (2026-11-21), mobile half. The card carries identifier ami.room.flip_explainer and the Journal line ami.journal.flip_line. Wire shape is Verdict.flip_explainer (backend/app/schemas/room.py). Arabic and Malay strings are English placeholders until translated.

