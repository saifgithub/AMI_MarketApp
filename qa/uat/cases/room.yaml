      - "Expanded, and in the peek sheet, the turn sits under an amber \"Standing guidance: this desk didn't respond\" chip and the line \"AMI filled this turn with standing guidance because the desk's own call didn't come back. It is not this desk's live read.\""
      - A desk that answered shows no such label and its row quotes its own headline or bold figure as before
      - The Journal replay shows the same label on the same desk, and a Room opened after the app was killed and reopened (rejoin) shows it too
