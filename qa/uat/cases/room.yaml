  - id: UAT-ROOM-034
    title: With Bursa on, a Room on a .KL stock shows RM, FBM KLCI and names every unavailable desk input
    layer: device
    llm: true
    plans: [trader]
    preconditions:
      - 'Build 0.1.0+130 or later (TestFlight internal or Play internal), which has AMI_BURSA on; store builds keep it off'
      - 'Alpha with MARKET_BURSA_ENABLED=true (on since 2026-11-24)'
      - 'Room credits'
    steps:
      - 'On the Floor convene the Room on 1155.KL; wait for the verdict'
      - 'Read the Technical Strategist, Fundamentals Analyst, Macro & Events and Flow & Positioning rows, then the Chief Investment Officer verdict card'
    expected:
      - 'Prices and sizes read RM, never $; the relative-strength comparison is against the FBM KLCI, not the S&P 500, and the Technical Strategist''s turn always ends with an AMI note saying so'
      - 'Each desk that would have shown a US filings input says "not available for this market (Bursa Malaysia filings are not yet ingested)" instead of staying silent; the Fundamentals Analyst''s turn always ends with an AMI note naming peer comparison, filed-statement detail and the filings index as not available for this market; Macro & Events always ends with an AMI note listing the SEC filings index, executive-change, insider and 8-K inputs as not available for this market; Flow & Positioning always ends with an AMI note naming the put/call ratio as not available for this market (no Bursa options or positioning feed is ingested)'
      - 'A negative amount reads with the sign first (-RM15,433M), in every desk turn, the Risk Officer rows and any fact-check note, never "RM-14,077M" or "$-15,433M" (AMI rewrites the sign position on each turn after the model writes it)'
      - 'Macro & Events always ends with an AMI note stating Malaysian headline CPI with its reference month and OpenDOSM as the source (on in Alpha since deploy #29), or saying it is unavailable this call, whatever the desk wrote in its own text (the AMI-DL-32 desk wrote "+1.9% YoY" with neither); that note is followed by one naming the Malaysian news feed as headlines from Malay Mail, or saying it is unavailable this call. Any Malay Mail headline it cites is about the company (here Maybank) or labelled market-wide'
      - 'With ROOM_FACTCHECK_NOTES=log (Alpha from deploy #36) no "AMI checked" note (ending "These are the figures of record.") appears on any desk turn or on the Chief Investment Officer''s kill criterion, and no Risk Officer row carries "[AMI: unverifiable]"; the checker still runs and its findings are in the backend logs as room_factcheck_finding events, not in the Room text. (Only under the annotate mode, the code default and not Alpha:) no AMI fact-check note on any desk "corrects" a figure the desk quoted correctly: a negative amount quoted with its sign (-12.6%, -RM15,433M), a multiple written with an x (11.5x), a multi-year average (the mean of the sheet''s own history), a ratio beside the FCF label (FCF conversion -152%, a 6.11% yield, 0.0% insider ownership), a period (FY2024 FCF) and a forward P/E''s multiple beside its median are never reported as not matching the sheet; and no Risk Officer row carries "[AMI: unverifiable]" on a figure the sheet states (a negative TTM FCF of -RM15,433M, an EPS revision "down 6.6%")'
      - 'Each Risk Officer sizing line reads its dollar-risk amount in ringgit ("the press option, 50.0% of portfolio (≈ 3.00 pt of drawdown, RM1,499 at risk, 46.88 pt of cap left)"), never "$1,499 at risk"; the same holds for any AMI trade-geometry or price-direction note under a desk turn (entry / stop / target and the last close in RM)'
      - 'The Chief Investment Officer cites no existing position when the Bursa book holds none of the stock (DEF538)'
      - 'An APPROVE verdict card quotes entry, stop and target in RM; a PASS or HOLD carries none, exactly as for a US name (a PASS needs only narration), so none is not a failure; the Room is stored with currency MYR'
    notes: 'CR282 lane E; DEF533 (build 130 run found US framing on a .KL Room: S&P label, no Fundamentals dark-input line, "$-" in a fact-check note; fixed on the backend, so re-run on the same build after the deploy); DEF535 (build 132 run: the Technical Strategist never named the FBM KLCI and Macro & Events / Flow & Positioning described the gaps in their own words; the coded per-desk AMI notes are appended by the runner). Titles follow CR160 (Chief Investment Officer, Risk Officer, Execution Desk). Active since 2026-11-24: the backend precondition is met on Alpha, so this needs a run on build 0.1.0+130 or later (not release-blocking; a store build cannot run it). DEF546 (build 136 run: Macro & Events quoted CPI with no month or source although the sheet carried both; the coded CPI note is appended by the runner, Bursa sheet revision 5). DEF547 (same run: the fact-check told the reader the sheet''s -12.6 was not 12.6%, -RM15,433M not 5,273M and 11.5 not 11, three faults in the checker: sign dropped, 11.5x truncated to 11, a multi-year average paired with TTM FCF; the Malay Mail headlines on that run were already labelled market-wide on the sheet and in the coded note, the agentic-AI headline was Fortune via Yahoo, not Malay Mail). DEF547 follow-up and DEF548 (AMI-DL-33, build 136, deploy #34: the fix did not hold - FCF conversion -152% was paired with the FCF amount, "FY2024" read as a figure, a forward P/E held to the trailing one, "RM-14,077M" printed sign-after-symbol, and the Risk Officer tagged -RM15,433M, the sheet''s own TTM FCF, unverifiable because its check compared an unsigned full-unit claim with signed raw millions). DEF547 round 3 (AMI-DL-35: still false corrections - the mandate''s 1.0% single-name cap "corrected" to 12.42, "1.0x ATR(14)" to 0.145, "RM15,433M negative" corrected because the word follows the number, and the Risk Officer still tagged -RM15,433M; Saiful 2026-11-25: Dilemma on the checker''s design, log-only meanwhile): ROOM_FACTCHECK_NOTES=log on Alpha keeps the checker running and logging but writes nothing into the Room text, a stance headline is not nulled; a Risk Officer headline built on a figure the sheet and ladder cannot corroborate is still demoted to the ladder-derived headline (CR288), with no tag written; expectation 5 therefore checks that no note or tag is present, and the false-correction cases it used to list return as the Dilemma''s acceptance. DEF549 (AMI-DL-36, build 137, deploy #35: the Risk Officer sizing line printed "$1,499 at risk" on a 1155.KL Room; the coded line took a hard-coded $; fixed with the R:R and direction notes, guard test_def549_bursa_coded_lines_no_dollar). The API pre-spend half is UAT-ROOM-033.'

  - id: UAT-ROOM-035
    title: With the coded decision rule on, the verdict action is computed from the grader's answers and the record names the grader, rule and policy
    layer: api
    plans: [trader]
    llm: true
    preconditions:
      - 'A Trader user holding 150 credits who has convened one Room on MSFT (the same Room as UAT-ROOM-003/013/030; no extra spend); the backend runs with ROOM_CODED_RULE_ENABLED=true and ROOM_GRADER=ling (Alpha is on-prem only since 2026-11-25)'
    steps:
      - 'GET /v1/room/{run_id} for the stored run and read verdict.coded_decision'
    expected:
      - 'The stored run has a verdict whose coded_decision outcome is APPROVE, PASS, CONTESTED or UNAVAILABLE; a run with no coded_decision fails loudly (the rule did not run), and a Room that ended NO_VERDICT because a desk was withheld is skipped, never counted as evidence'
      - 'The record carries rule_version, a policy_version that embeds that rule_version, grader "ling", a grader_version starting ling:ling-3.0-flash-fin-fp4 and carrying split2 and think=off'
      - 'Unless the grader failed, all six questions are answered (bear_objection_answered, catalyst_in_horizon, terminal_vulnerability, event_risk_wait, thesis_material_directional, trade_proposed), each yes, no or not_computable, and the rule gives its reasons'
      - 'The verdict action follows the computed outcome: PASS for PASS and CONTESTED; APPROVE for APPROVE (the deterministic mandate floor may still turn it into REJECT). A CONTESTED outcome names the close questions'
      - 'When the Chief Investment Officer''s narration contradicted the computed action (narration_overridden true) and the outcome is not APPROVE, the shown reason is the rule''s own text ("AMI''s decision rule ...")'
      - 'If the grader failed (coded_decision.error set) the outcome is UNAVAILABLE, the verdict is the decision-unavailable PASS (overridden_from_llm true, reason starting "AMI could not compute a decision for this Room"), the Room is refunded and the balance is back to 150'
    notes: 'Grader 2026-11-25 (deploy #33): Alpha switched to ROOM_GRADER=ling the same day (Saiful: "Switch now, run the batch"), so the case now pins ling; a deepinfra grade on Alpha is a config leak. Earlier the same day: an on-prem Ling grader is registered (ROOM_GRADER=ling, gateway slot vllm_fallback, thinking off); the stored grader string names which one graded the Room (deepinfra:... or ling:...|split2|...|think=off), and both use the same question plan. CR267 WP-23 (deploy #25, 2026-11-24): ROOM_CODED_RULE_ENABLED=true and ROOM_GRADER=deepinfra on Alpha (DeepInfra is the grader only; the Room desks stay on-prem). Record shape: backend/app/schemas/room.py CodedDecisionRecord, written by room_runner._coded_record. The grader_version string carries the model, temperature, averaged questions and the split-close rule, so changing any of them changes it and the policy version. A real-model Room cannot be forced to a given outcome, so which branch runs depends on the Room; the rule itself is pinned by the backend unit tests.'

