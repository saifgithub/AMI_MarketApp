area: controls
code: CTRL
title: Every screen reached, every control pressed
order: 21
covers:
  - mobile/lib/**
summary: |
  The exhaustive crawler (CR264) visits every screen and sheet and presses every
  control, judging each press: no crash, no new error-sink entry, no overflow,
  not a dead tap, and the effect matches the control-intent catalogue
  (qa/uat/controls/*.yaml). Destructive controls are pressed last, then the app
  is reset. Credit-spending controls (Room, 1-on-1, Brief) are pressed once per
  crawl; real-money purchases are never pressed (crawler/never_press.json).
  2026-11-22 (build 129): Your Firm lays the 13 agent tiles out in desk bands (CR159; same tiles, taps and semantics ids, catalogue qa/uat/controls/your_firm.yaml already updated); Games responses now carry the keys the app reads (DEF527; a SELL stays a sell, restart passes commit as the query param). 8 + 12 new strings are seeded for AR/MS.
  2026-11-24 (CR282 phase 1, Bursa Malaysia): every Bursa control is behind the AMI_BURSA dart-define and is absent from a store build, so a store-build crawl sees no new control. The catalogue now describes them for the acceptance run on an AMI_BURSA build: the Portfolio US / BURSA switch and NEW BURSA TRADE (qa/uat/controls/portfolio.yaml) and the ticket's board-lot quantity steppers (qa/uat/controls/trade_ticket_sheet.yaml). Visible in store builds: every money amount is now printed through one formatter (a negative reads -$12.00, the $ stays a prefix in Arabic and Malay, the ticker tape and watchlist no longer use the phone's locale currency); the catalogue's control states do not quote amounts, so no entry changed for it. Line numbers re-derived for the new entries only.
  2026-11-24 (CR282, Settings > Compliance): the Liquid-only explain sheet now states the floors ($500M market cap and $1M traded a day; plus a Bursa line on an AMI_BURSA build). Same control, same sheet, new text only; catalogue note in qa/uat/controls/settings.yaml; the device check is UAT-MAND-041. Money amounts everywhere print through one formatter (CR282 F1; DEF531 fixed the "+-$0.00" sign artefact).
  2026-11-24 (CR283, one market setting): the Floor search box gains a US / MY chip, and a typed company name resolves to the active market's code (a two-line chooser when both markets list the word). Both exist only on an AMI_BURSA build, so a store-build crawl sees no new control. The catalogue describes the chip and the chooser line in qa/uat/controls/floor_omnibox.yaml (new Semantics ids ami.floor.market_chip and ami.floor.market_choice.<ticker>); the existing field entry's note names the new routing. Device checks: UAT-FLOOR-013 to UAT-FLOOR-015. Three new strings are seeded for AR/MS.
  2026-11-24 (DEF537, DEF542, journal detail): a closed trade's detail shows Realised P&L on a break-even close, net of fees, plus a Fees row when the round trip paid fees (Bursa); read-only rows, no new control (UAT-JRNL-012).
cases:
  - id: UAT-CTRL-001
    title: Every screen is reached and every control pressed with the expected effect
    layer: device
    status: blocked
    blocked_on: "CR264 Phase C — crawler reaches 13 of 57 screens (needs seeded state + route-driving). Parked by Saiful 2026-10-20: runs nightly and reports, not release-blocking until Phase C reaches every screen."
    plans: [floor_pass]
    steps:
      - Run the exhaustive crawl on a throwaway UAT user (qa/appium/tests/test_every_control.py)
    expected:
      - Every known screen id is reached
      - Every discovered control is pressed, or exempt with a stated reason
      - No press crashes the app, adds an error-sink entry, overflows, or does nothing
      - Every control has a catalogue entry and its observed effect matches it
    notes: "WP-33 (DEF470/473/474/475/476/477/478/479): control-intent catalogue (qa/uat/controls/*.yaml) updated for the changed controls - discard-changes now discards, Alpaca link relabelled TICKER DETAIL, merge-preview RETRY/SKIP, confirm dialogs on regenerate-handle/sign-out/Alpaca disconnect and relink, Ask AMI and NO AMI VERDICT renames. Line numbers in the catalogue were not re-derived. 2026-11-20 (build 120): catalogue gains the Floor REJOIN control (DEF506, qa/uat/controls/floor.yaml); the ticker tape is out of the accessibility tree (DEF466 round 1), so the crawler cannot find tape items by label (qa/uat/controls/ticker_tape.yaml); the risk-limit chip is a custom Row-based chip with the same key riskLimitOff_<key> (DEF508); Room desk rows gain a standing-guidance label for scripted turns (DEF507). DEF481 (2026-11-20): nine back controls (one-on-one, Brief, Brief history, Room, lesson reader, journal detail, journal trash, Company Review sheet, track lessons) now carry ami.nav.back; the Convene and Merge CTAs carry ami.sheet.convene.cta / ami.sheet.merge.cta; the lesson-mode segments are ami.lesson.mode_book / ami.lesson.mode_interactive (were bare lesson_mode_*); the Floor Inbox button is now an envelope icon (the bell stays Notifications); the dead TourCard try-now entry is removed. Line numbers re-derived for these entries only. 2026-11-21 (builds 126-128): Export my data gains a YOUR DATA IS READY dialog with Save to device / Share on Android (DEF524); the Ref line under error panels now updates on every failure and is tap-to-copy (DEF526); the Room verdict card and Journal tile gain a non-interactive CHANGED FROM card / line (WP-25, ami.room.flip_explainer / ami.journal.flip_line) with 12 new strings."
