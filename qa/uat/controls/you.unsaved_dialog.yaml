screen: ami.screen.you.unsaved_dialog
source: mobile/lib/screens/you/you_screen.dart
controls:
  - label: "keep editing"
    kind: button
    expect: back
    line: 143
    when: "switching away from SETTINGS segment with unsaved mandate edits"
    note: "Dialog closes; stays on SETTINGS, edits kept."
  - label: "discard changes"
    kind: button
    expect: destructive
    line: 147
    note: "Dialog closes, the segment switches and the pending Settings edits are dropped (SAVE and the pip clear; the field shows the stored value). Was a no-op before DEF470 - the IndexedStack kept the edits staged."
