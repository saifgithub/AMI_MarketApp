screen: ami.screen.merge_sheet
source: mobile/lib/screens/auth/merge_sheet.dart
controls:
  - label: "MERGE EVERYTHING"
    id: ami.sheet.merge.cta
    kind: button
    expect: destructive
    line: 212
    when: "preview is non-empty"
    note: "Carries ami.sheet.merge.cta (DEF481). Executes the account merge (re-keys the orphan anonymous account's journal, trades, watchlists, lessons, messages, room runs into the signed-in account); irreversible. Success: sheet closes + snackbar; failure: snackbar, sheet stays."
  - label: "KEEP SEPARATE"
    kind: button
    expect: back
    line: 203
    when: "preview is non-empty"
    note: "Closes the sheet; the orphan data stays unmerged (no later UI to merge it - see report)."
  - label: "GOT IT"
    kind: button
    expect: back
    line: 172
    when: "preview is empty (nothing to merge)"
    note: "Closes the sheet."
  - label: "RETRY"
    kind: button
    expect: sheet
    target: ami.screen.merge_sheet
    line: 54
    when: "the merge preview request failed after sign-in (DEF477 dialog)"
    note: "On the preview-failed dialog; re-requests the preview and opens this sheet when it loads."
  - label: "SKIP"
    kind: button
    expect: back
    line: 48
    when: "the merge preview request failed after sign-in (DEF477 dialog)"
    note: "On the preview-failed dialog; closes it and continues without merging (data stays unmerged)."
