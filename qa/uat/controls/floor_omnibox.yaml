screen: "ami.screen.floor_omnibox"
source: "mobile/lib/widgets/floor/floor_omnibox.dart"
controls:
  - label: "Type a ticker — or ask AMI anything…"
    kind: field
    expect: navigate
    target: "ami.screen.room"
    when: "text is ticker-shaped (1-5 letters) AND passes validateTicker; keyboard Go behaves exactly like the primary CTA"
    line: 205
    note: "Free text (not ticker-shaped) -> OneOnOneScreen with the Concierge carrying the text (ami.screen.one_on_one); empty -> ConveneSheet picker (ami.screen.convene_sheet). Unknown ticker shows TickerNotFoundPanel and does NOT navigate. Tap outside dismisses the keyboard (line 210). CR283, AMI_BURSA builds only: a typed word is first resolved against both markets (a company name such as CIMB opens 1023.KL on MY); a 4-digit Bursa code always goes to Bursa; on MY with the lookup unreachable the box says it cannot look up names and convenes nothing. Store builds are unchanged."
  - label: "CONVENE THE ROOM · <TICKER>"
    kind: button
    expect: destructive
    target: "ami.screen.room"
    when: "ticker typed and valid"
    line: 258
    note: "Label morphs with the text. Opens the Room, which auto-convenes on open (RoomNotifier start via provider microtask) and spends a Room credit. Keyboard Go on the field does the same."
  - label: "ASK AMI"
    kind: button
    expect: navigate
    target: "ami.screen.one_on_one"
    when: "text typed is not ticker-shaped (a question or sentence)"
    line: 258
    note: "Same widget as CONVENE; label depends on text."
  - label: "CONVENE THE ROOM"
    kind: button
    expect: sheet
    target: "ami.screen.convene_sheet"
    when: "box is empty"
    line: 258
  - label: "Company Review"
    kind: icon
    expect: navigate
    target: "ami.screen.company_review"
    when: "box holds a validated ticker; disabled (no tap) otherwise. Rendered as info_outlined icon with tooltip/Semantics label 'Company Review'"
    line: 267
    note: "Re-validates the ticker before navigating."
  - label: "<suggested ticker> (TickerNotFoundPanel)"
    kind: link
    expect: state
    state: "Box text is replaced with the suggested ticker; panel clears and CTA re-arms on it"
    when: "typed symbol unknown and a suggestion exists"
    line: 232
  - label: "US / MY market chip"
    kind: chip
    expect: state
    state: "The app-wide market flips between US and MY (the Portfolio US | BURSA switch follows); the chip label, the picker's one-tap suggestions and the ticker tape follow it"
    when: "AMI_BURSA build only; absent from a store build. Semantics id ami.floor.market_chip"
    line: 366
    note: "CR283. Persisted per user, same setting as the Portfolio switch. Not a spend and not a navigation."
  - label: "<market> line (Which market? chooser)"
    kind: list_row
    expect: destructive
    target: "ami.screen.room"
    when: "AMI_BURSA build only; the typed word is listed in both the US and Bursa markets. Semantics id ami.floor.market_choice.<ticker>"
    line: 533
    note: "CR283. Two lines, the active market first; CONVENE THE ROOM does nothing until one is tapped. Tapping validates the ticker, then opens the Room, which auto-convenes and spends a Room credit."
