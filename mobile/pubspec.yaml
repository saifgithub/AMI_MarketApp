name: ami_trade
description: AMI Trade — your team of 12 AI analysts. Educational simulation.
publish_to: 'none'
version: 0.1.0+101

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking + auth
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI helpers
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # Charts (alpha — simple, dark-themed)
  fl_chart: ^0.69.0

  # Audio (for voice briefings — v1.0; included now so the API stays stable)
  just_audio: ^0.9.42
  # On-device text-to-speech (CR047 "The Winzip"): AMI speaks "Your Room is
  # available now" when the cooldown countdown ends. just_audio only plays
  # assets — it can't synthesize speech — so this is a separate dependency.
  flutter_tts: ^4.2.0

  # Sign-in
  sign_in_with_apple: ^6.1.3
  google_sign_in: ^6.2.2

  # In-app purchases (CR084) — RevenueCat SDK. NEW dependency (flagged per
  # CLAUDE.md "lean stack"): the app had no IAP/store SDK before this. RC is
  # the store/region price source of truth for the paywall and the receipt
  # validator that drives the server-authoritative webhook grant. The public
  # SDK keys + store product IDs are Saiful's (DEF100) — supplied at build
  # time via --dart-define, never fabricated here.
  purchases_flutter: ^10.4.3

  # Push + in-app notifications (CR027) — OneSignal SDK. NEW dependency
  # (flagged per CLAUDE.md "lean stack"): unifies APNs (iOS) + FCM
  # (Android) behind one abstraction layer, per the locked decision in
  # core_loop_and_features.md. App ID is public/safe to embed (client-side
  # SDK init); the backend's separate REST API key is the actual secret.
  onesignal_flutter: ^5.5.2

  # Observability
  sentry_flutter: ^9.0.0

  # Utility
  uuid: ^4.5.1
  equatable: ^2.0.7
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  flutter_markdown_plus: ^1.0.3
  image_picker: ^1.2.2
  tutorial_coach_mark: ^1.3.3
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0

  # Share cards (CR012 / C4) — offscreen-rendered PNG → OS share sheet
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  # google_mobile_ads: UNLINKED — see DEF351. The plugin breaks every iOS
  # release compile; re-add with the adapter file when that is resolved.

dev_dependencies:
  flutter_test:
    sdk: flutter
  # CR125 — the platform-interface package flutter_secure_storage's own
  # bundled test double (`package:flutter_secure_storage/test/...`) is built
  # against. Was already resolved transitively; declared explicitly because
  # test code imports it directly.
  flutter_secure_storage_platform_interface: ^1.1.2
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

  # Android adaptive-icon + iOS icon-set generator. Run once after dropping
  # source PNGs at mobile/assets/icon/: `flutter pub run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false  # iOS icons hand-managed in Runner/Assets.xcassets
  image_path: "assets/icon/ami_icon_hires.png"
  adaptive_icon_foreground: "assets/icon/ami_icon_foreground.png"
  adaptive_icon_background: "assets/icon/ami_icon_background.png"
  min_sdk_android: 28

flutter:
  uses-material-design: true
  generate: true

  assets:
    # DEF050: assets/icons/ removed — it has no tracked contents, so a fresh
    # clone warns asset_directory_does_not_exist. Re-add when the first brand
    # icon lands there (see sign_in_screen.dart google.svg comment).
    - assets/hex_mesh.svg
    - assets/logo_hex.svg
    - assets/glossary/terms.en.json

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
