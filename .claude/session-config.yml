# session-config.yml — thin per-track reference registry.
#
# CR097 (2026-07-27) RETIRED /handover + /start-fresh. This file used to DRIVE those two
# skills; they are gone, so `handover_path` + `history_dir` were dropped from every track
# (they existed only to feed them). Nothing reads this file mechanically anymore — it is
# kept as a human reference for the per-track sanity/bug-poll commands below. Continuity
# now rides on the sm-checkpoint routine + the committed .deliveryos/checkpoint_history/
# archives + CR052 orchestration (see CLAUDE.md "Autonomy" + "session start" sections).

project_prefix: "AT"            # Commit/session tags: AT:R64, AT:G2, etc.

# Shared reference
memory_project_file: project_ami_trade.md
worktree_pattern: "agent-*"
worktree_dir: .claude/worktrees

deploy_command: /promote-to-alpha

tracks:
  R:
    label: "Development"
    project_plan_path: docs/initial_specs/10_delivery/project_plan.md
    sanity_checks:
      - name: Alpha health
        cmd: curl -s https://api-alpha.agenticmarketintel.ai/v1/health
    bug_list:
      enabled: true
      count_cmd: |
        ssh melehost "docker exec ami_postgres psql -U postgres -d ami_trade -P pager=off -c \"
          SELECT status, COUNT(*) FROM bug_reports
          WHERE status IN ('open','in_progress','pending_review')
          GROUP BY status ORDER BY status;\""
      titles_cmd: |
        ssh melehost "docker exec ami_postgres psql -U postgres -d ami_trade -P pager=off -c \"
          SELECT to_char(created_at AT TIME ZONE 'Asia/Kuala_Lumpur', 'MM-DD HH24:MI') AS at,
            LEFT(id::text, 8) AS short_id, category, title
          FROM bug_reports WHERE status='open' ORDER BY created_at DESC LIMIT 10;\""

  M:
    label: "Marketing"

  G:
    label: "Governance"

  U:
    label: "Auditor"
    sanity_checks:
      - name: Alpha health
        cmd: curl -s https://api-alpha.agenticmarketintel.ai/v1/health

  Q:
    label: "QA/UAT"
    project_plan_path: docs/forward_planning/CR080_appium_uat_harness/CR080_appium_uat_harness.md

  S:
    label: "Support"
