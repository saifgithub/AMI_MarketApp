# session-config.yml — read by /handover-generic + /start-fresh-generic.
# Re-run /session-setup to amend a field or add a track.

project_prefix: "AT"            # Session tags: AT:R29, AT:M1, etc.

# Shared across all tracks
memory_project_file: project_ami_trade.md
worktree_pattern: "agent-*"
worktree_dir: .claude/worktrees

deploy_command: /promote-to-alpha

tracks:
  R:
    label: "Development"
    handover_path: HANDOVER_R.md
    history_dir: history/
    project_plan_path: docs/initial_specs/10_delivery/project_plan.md
    sanity_checks:
      - name: Alpha health
        cmd: curl -s https://api-alpha.agenticmarketintel.ai/v1/health
    bug_list:
      enabled: true
      count_cmd: |
        ssh melehost "docker exec ami_postgres psql -U postgres -d ami_trade -P pager=off -c \"
          SELECT status, COUNT(*) FROM bug_reports
          WHERE status IN ('open','in_progress','pending_review')
          GROUP BY status ORDER BY status;\""
      titles_cmd: |
        ssh melehost "docker exec ami_postgres psql -U postgres -d ami_trade -P pager=off -c \"
          SELECT to_char(created_at AT TIME ZONE 'Asia/Kuala_Lumpur', 'MM-DD HH24:MI') AS at,
            LEFT(id::text, 8) AS short_id, category, title
          FROM bug_reports WHERE status='open' ORDER BY created_at DESC LIMIT 10;\""

  M:
    label: "Marketing"
    handover_path: HANDOVER_M.md
    # history_dir: history/              # add when first marketing session wraps; can share AMI's history/ folder (filenames are prefixed)
    # project_plan_path:                 # no marketing backlog doc yet

  G:
    label: "Governance"
    handover_path: HANDOVER_G.md
    history_dir: history/

  U:
    label: "Auditor"
    handover_path: HANDOVER_U.md
    history_dir: history/
    sanity_checks:
      - name: Alpha health
        cmd: curl -s https://api-alpha.agenticmarketintel.ai/v1/health

  Q:
    label: "QA/UAT"
    handover_path: HANDOVER_Q.md
    history_dir: history/
    project_plan_path: docs/forward_planning/CR080_appium_uat_harness/CR080_appium_uat_harness.md
    # sanity_checks / bug_list: none yet — add via /session-setup once the harness has a first run
