# LLaMA-Factory v0.9.4+ config — Concierge LoRA (Qwen3.6-35B-A3B)
#
# Run from inside the LLaMA-Factory checkout:
#   llamafactory-cli train Silent_Scout/03_training/llamafactory_configs/concierge.yaml
#
# Adjust paths per gb10_bringup.md §7 disk layout.

### model
model_name_or_path: /raid/silent_scout/models/Qwen3.6-35B-A3B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all              # all linear layers (QLoRA-style, PiSSA-friendly)
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

### dataset
# Custom JSONL dataset — chat-style messages.
# LLaMA-Factory dataset registration: see data/dataset_info.json in your LLaMA-Factory checkout.
# Or use the file-based loader pointing at our processed JSONL.
dataset: concierge_sft
dataset_dir: /raid/silent_scout/datasets/processed/concierge
template: qwen
cutoff_len: 4096
max_samples: 30000
overwrite_cache: false
preprocessing_num_workers: 16

### output
output_dir: /raid/silent_scout/adapters/concierge
logging_steps: 25
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### training
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true                    # bfloat16 — avoids bitsandbytes ARM64 wheel issues
flash_attn: auto              # pin to a release that lists Blackwell sm_120/sm_121
optim: adamw_torch
weight_decay: 0.01
max_grad_norm: 1.0

### eval (held-out sample for loss curve — not the eval harness)
val_size: 0.01
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 500

### misc
report_to: none
seed: 42
