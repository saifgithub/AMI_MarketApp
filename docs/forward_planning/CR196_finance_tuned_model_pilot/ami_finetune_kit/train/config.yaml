# CR196 LoRA SFT config — mirrors Fastino's published recipe where known
# (rank 32, lr 1e-4, 2 epochs, packing disabled), our choices elsewhere.
model_path: /models/fastino-finance-bf16
# OFF: the repo's custom modeling code needs mamba-ssm (no aarch64 wheel); transformers>=5
# implements nemotron_h natively. See train_lora.load_model's docstring.
trust_remote_code: false
train_jsonl: /kit/data/train.jsonl
val_jsonl: /kit/data/val.jsonl

lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
# Regex (PEFT treats a string as a regex). Chosen from the checkpoint's own weight index,
# measured on alpha-spark 2026-08-21:
#   * "all-linear" FAILS — PEFT rejects Mamba `out_proj` and `conv1d` for LoRA, and the
#     bare names up_proj/down_proj would match all 3072 ROUTED expert matrices
#     (128 experts x 24 MoE layers), which is not a LoRA any more.
#   * This targets the 7 attention layers (q/k/v/o = 28), the Mamba input projections
#     (in_proj = 23) and the always-active shared experts (up/down = 48) => 99 modules,
#     next to the 101 Fastino's own merge touched (merge-provenance.json).
# The routed experts stay frozen by design: they are sparsely activated, so LoRA on them
# trains unevenly on any single-domain corpus.
target_modules: 'backbone\.layers\.\d+\.mixer\.(q_proj|k_proj|v_proj|o_proj|in_proj)|backbone\.layers\.\d+\.mixer\.shared_experts\.(up_proj|down_proj)'

batch_size: 1
grad_accum: 16
learning_rate: 1.0e-4
epochs: 2
lr_scheduler: cosine
warmup_ratio: 0.03
cutoff_len: 8192

logging_steps: 10
save_steps: 200        # ~every 30 min at expected step-times; adjust after smoke
save_total_limit: 3
eval_steps: 200
seed: 42
