# CR196 LoRA SFT config — mirrors Fastino's published recipe where known
# (rank 32, lr 1e-4, 2 epochs, packing disabled), our choices elsewhere.
model_path: /models/fastino-finance-bf16
# OFF: the repo's custom modeling code needs mamba-ssm (no aarch64 wheel); transformers>=5
# implements nemotron_h natively. See train_lora.load_model's docstring.
trust_remote_code: false
train_jsonl: /kit/data/train.jsonl
val_jsonl: /kit/data/val.jsonl

# auto | unsloth | trl. Pinned to trl 2026-08-21: on this hybrid Mamba-MoE checkpoint the
# Unsloth path built the adapter but then died with "Cannot copy out of meta tensor; no data!"
# at train start (smoke4), after earlier rejecting all-linear targets and lora_dropout>0.
# TRL+PEFT is NVIDIA's own documented LoRA path for Nemotron-H. Revisit for run 2 if speed
# matters more than the day of debugging it would cost.
harness: trl

lora_rank: 32
lora_alpha: 64
lora_dropout: 0.0   # Unsloth: "lora.ParamWrapper does not work with lora_dropout != 0"
# Regex (PEFT treats a string as a regex). Chosen from the checkpoint's own weight index,
# measured on alpha-spark 2026-08-21:
#   * "all-linear" FAILS — PEFT rejects Mamba `out_proj` and `conv1d` for LoRA, and the
#     bare names up_proj/down_proj would match all 3072 ROUTED expert matrices
#     (128 experts x 24 MoE layers), which is not a LoRA any more.
#   * Names come from the LOADED model (meta-device enumeration, 2026-08-21), NOT the
#     checkpoint's weight index: transformers' native impl renames `backbone.` -> `model.`,
#     and only 117 nn.Linear modules exist at all (the routed experts are fused params,
#     not Linear - which is what Unsloth's "lora.ParamWrapper" complaint was about).
#     This targets attention q/k/v/o (24), Mamba in_proj (23) and the always-active
#     shared experts up/down (46) => 93 modules, near the 101 Fastino's merge touched.
# The routed experts stay frozen by design: they are sparsely activated, so LoRA on them
# trains unevenly on any single-domain corpus.
target_modules: 'model\.layers\.\d+\.mixer\.(q_proj|k_proj|v_proj|o_proj|in_proj)|model\.layers\.\d+\.mixer\.shared_experts\.(up_proj|down_proj)'

batch_size: 1
grad_accum: 16
learning_rate: 1.0e-4
epochs: 2
lr_scheduler: cosine
warmup_ratio: 0.03
# Measured with the REAL tokenizer on the run-2 mix (preflight_lengths.py, 20,029
# rows): median 1,462 · p90 2,121 · p99 3,902 · max 7,728. At 4,096, 27 rows would be
# silently truncated FROM THE RIGHT — and several are recipe-10 reports with 5,000+
# char targets, i.e. exactly the long-form behaviour run 2 exists to restore. TRL does
# not warn; the target is simply cut and the model learns to stop mid-sentence.
# 5,120 keeps every recipe-10 row; what still exceeds it is long-PROMPT Tier B whose
# targets are short, and those are dropped rather than truncated. 8,192 OOM-killed
# with naive Mamba (measured run 1), so this is the headroom available.
# REVERTED to 4,096 after the run-2 probe took alpha-spark into memory thrashing:
# 110 of 121 GB resident, GPU still at 96%, and sshd unable to fork — the kernel
# answered pings and TCP handshakes while nothing could be scheduled. Run 1 completed
# 25h at 4,096 and the config's own history records 8,192 being OOM-killed, so this
# is a clean A/B: 4,096 fits this box, 5,120 does not.
#
# The truncation defect that motivated 5,120 is real and still must not be ignored —
# but the right answer is to DROP the 27 over-length rows, not to raise the ceiling
# to keep them. 27 of 20,021 is a rounding error, and three recipe-10 reports are a
# small price for a run that completes. preflight_lengths.py --drop-over does this;
# never let them truncate.
#
# Note this mix is heavier than run 1's at the same cutoff (median 1,462 tokens,
# p90 2,118, against run 1's 331-char median target), so headroom is thinner even
# here. If 4,096 also proves tight, cut the longest rows further rather than
# trimming the cutoff toward the reports we are trying to teach.
cutoff_len: 4096

logging_steps: 10
save_steps: 200        # ~every 30 min at expected step-times; adjust after smoke
save_total_limit: 3
eval_steps: 200
seed: 42
