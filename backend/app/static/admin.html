<!doctype html>
<!--
  AMI Trade — Admin Back-Office (AT:R27)
  Stop-gap single-page UI for the /v1/admin/* API. Replaced by the
  Flutter web admin app in Beta. Vanilla HTML + CSS + JS so it has
  no build step and survives without npm. AMI Hex-Reinforced Precision
  palette mirrored from mobile/lib/theme/ami_theme.dart.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F172A">
<title>AMI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A;
    --panel: #111827;
    --panel-alt: #152845;
    --border: #374151;
    --border-dim: #1F2937;
    --text-high: #F3F4F6;
    --text-med: #94A3B8;
    --text-low: #64748B;
    --blue: #3B82F6;
    --blue-700: #2563EB;
    --cyan: #06B6D4;
    --amber: #F59E0B;
    --green: #10B981;
    --red: #EF4444;
    --purple: #8B5CF6;
    --pink: #EC4899;
    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 24px -16px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-high); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── Layout ─────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top));
    background: rgba(15,23,42,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-dim);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.04em; }
  .brand .hex {
    width: 18px; height: 20px;
    background: var(--blue);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .brand .label { font-size: 13px; }
  .brand .label small { color: var(--text-med); font-weight: 500; margin-left: 6px; font-size: 11px; }
  .iconbtn {
    background: transparent;
    color: var(--text-med);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .iconbtn:hover { color: var(--text-high); border-color: var(--text-low); }

  main { padding: 16px; max-width: 720px; margin: 0 auto; }

  /* ── Cards ──────────────────────────────────────────────── */
  .card {
    background: var(--panel);
    border: 1px solid var(--border-dim);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card h3 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-low);
  }
  .card h3 .accent { color: var(--blue); }
  .card.danger { border-color: rgba(239,68,68,0.35); }
  .card.danger h3 .accent { color: var(--red); }

  /* ── Forms ──────────────────────────────────────────────── */
  input, select, textarea, button {
    font-family: inherit;
    font-size: 14px;
  }
  input[type=text], input[type=number], select, textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text-high);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.18);
  }
  textarea { min-height: 44px; resize: vertical; }
  label.lbl {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-low);
    margin-bottom: 5px;
  }
  .row { display: grid; gap: 8px; margin-bottom: 10px; }
  .row.cols-2 { grid-template-columns: 1fr 1fr; }
  .row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 480px) {
    .row.cols-2, .row.cols-3 { grid-template-columns: 1fr; }
  }

  button.btn {
    width: 100%;
    border: 0;
    background: var(--blue);
    color: white;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 12px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s, transform 0.06s;
  }
  button.btn:hover { background: var(--blue-700); }
  button.btn:active { transform: translateY(1px); }
  button.btn:disabled { background: var(--border); color: var(--text-low); cursor: not-allowed; }
  button.btn.amber { background: var(--amber); color: #0F172A; }
  button.btn.amber:hover { filter: brightness(1.06); }
  button.btn.red { background: var(--red); }
  button.btn.red:hover { background: #DC2626; }
  button.btn.green { background: var(--green); color: #052e16; }
  button.btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-med); }
  button.btn.ghost:hover { color: var(--text-high); border-color: var(--text-low); }

  /* ── User header ────────────────────────────────────────── */
  .userhdr { display: flex; flex-direction: column; gap: 8px; }
  .userhdr .id { font-size: 11px; color: var(--text-low); word-break: break-all; }
  .userhdr .email { font-size: 16px; font-weight: 600; }
  .userhdr .email.muted { color: var(--text-low); font-weight: 500; font-style: italic; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid;
    text-transform: uppercase;
  }
  .badge.anon { color: var(--text-med); border-color: var(--border); }
  .badge.suspended { color: var(--red); border-color: var(--red); background: rgba(239,68,68,0.08); }
  .badge.trial { color: var(--amber); border-color: var(--amber); background: rgba(245,158,11,0.08); }
  .badge.claimed { color: var(--green); border-color: var(--green); background: rgba(16,185,129,0.08); }

  /* ── Stat grid ──────────────────────────────────────────── */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border-dim);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat .k {
    font-size: 10px;
    color: var(--text-low);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat .v {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-high);
  }
  .stat .v.dim { color: var(--text-med); }

  /* ── Events ─────────────────────────────────────────────── */
  .events { display: flex; flex-direction: column; gap: 8px; }
  .ev {
    border-left: 2px solid var(--border);
    padding: 4px 0 4px 12px;
  }
  .ev.plan_changed { border-color: var(--blue); }
  .ev.trial_granted, .ev.trial_extended { border-color: var(--amber); }
  .ev.trial_revoked { border-color: var(--text-low); }
  .ev.credits_added, .ev.credits_consumed { border-color: var(--green); }
  .ev.credits_deducted { border-color: var(--red); }
  .ev.user_suspended { border-color: var(--red); }
  .ev.user_reinstated { border-color: var(--green); }
  .ev .ev-type {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-high);
  }
  .ev .ev-vals {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-med);
    margin-top: 1px;
  }
  .ev .ev-meta {
    font-size: 10px;
    color: var(--text-low);
    margin-top: 2px;
  }
  .ev .ev-note { font-size: 11px; color: var(--text-med); font-style: italic; margin-top: 2px; }

  /* ── Empty + status ─────────────────────────────────────── */
  .empty { text-align: center; padding: 40px 16px; color: var(--text-low); }
  .empty .hex {
    width: 36px; height: 40px; margin: 0 auto 12px;
    background: var(--blue);
    opacity: 0.4;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--panel-alt);
    color: var(--text-high);
    padding: 12px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
    box-shadow: 0 16px 32px -12px rgba(0,0,0,0.5);
    z-index: 20;
    max-width: 90vw;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .toast.err { border-color: var(--red); color: #FECACA; }
  .toast.ok { border-color: var(--green); }

  /* ── Setup screen ───────────────────────────────────────── */
  .setup {
    max-width: 460px;
    margin: 60px auto;
    padding: 24px;
  }
  .setup .lead { color: var(--text-med); margin-bottom: 20px; font-size: 13px; }

  hr.sep { border: 0; border-top: 1px solid var(--border-dim); margin: 12px 0; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="hex"></span>
    <span class="label">AMI ADMIN<small>alpha</small></span>
  </div>
  <button class="iconbtn" id="logoutBtn" onclick="logout()" style="display:none">LOGOUT</button>
</header>

<main id="main"></main>

<div class="toast" id="toast"></div>

<script>
const PLANS = ['floor_pass', 'trader', 'floor_manager', 'trial_trader'];
const TOKEN_KEY = 'ami_admin_token';
const API = ''; // same-origin
let currentUser = null;

// ── token plumbing ────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function logout() {
  if (!confirm('Clear admin token from this device?')) return;
  localStorage.removeItem(TOKEN_KEY);
  location.reload();
}

// ── api calls ─────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Authorization': 'Bearer ' + getToken(),
      'Content-Type': 'application/json',
    },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const msg = (data && data.detail) ? data.detail : (typeof data === 'string' ? data : `HTTP ${res.status}`);
    throw new Error(msg);
  }
  return data;
}

// ── toast helper ──────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (kind || 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── formatters ────────────────────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtRel(iso) {
  if (!iso) return '—';
  const d = new Date(iso); const now = new Date();
  const days = Math.round((d - now) / 86400000);
  if (days === 0) return 'today';
  if (days > 0) return `in ${days}d`;
  return `${-days}d ago`;
}
function shortId(uuid) { return uuid ? uuid.substring(0, 8) : ''; }

// ── views ─────────────────────────────────────────────────────────────────
function viewSetup() {
  return `
    <div class="setup">
      <div class="card">
        <h3><span class="accent">◇</span> ADMIN ACCESS</h3>
        <p class="lead">Paste the ADMIN_SECRET (64-hex from <span class="mono">infra/alpha.env</span>). Stored in localStorage on this device only.</p>
        <div class="row">
          <label class="lbl" for="tokenInput">SECRET</label>
          <input type="text" id="tokenInput" placeholder="hex…" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn" onclick="saveToken()">UNLOCK</button>
      </div>
    </div>
  `;
}

function viewSearch() {
  return `
    <div class="card">
      <h3><span class="accent">◇</span> LOOKUP</h3>
      <div class="row cols-2">
        <input type="text" id="searchEmail" placeholder="email@…" autocomplete="off" spellcheck="false">
        <input type="text" id="searchDeviceId" placeholder="device_user_id (uuid)" autocomplete="off" spellcheck="false">
      </div>
      <div class="row cols-2">
        <button class="btn" onclick="doSearch()">SEARCH</button>
        <input type="text" id="directId" placeholder="…or paste user id directly" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')openDirect()">
      </div>
    </div>
    <div id="results"></div>
  `;
}

function renderResults(arr) {
  if (!arr || arr.length === 0) {
    return `<div class="empty"><div class="hex"></div>No matches.</div>`;
  }
  return arr.map(u => `
    <div class="card" onclick="loadUser('${u.id}')" style="cursor:pointer">
      <div class="userhdr">
        <div class="email ${u.email ? '' : 'muted'}">${u.email || '(anonymous)'}</div>
        <div class="id mono">${u.id}</div>
        <div class="badges">
          ${u.is_anonymous ? '<span class="badge anon">ANON</span>' : '<span class="badge claimed">CLAIMED</span>'}
          ${u.suspended_at ? '<span class="badge suspended">SUSPENDED</span>' : ''}
          ${u.plan === 'trial_trader' ? '<span class="badge trial">TRIAL</span>' : ''}
        </div>
        <div class="stats">
          <div class="stat"><div class="k">plan</div><div class="v">${u.plan}</div></div>
          <div class="stat"><div class="k">credits</div><div class="v">${u.credit_balance}</div></div>
          <div class="stat"><div class="k">created</div><div class="v dim">${fmtRel(u.created_at)}</div></div>
        </div>
      </div>
    </div>
  `).join('');
}

function renderUser(u) {
  currentUser = u;
  return `
    <div class="card">
      <button class="btn ghost" onclick="showSearch()" style="margin-bottom:12px">← BACK TO SEARCH</button>
      <div class="userhdr">
        <div class="email ${u.email ? '' : 'muted'}">${u.email || '(anonymous)'}</div>
        <div class="id mono">${u.id}</div>
        <div class="badges">
          ${u.is_anonymous ? '<span class="badge anon">ANON</span>' : '<span class="badge claimed">CLAIMED</span>'}
          ${u.suspended_at ? '<span class="badge suspended">SUSPENDED</span>' : ''}
          ${u.plan === 'trial_trader' ? '<span class="badge trial">TRIAL</span>' : ''}
        </div>
        <div class="stats">
          <div class="stat"><div class="k">plan</div><div class="v">${u.plan}</div></div>
          <div class="stat"><div class="k">credits</div><div class="v">${u.credit_balance}</div></div>
          <div class="stat"><div class="k">trial exp</div><div class="v dim">${fmtRel(u.trial_expires_at)}</div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> PLAN</h3>
      <div class="row cols-2">
        <select id="planSelect">
          ${PLANS.map(p => `<option value="${p}" ${p===u.plan?'selected':''}>${p}</option>`).join('')}
        </select>
        <input type="text" id="planNote" placeholder="note (optional)">
      </div>
      <button class="btn" onclick="changePlan()">CHANGE PLAN</button>
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> TRIAL</h3>
      <div class="row cols-2">
        <input type="number" id="grantDays" placeholder="days (e.g. 14)" min="1">
        <input type="text" id="grantNote" placeholder="note">
      </div>
      <button class="btn amber" onclick="grantTrial()">GRANT TRIAL</button>
      <hr class="sep">
      <div class="row cols-2">
        <input type="number" id="extendDays" placeholder="extend by N days" min="1">
        <input type="text" id="extendNote" placeholder="note">
      </div>
      <div class="row cols-2">
        <button class="btn amber" onclick="extendTrial()" ${u.trial_expires_at ? '' : 'disabled'}>EXTEND</button>
        <button class="btn ghost" onclick="revokeTrial()" ${u.trial_expires_at ? '' : 'disabled'}>REVOKE</button>
      </div>
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> CREDITS <span style="float:right;color:var(--text-low)">now: <span class="mono" style="color:var(--text-high)">${u.credit_balance}</span></span></h3>
      <div class="row cols-2">
        <input type="number" id="creditDelta" placeholder="±delta (e.g. 10 or -3)">
        <input type="text" id="creditNote" placeholder="note">
      </div>
      <button class="btn green" onclick="adjustCredits()">APPLY</button>
    </div>

    <div class="card ${u.suspended_at ? '' : 'danger'}">
      <h3><span class="accent">◇</span> ${u.suspended_at ? 'REINSTATE' : 'SUSPEND'}</h3>
      <div class="row">
        <input type="text" id="suspendNote" placeholder="note (recommended)">
      </div>
      ${u.suspended_at
        ? `<button class="btn green" onclick="reinstate()">REINSTATE</button>`
        : `<button class="btn red" onclick="suspend()">SUSPEND</button>`}
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> RECENT EVENTS <span style="float:right;color:var(--text-low)">${u.recent_events.length}</span></h3>
      <div class="events">${renderEvents(u.recent_events)}</div>
    </div>
  `;
}

function renderEvents(events) {
  if (!events || events.length === 0) {
    return `<div class="empty" style="padding:20px"><span style="color:var(--text-low)">No events yet.</span></div>`;
  }
  return events.map(e => `
    <div class="ev ${e.event_type}">
      <div class="ev-type">${e.event_type}</div>
      <div class="ev-vals">${e.from_value ?? '—'} → ${e.to_value ?? '—'}</div>
      <div class="ev-meta">${fmtDate(e.created_at)} · ${e.source}</div>
      ${e.note ? `<div class="ev-note">"${e.note}"</div>` : ''}
    </div>
  `).join('');
}

// ── actions ───────────────────────────────────────────────────────────────
function saveToken() {
  const v = document.getElementById('tokenInput').value.trim();
  if (!v) { toast('paste a value first', 'err'); return; }
  setToken(v);
  bootstrap();
}

async function doSearch() {
  const email = document.getElementById('searchEmail').value.trim();
  const did = document.getElementById('searchDeviceId').value.trim();
  if (!email && !did) { toast('email or device id', 'err'); return; }
  const qs = new URLSearchParams();
  if (email) qs.set('email', email);
  if (did) qs.set('device_user_id', did);
  try {
    const arr = await api('GET', '/v1/admin/users?' + qs.toString());
    document.getElementById('results').innerHTML = renderResults(arr);
  } catch (e) { toast(e.message, 'err'); }
}

function openDirect() {
  const id = document.getElementById('directId').value.trim();
  if (!id) return;
  loadUser(id);
}

async function loadUser(id) {
  try {
    const u = await api('GET', `/v1/admin/users/${id}`);
    document.getElementById('main').innerHTML = renderUser(u);
    window.scrollTo({ top: 0, behavior: 'instant' });
  } catch (e) { toast(e.message, 'err'); }
}

async function refreshCurrent() {
  if (!currentUser) return;
  return loadUser(currentUser.id);
}

function showSearch() {
  currentUser = null;
  document.getElementById('main').innerHTML = viewSearch();
}

async function changePlan() {
  const plan = document.getElementById('planSelect').value;
  const note = document.getElementById('planNote').value.trim() || null;
  try {
    await api('PATCH', `/v1/admin/users/${currentUser.id}/plan`, { plan, note });
    toast('plan changed');
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function grantTrial() {
  const days = parseInt(document.getElementById('grantDays').value, 10);
  if (!days || days < 1) { toast('days?', 'err'); return; }
  const note = document.getElementById('grantNote').value.trim() || null;
  try {
    await api('POST', `/v1/admin/users/${currentUser.id}/trial`, { days, note });
    toast(`trial granted (${days}d)`);
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function extendTrial() {
  const days = parseInt(document.getElementById('extendDays').value, 10);
  if (!days || days < 1) { toast('days?', 'err'); return; }
  const note = document.getElementById('extendNote').value.trim() || null;
  try {
    await api('PATCH', `/v1/admin/users/${currentUser.id}/trial`, { action: 'extend', days, note });
    toast(`extended +${days}d`);
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function revokeTrial() {
  if (!confirm('Revoke trial and revert plan to floor_pass?')) return;
  const note = document.getElementById('extendNote').value.trim() || null;
  try {
    await api('PATCH', `/v1/admin/users/${currentUser.id}/trial`, { action: 'revoke', note });
    toast('trial revoked');
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function adjustCredits() {
  const delta = parseInt(document.getElementById('creditDelta').value, 10);
  if (!delta || delta === 0) { toast('delta?', 'err'); return; }
  const note = document.getElementById('creditNote').value.trim() || null;
  try {
    await api('POST', `/v1/admin/users/${currentUser.id}/credits`, { delta, note });
    toast(`credits ${delta > 0 ? '+' : ''}${delta}`);
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function suspend() {
  if (!confirm('Suspend this user? They will be locked out of every authenticated route.')) return;
  const note = document.getElementById('suspendNote').value.trim() || null;
  try {
    await api('POST', `/v1/admin/users/${currentUser.id}/suspend`, { note });
    toast('suspended');
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function reinstate() {
  const note = document.getElementById('suspendNote').value.trim() || null;
  try {
    await api('POST', `/v1/admin/users/${currentUser.id}/reinstate`, { note });
    toast('reinstated');
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

// ── boot ──────────────────────────────────────────────────────────────────
async function bootstrap() {
  const token = getToken();
  if (!token) {
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('main').innerHTML = viewSetup();
    return;
  }
  // Verify by hitting a known-good endpoint.
  try {
    await api('GET', '/v1/admin/users?email=__probe__@nope.invalid');
    document.getElementById('logoutBtn').style.display = '';
    document.getElementById('main').innerHTML = viewSearch();
  } catch (e) {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('main').innerHTML = viewSetup();
    toast(e.message || 'auth failed', 'err');
  }
}

bootstrap();
</script>
</body>
</html>
