<!doctype html>
<!--
  AMI Trade — Admin Back-Office (AT:R27)
  Stop-gap single-page UI for the /v1/admin/* API. Replaced by the
  Flutter web admin app in Beta. Vanilla HTML + CSS + JS so it has
  no build step and survives without npm. AMI Hex-Reinforced Precision
  palette mirrored from mobile/lib/theme/ami_theme.dart.
  CR103 added the MESSAGES tab: tester broadcasts + replies, with
  preview-before-send enforced client-side (the server never orders
  the preview/send calls — scripts/messages.sh honours the same contract).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F172A">
<title>AMI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F172A;
    --panel: #111827;
    --panel-alt: #152845;
    --border: #374151;
    --border-dim: #1F2937;
    --text-high: #F3F4F6;
    --text-med: #94A3B8;
    --text-low: #64748B;
    --blue: #3B82F6;
    --blue-700: #2563EB;
    --cyan: #06B6D4;
    --amber: #F59E0B;
    --green: #10B981;
    --red: #EF4444;
    --purple: #8B5CF6;
    --pink: #EC4899;
    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 24px -16px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text-high); }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── Layout ─────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top));
    background: rgba(15,23,42,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-dim);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.04em; }
  .brand .hex {
    width: 18px; height: 20px;
    background: var(--blue);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .brand .label { font-size: 13px; }
  .brand .label small { color: var(--text-med); font-weight: 500; margin-left: 6px; font-size: 11px; }
  .iconbtn {
    background: transparent;
    color: var(--text-med);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .iconbtn:hover { color: var(--text-high); border-color: var(--text-low); }

  main { padding: 16px; max-width: 720px; margin: 0 auto; }

  /* ── Tabs ───────────────────────────────────────────────── */
  .tabs {
    display: flex; gap: 8px;
    max-width: 720px; margin: 0 auto;
    padding: 12px 16px 0;
  }
  .tab {
    background: transparent;
    border: 1px solid var(--border-dim);
    color: var(--text-med);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
  }
  .tab.active { color: var(--text-high); border-color: var(--blue); background: rgba(59,130,246,0.10); }

  /* ── Cards ──────────────────────────────────────────────── */
  .card {
    background: var(--panel);
    border: 1px solid var(--border-dim);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card h3 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-low);
  }
  .card h3 .accent { color: var(--blue); }
  .card.danger { border-color: rgba(239,68,68,0.35); }
  .card.danger h3 .accent { color: var(--red); }

  /* ── Forms ──────────────────────────────────────────────── */
  input, select, textarea, button {
    font-family: inherit;
    font-size: 14px;
  }
  input[type=text], input[type=number], select, textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text-high);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.18);
  }
  textarea { min-height: 44px; resize: vertical; }
  label.lbl {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-low);
    margin-bottom: 5px;
  }
  .row { display: grid; gap: 8px; margin-bottom: 10px; }
  .row.cols-2 { grid-template-columns: 1fr 1fr; }
  .row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 480px) {
    .row.cols-2, .row.cols-3 { grid-template-columns: 1fr; }
  }

  button.btn {
    width: 100%;
    border: 0;
    background: var(--blue);
    color: white;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 12px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s, transform 0.06s;
  }
  button.btn:hover { background: var(--blue-700); }
  button.btn:active { transform: translateY(1px); }
  button.btn:disabled { background: var(--border); color: var(--text-low); cursor: not-allowed; }
  button.btn.amber { background: var(--amber); color: #0F172A; }
  button.btn.amber:hover { filter: brightness(1.06); }
  button.btn.red { background: var(--red); }
  button.btn.red:hover { background: #DC2626; }
  button.btn.green { background: var(--green); color: #052e16; }
  button.btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-med); }
  button.btn.ghost:hover { color: var(--text-high); border-color: var(--text-low); }

  /* ── User header ────────────────────────────────────────── */
  .userhdr { display: flex; flex-direction: column; gap: 8px; }
  .userhdr .id { font-size: 11px; color: var(--text-low); word-break: break-all; }
  .userhdr .email { font-size: 16px; font-weight: 600; }
  .userhdr .email.muted { color: var(--text-low); font-weight: 500; font-style: italic; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid;
    text-transform: uppercase;
  }
  .badge.anon { color: var(--text-med); border-color: var(--border); }
  .badge.suspended { color: var(--red); border-color: var(--red); background: rgba(239,68,68,0.08); }
  .badge.trial { color: var(--amber); border-color: var(--amber); background: rgba(245,158,11,0.08); }
  .badge.claimed { color: var(--green); border-color: var(--green); background: rgba(16,185,129,0.08); }
  .badge.pri-high { color: var(--amber); border-color: var(--amber); background: rgba(245,158,11,0.08); }
  .badge.pri-normal { color: var(--text-med); border-color: var(--border); }

  /* ── Stat grid ──────────────────────────────────────────── */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border-dim);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat .k {
    font-size: 10px;
    color: var(--text-low);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat .v {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-high);
  }
  .stat .v.dim { color: var(--text-med); }

  /* ── Events ─────────────────────────────────────────────── */
  .events { display: flex; flex-direction: column; gap: 8px; }
  .ev {
    border-left: 2px solid var(--border);
    padding: 4px 0 4px 12px;
  }
  .ev.plan_changed { border-color: var(--blue); }
  .ev.trial_granted, .ev.trial_extended { border-color: var(--amber); }
  .ev.trial_revoked { border-color: var(--text-low); }
  .ev.credits_added, .ev.credits_consumed { border-color: var(--green); }
  .ev.credits_deducted { border-color: var(--red); }
  .ev.user_suspended { border-color: var(--red); }
  .ev.user_reinstated { border-color: var(--green); }
  .ev .ev-type {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-high);
  }
  .ev .ev-vals {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-med);
    margin-top: 1px;
  }
  .ev .ev-meta {
    font-size: 10px;
    color: var(--text-low);
    margin-top: 2px;
  }
  .ev .ev-note { font-size: 11px; color: var(--text-med); font-style: italic; margin-top: 2px; }

  /* ── Empty + status ─────────────────────────────────────── */
  .empty { text-align: center; padding: 40px 16px; color: var(--text-low); }
  .empty .hex {
    width: 36px; height: 40px; margin: 0 auto 12px;
    background: var(--blue);
    opacity: 0.4;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--panel-alt);
    color: var(--text-high);
    padding: 12px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
    box-shadow: 0 16px 32px -12px rgba(0,0,0,0.5);
    z-index: 20;
    max-width: 90vw;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .toast.err { border-color: var(--red); color: #FECACA; }
  .toast.ok { border-color: var(--green); }

  /* ── Setup screen ───────────────────────────────────────── */
  .setup {
    max-width: 460px;
    margin: 60px auto;
    padding: 24px;
  }
  .setup .lead { color: var(--text-med); margin-bottom: 20px; font-size: 13px; }

  hr.sep { border: 0; border-top: 1px solid var(--border-dim); margin: 12px 0; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="hex"></span>
    <span class="label">AMI ADMIN<small>alpha</small></span>
  </div>
  <button class="iconbtn" id="logoutBtn" onclick="logout()" style="display:none">LOGOUT</button>
</header>

<nav class="tabs" id="tabs" style="display:none">
  <button class="tab active" id="tabUsers" onclick="showSearch()">USERS</button>
  <button class="tab" id="tabMessages" onclick="showMessages()">MESSAGES</button>
</nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<script>
const PLANS = ['floor_pass', 'trader', 'floor_manager', 'trial_trader'];
const TOKEN_KEY = 'ami_admin_token';
const API = ''; // same-origin
let currentUser = null;
// SEND is keyed to the exact previewed payload, not a boolean — a stale form can never send.
let msgPreviewedPayload = null;
let msgPreviewCount = 0;

// ── token plumbing ────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function logout() {
  if (!confirm('Clear admin token from this device?')) return;
  localStorage.removeItem(TOKEN_KEY);
  location.reload();
}

// ── api calls ─────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Authorization': 'Bearer ' + getToken(),
      'Content-Type': 'application/json',
    },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    let msg = (data && data.detail) ? data.detail : (typeof data === 'string' ? data : `HTTP ${res.status}`);
    // FastAPI 422 detail is an array of error objects — join it or it renders "[object Object]".
    if (Array.isArray(msg)) msg = msg.map(d => `${(d.loc || []).join('.')}: ${d.msg}`).join('; ');
    throw new Error(msg);
  }
  return data;
}

// ── toast helper ──────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (kind || 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── formatters ────────────────────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtRel(iso) {
  if (!iso) return '—';
  const d = new Date(iso); const now = new Date();
  const days = Math.round((d - now) / 86400000);
  if (days === 0) return 'today';
  if (days > 0) return `in ${days}d`;
  return `${-days}d ago`;
}
function shortId(uuid) { return uuid ? uuid.substring(0, 8) : ''; }
// Broadcast titles/bodies and replies are free text (replies are tester-typed) —
// escape before interpolating into innerHTML.
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ── views ─────────────────────────────────────────────────────────────────
function viewSetup() {
  return `
    <div class="setup">
      <div class="card">
        <h3><span class="accent">◇</span> ADMIN ACCESS</h3>
        <p class="lead">Paste the ADMIN_SECRET (64-hex from <span class="mono">infra/alpha.env</span>). Stored in localStorage on this device only.</p>
        <div class="row">
          <label class="lbl" for="tokenInput">SECRET</label>
          <input type="text" id="tokenInput" placeholder="hex…" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn" onclick="saveToken()">UNLOCK</button>
      </div>
    </div>
  `;
}

function viewSearch() {
  return `
    <div class="card">
      <h3><span class="accent">◇</span> LOOKUP</h3>
      <div class="row cols-2">
        <input type="text" id="searchEmail" placeholder="email@…" autocomplete="off" spellcheck="false">
        <input type="text" id="searchDeviceId" placeholder="device_user_id (uuid)" autocomplete="off" spellcheck="false">
      </div>
      <div class="row cols-2">
        <button class="btn" onclick="doSearch()">SEARCH</button>
        <input type="text" id="directId" placeholder="…or paste user id directly" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')openDirect()">
      </div>
    </div>
    <div id="results"></div>
  `;
}

function renderResults(arr) {
  if (!arr || arr.length === 0) {
    return `<div class="empty"><div class="hex"></div>No matches.</div>`;
  }
  return arr.map(u => `
    <div class="card" onclick="loadUser('${u.id}')" style="cursor:pointer">
      <div class="userhdr">
        <div class="email ${u.email ? '' : 'muted'}">${u.email || '(anonymous)'}</div>
        <div class="id mono">${u.id}</div>
        <div class="badges">
          ${u.is_anonymous ? '<span class="badge anon">ANON</span>' : '<span class="badge claimed">CLAIMED</span>'}
          ${u.suspended_at ? '<span class="badge suspended">SUSPENDED</span>' : ''}
          ${u.plan === 'trial_trader' ? '<span class="badge trial">TRIAL</span>' : ''}
        </div>
        <div class="stats">
          <div class="stat"><div class="k">plan</div><div class="v">${u.plan}</div></div>
          <div class="stat"><div class="k">credits</div><div class="v">${u.credit_balance}</div></div>
          <div class="stat"><div class="k">created</div><div class="v dim">${fmtRel(u.created_at)}</div></div>
        </div>
      </div>
    </div>
  `).join('');
}

function renderUser(u) {
  currentUser = u;
  return `
    <div class="card">
      <button class="btn ghost" onclick="showSearch()" style="margin-bottom:12px">← BACK TO SEARCH</button>
      <div class="userhdr">
        <div class="email ${u.email ? '' : 'muted'}">${u.email || '(anonymous)'}</div>
        <div class="id mono">${u.id}</div>
        <div class="badges">
          ${u.is_anonymous ? '<span class="badge anon">ANON</span>' : '<span class="badge claimed">CLAIMED</span>'}
          ${u.suspended_at ? '<span class="badge suspended">SUSPENDED</span>' : ''}
          ${u.plan === 'trial_trader' ? '<span class="badge trial">TRIAL</span>' : ''}
        </div>
        <div class="stats">
          <div class="stat"><div class="k">plan</div><div class="v">${u.plan}${u.effective_plan && u.effective_plan !== u.plan ? ` → <span style="color:#ff9d4a">${u.effective_plan}</span>` : ''}</div></div>
          <div class="stat"><div class="k">credits</div><div class="v">${u.credit_balance}</div></div>
          <div class="stat"><div class="k">trial</div><div class="v ${u.trial_active ? '' : 'dim'}">${u.trial_active ? 'ACTIVE' : (u.trial_expires_at ? 'EXPIRED' : '—')}${u.trial_expires_at ? ` · ${fmtRel(u.trial_expires_at)}` : ''}</div></div>
        </div>
        ${(u.device_model || u.os_version || u.last_app_version) ? `
        <div class="stats">
          <div class="stat"><div class="k">device</div><div class="v dim">${u.device_model || '—'}</div></div>
          <div class="stat"><div class="k">os</div><div class="v dim">${u.os_version || '—'}</div></div>
          <div class="stat"><div class="k">app</div><div class="v dim">${u.last_app_version || '—'}</div></div>
        </div>` : ''}
        ${(u.devices && u.devices.length > 0) ? `
        <div class="stat" style="margin-top:12px">
          <div class="k">devices (${u.devices.length})</div>
          <div class="v dim" style="font-size:11px;line-height:1.5">
            ${u.devices.map(d => `${d.device_model || '?'} · ${d.os_version || '?'} · ${d.app_version || '?'} · ${fmtRel(d.last_seen_at)}`).join('<br>')}
          </div>
        </div>` : ''}
      </div>
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> PLAN</h3>
      <div class="row cols-2">
        <select id="planSelect">
          ${PLANS.map(p => `<option value="${p}" ${p===u.plan?'selected':''}>${p}</option>`).join('')}
        </select>
        <input type="text" id="planNote" placeholder="note (optional)">
      </div>
      <button class="btn" onclick="changePlan()">CHANGE PLAN</button>
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> TRIAL</h3>
      <div class="row cols-2">
        <input type="number" id="grantDays" placeholder="days (e.g. 14)" min="1">
        <input type="text" id="grantNote" placeholder="note">
      </div>
      <button class="btn amber" onclick="grantTrial()">GRANT TRIAL</button>
      <hr class="sep">
      <div class="row cols-2">
        <input type="number" id="extendDays" placeholder="extend by N days" min="1">
        <input type="text" id="extendNote" placeholder="note">
      </div>
      <div class="row cols-2">
        <button class="btn amber" onclick="extendTrial()" ${u.trial_expires_at ? '' : 'disabled'}>EXTEND</button>
        <button class="btn ghost" onclick="revokeTrial()" ${u.trial_expires_at ? '' : 'disabled'}>REVOKE</button>
      </div>
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> CREDITS <span style="float:right;color:var(--text-low)">now: <span class="mono" style="color:var(--text-high)">${u.credit_balance}</span></span></h3>
      <div class="row cols-2">
        <input type="number" id="creditDelta" placeholder="±delta (e.g. 10 or -3)">
        <input type="text" id="creditNote" placeholder="note">
      </div>
      <button class="btn green" onclick="adjustCredits()">APPLY</button>
    </div>

    <div class="card ${u.suspended_at ? '' : 'danger'}">
      <h3><span class="accent">◇</span> ${u.suspended_at ? 'REINSTATE' : 'SUSPEND'}</h3>
      <div class="row">
        <input type="text" id="suspendNote" placeholder="note (recommended)">
      </div>
      ${u.suspended_at
        ? `<button class="btn green" onclick="reinstate()">REINSTATE</button>`
        : `<button class="btn red" onclick="suspend()">SUSPEND</button>`}
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> RECENT EVENTS <span style="float:right;color:var(--text-low)">${u.recent_events.length}</span></h3>
      <div class="events">${renderEvents(u.recent_events)}</div>
    </div>
  `;
}

function renderEvents(events) {
  if (!events || events.length === 0) {
    return `<div class="empty" style="padding:20px"><span style="color:var(--text-low)">No events yet.</span></div>`;
  }
  return events.map(e => `
    <div class="ev ${e.event_type}">
      <div class="ev-type">${e.event_type}</div>
      <div class="ev-vals">${e.from_value ?? '—'} → ${e.to_value ?? '—'}</div>
      <div class="ev-meta">${fmtDate(e.created_at)} · ${e.source}</div>
      ${e.note ? `<div class="ev-note">"${e.note}"</div>` : ''}
    </div>
  `).join('');
}

function viewMessages() {
  return `
    <div class="card">
      <h3><span class="accent">◇</span> COMPOSE</h3>
      <div class="row">
        <label class="lbl" for="msgTitle">TITLE</label>
        <input type="text" id="msgTitle" maxlength="200" placeholder="title" autocomplete="off" oninput="msgInvalidate()">
      </div>
      <div class="row">
        <label class="lbl" for="msgBody">BODY</label>
        <textarea id="msgBody" maxlength="4000" placeholder="message body" style="min-height:88px" oninput="msgInvalidate()"></textarea>
      </div>
      <div class="row cols-2">
        <div>
          <label class="lbl" for="msgPriority">PRIORITY</label>
          <select id="msgPriority" onchange="msgInvalidate()">
            <option value="normal" selected>normal</option>
            <option value="high">high</option>
          </select>
        </div>
        <div>
          <label class="lbl" for="audMode">AUDIENCE</label>
          <select id="audMode" onchange="msgModeChanged()">
            <option value="all" selected>all testers</option>
            <option value="build">build older than…</option>
            <option value="active">active within N days</option>
            <option value="dormant">dormant beyond N days</option>
            <option value="user">specific user ids</option>
          </select>
        </div>
      </div>
      <div class="row" id="audBuild" style="display:none">
        <label class="lbl" for="audVersion">APP VERSION LT</label>
        <input type="text" id="audVersion" placeholder="0.1.0+55" autocomplete="off" spellcheck="false" oninput="msgInvalidate()">
      </div>
      <div class="row" id="audActivity" style="display:none">
        <label class="lbl" for="audDays">DAYS</label>
        <input type="number" id="audDays" min="1" placeholder="e.g. 7" oninput="msgInvalidate()">
      </div>
      <div class="row" id="audUser" style="display:none">
        <label class="lbl" for="audUserIds">USER IDS (whitespace-separated)</label>
        <textarea id="audUserIds" placeholder="uuid uuid …" spellcheck="false" oninput="msgInvalidate()"></textarea>
      </div>
      <div class="row cols-2">
        <button class="btn ghost" onclick="msgPreview()">PREVIEW</button>
        <button class="btn" id="msgSendBtn" onclick="msgSend()" disabled>SEND</button>
      </div>
      <div class="mono" id="previewResult" style="margin-top:4px;font-size:12px;color:var(--text-med)"></div>
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> BROADCASTS</h3>
      <div class="events" id="broadcastList"></div>
    </div>

    <div class="card">
      <h3><span class="accent">◇</span> REPLIES</h3>
      <div class="row cols-2">
        <input type="number" id="replyDays" min="1" placeholder="last N days (blank = all)">
        <button class="btn ghost" onclick="loadReplies()">REFRESH</button>
      </div>
      <div class="events" id="replyList"></div>
    </div>
  `;
}

function renderBroadcasts(arr) {
  if (!arr || arr.length === 0) {
    return `<div class="empty" style="padding:20px">No broadcasts yet.</div>`;
  }
  return arr.map(b => `
    <div class="ev">
      <div class="ev-type">${esc(b.title)} <span class="badge pri-${b.priority}">${b.priority}</span></div>
      <div class="ev-vals">→ ${b.recipient_count} sent · ${b.reply_count} replies</div>
      <div class="ev-meta">${fmtDate(b.created_at)} · ${shortId(b.id)} · ${esc(JSON.stringify(b.audience))}</div>
    </div>
  `).join('');
}

function renderReplies(arr) {
  if (!arr || arr.length === 0) {
    return `<div class="empty" style="padding:20px">No replies.</div>`;
  }
  return arr.map(r => `
    <div class="ev">
      <div class="ev-type"><a href="#" class="mono" style="color:var(--blue);text-decoration:none" onclick="loadUser('${r.user_id}');return false">${shortId(r.user_id)}</a>${r.broadcast_id ? ` · re ${shortId(r.broadcast_id)}` : ''}</div>
      <div class="ev-vals" style="white-space:pre-wrap">${esc(r.body)}</div>
      <div class="ev-meta">${fmtDate(r.created_at)}</div>
    </div>
  `).join('');
}

// ── actions ───────────────────────────────────────────────────────────────
function saveToken() {
  const v = document.getElementById('tokenInput').value.trim();
  if (!v) { toast('paste a value first', 'err'); return; }
  setToken(v);
  bootstrap();
}

async function doSearch() {
  const email = document.getElementById('searchEmail').value.trim();
  const did = document.getElementById('searchDeviceId').value.trim();
  if (!email && !did) { toast('email or device id', 'err'); return; }
  const qs = new URLSearchParams();
  if (email) qs.set('email', email);
  if (did) qs.set('device_user_id', did);
  try {
    const arr = await api('GET', '/v1/admin/users?' + qs.toString());
    document.getElementById('results').innerHTML = renderResults(arr);
  } catch (e) { toast(e.message, 'err'); }
}

function openDirect() {
  const id = document.getElementById('directId').value.trim();
  if (!id) return;
  loadUser(id);
}

async function loadUser(id) {
  try {
    const u = await api('GET', `/v1/admin/users/${id}`);
    document.getElementById('main').innerHTML = renderUser(u);
    setTab('users');
    window.scrollTo({ top: 0, behavior: 'instant' });
  } catch (e) { toast(e.message, 'err'); }
}

async function refreshCurrent() {
  if (!currentUser) return;
  return loadUser(currentUser.id);
}

function showSearch() {
  currentUser = null;
  setTab('users');
  document.getElementById('main').innerHTML = viewSearch();
}

function setTab(name) {
  document.getElementById('tabUsers').classList.toggle('active', name === 'users');
  document.getElementById('tabMessages').classList.toggle('active', name === 'messages');
}

function showMessages() {
  currentUser = null;
  setTab('messages');
  document.getElementById('main').innerHTML = viewMessages();
  msgInvalidate();
  loadBroadcasts();
  loadReplies();
}

function msgModeChanged() {
  const mode = document.getElementById('audMode').value;
  document.getElementById('audBuild').style.display = mode === 'build' ? '' : 'none';
  document.getElementById('audActivity').style.display = (mode === 'active' || mode === 'dormant') ? '' : 'none';
  document.getElementById('audUser').style.display = mode === 'user' ? '' : 'none';
  msgInvalidate();
}

// Any edit kills the previewed state — SEND re-arms only after a fresh preview.
function msgInvalidate() {
  msgPreviewedPayload = null;
  msgPreviewCount = 0;
  document.getElementById('previewResult').textContent = '';
  document.getElementById('msgSendBtn').disabled = true;
}

function msgBuildPayload() {
  const title = document.getElementById('msgTitle').value.trim();
  const body = document.getElementById('msgBody').value.trim();
  if (!title) { toast('title?', 'err'); return null; }
  if (!body) { toast('body?', 'err'); return null; }
  const priority = document.getElementById('msgPriority').value;
  const mode = document.getElementById('audMode').value;
  let audience;
  if (mode === 'all') {
    audience = { mode: 'all' };
  } else if (mode === 'build') {
    const v = document.getElementById('audVersion').value.trim();
    if (!/\+\d+$/.test(v)) { toast('version needs a +<build> suffix, e.g. 0.1.0+55', 'err'); return null; }
    audience = { mode: 'build', app_version_lt: v };
  } else if (mode === 'active' || mode === 'dormant') {
    const days = parseInt(document.getElementById('audDays').value, 10);
    if (!days || days < 1) { toast('days?', 'err'); return null; }
    audience = mode === 'active'
      ? { mode: 'activity', active_within_days: days }
      : { mode: 'activity', dormant_beyond_days: days };
  } else {
    const ids = document.getElementById('audUserIds').value.trim().split(/\s+/).filter(Boolean);
    if (ids.length === 0) { toast('user ids?', 'err'); return null; }
    audience = { mode: 'user', user_ids: ids };
  }
  return { title, body, priority, audience };
}

async function msgPreview() {
  const payload = msgBuildPayload();
  if (!payload) return;
  try {
    const r = await api('POST', '/v1/admin/messages/preview', payload);
    msgPreviewedPayload = JSON.stringify(payload);
    msgPreviewCount = r.recipient_count;
    document.getElementById('previewResult').textContent = `→ ${r.recipient_count} recipients`;
    document.getElementById('msgSendBtn').disabled = r.recipient_count === 0;
    if (r.recipient_count === 0) toast('0 recipients — excluded/suspended ids preview as 0 by design', 'err');
  } catch (e) { msgInvalidate(); toast(e.message, 'err'); }
}

async function msgSend() {
  const payload = msgBuildPayload();
  if (!payload) return;
  // Even if an invalidation event slipped by, a payload that is not
  // byte-identical to the previewed one never sends.
  if (!msgPreviewedPayload || msgPreviewCount === 0 || JSON.stringify(payload) !== msgPreviewedPayload) {
    msgInvalidate();
    toast('form changed since preview — preview again', 'err');
    return;
  }
  if (!confirm(`Send to ${msgPreviewCount} recipients?`)) return;
  try {
    const r = await api('POST', '/v1/admin/messages', payload);
    toast(`sent ${shortId(r.broadcast_id)} → ${r.recipient_count} recipients`);
    showMessages();
  } catch (e) { toast(e.message, 'err'); }
}

async function loadBroadcasts() {
  const el = document.getElementById('broadcastList');
  try {
    el.innerHTML = renderBroadcasts(await api('GET', '/v1/admin/messages'));
  } catch (e) {
    el.innerHTML = `<div class="empty" style="padding:20px;color:var(--red)">Failed to load broadcasts — ${esc(e.message)}</div>`;
  }
}

async function loadReplies() {
  const el = document.getElementById('replyList');
  const days = parseInt(document.getElementById('replyDays').value, 10);
  // toISOString() ends in 'Z' — a '+00:00' offset 422s (raw '+' in a query string decodes as a space).
  const qs = days >= 1 ? '?since=' + new Date(Date.now() - days * 86400000).toISOString() : '';
  try {
    el.innerHTML = renderReplies(await api('GET', '/v1/admin/messages/replies' + qs));
  } catch (e) {
    el.innerHTML = `<div class="empty" style="padding:20px;color:var(--red)">Failed to load replies — ${esc(e.message)}</div>`;
  }
}

async function changePlan() {
  const plan = document.getElementById('planSelect').value;
  const note = document.getElementById('planNote').value.trim() || null;
  try {
    await api('PATCH', `/v1/admin/users/${currentUser.id}/plan`, { plan, note });
    toast('plan changed');
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function grantTrial() {
  const days = parseInt(document.getElementById('grantDays').value, 10);
  if (!days || days < 1) { toast('days?', 'err'); return; }
  const note = document.getElementById('grantNote').value.trim() || null;
  try {
    await api('POST', `/v1/admin/users/${currentUser.id}/trial`, { days, note });
    toast(`trial granted (${days}d)`);
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function extendTrial() {
  const days = parseInt(document.getElementById('extendDays').value, 10);
  if (!days || days < 1) { toast('days?', 'err'); return; }
  const note = document.getElementById('extendNote').value.trim() || null;
  try {
    await api('PATCH', `/v1/admin/users/${currentUser.id}/trial`, { action: 'extend', days, note });
    toast(`extended +${days}d`);
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function revokeTrial() {
  if (!confirm('Revoke trial and revert plan to floor_pass?')) return;
  const note = document.getElementById('extendNote').value.trim() || null;
  try {
    await api('PATCH', `/v1/admin/users/${currentUser.id}/trial`, { action: 'revoke', note });
    toast('trial revoked');
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function adjustCredits() {
  const delta = parseInt(document.getElementById('creditDelta').value, 10);
  if (!delta || delta === 0) { toast('delta?', 'err'); return; }
  const note = document.getElementById('creditNote').value.trim() || null;
  try {
    await api('POST', `/v1/admin/users/${currentUser.id}/credits`, { delta, note });
    toast(`credits ${delta > 0 ? '+' : ''}${delta}`);
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function suspend() {
  if (!confirm('Suspend this user? They will be locked out of every authenticated route.')) return;
  const note = document.getElementById('suspendNote').value.trim() || null;
  try {
    await api('POST', `/v1/admin/users/${currentUser.id}/suspend`, { note });
    toast('suspended');
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

async function reinstate() {
  const note = document.getElementById('suspendNote').value.trim() || null;
  try {
    await api('POST', `/v1/admin/users/${currentUser.id}/reinstate`, { note });
    toast('reinstated');
    refreshCurrent();
  } catch (e) { toast(e.message, 'err'); }
}

// ── boot ──────────────────────────────────────────────────────────────────
async function bootstrap() {
  const token = getToken();
  if (!token) {
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('main').innerHTML = viewSetup();
    return;
  }
  // Verify by hitting a known-good endpoint.
  try {
    await api('GET', '/v1/admin/users?email=__probe__@nope.invalid');
    document.getElementById('logoutBtn').style.display = '';
    document.getElementById('tabs').style.display = '';
    setTab('users');
    document.getElementById('main').innerHTML = viewSearch();
  } catch (e) {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('main').innerHTML = viewSetup();
    toast(e.message || 'auth failed', 'err');
  }
}

bootstrap();
</script>
</body>
</html>
