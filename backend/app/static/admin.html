<!doctype html>
<!--
  AMI Trade — Admin Console shell (AT:R27, modularized in CR200).
  Vanilla HTML + CSS + JS, no build step, survives without npm. The nav is
  built from the VIEWS registry in admin/core.js; each view lives in its own
  file under /admin/static/ and registers itself at load time, so a new
  module is one more file + one more <script> tag here. __V__ is replaced
  with the git sha at serve time (main.py) for cache busting.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F172A">
<title>AMI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/static/admin.css?v=__V__">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="hex"></span>
    <span class="label">AMI ADMIN<small>alpha</small></span>
  </div>
  <button class="iconbtn" id="logoutBtn" onclick="logout()" style="display:none">LOGOUT</button>
</header>

<nav class="tabs" id="tabs" style="display:none"></nav>

<main id="main"></main>

<div class="toast" id="toast"></div>

<script src="/admin/static/core.js?v=__V__"></script>
<script src="/admin/static/users.js?v=__V__"></script>
<script src="/admin/static/messages.js?v=__V__"></script>
<script src="/admin/static/bugs.js?v=__V__"></script>
<script src="/admin/static/health.js?v=__V__"></script>
<script>bootstrap();</script>
</body>
</html>
