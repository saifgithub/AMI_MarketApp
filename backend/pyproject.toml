[project]
name = "ami-trade-backend"
version = "0.1.0"
description = "AMI Trade backend — FastAPI + TradingAgents wrapper"
requires-python = ">=3.13,<4"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "anthropic>=0.40",
    "openai>=1.55",
    "google-generativeai>=0.8",
    "supabase>=2.10",
    "asyncpg>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "redis>=5.2",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3",
    "resend>=2.4",
    "tenacity>=9.0",
    # Market data — yfinance handles Yahoo's rate-limit dance the
    # keyless chart endpoint couldn't (UA rotation, cookie/crumb
    # session, exponential backoff). Pulls pandas/numpy (~100MB of
    # image bloat) — fine for melehost; will matter at Beta cold-start
    # on Cloud Run where we'll likely cut over to a paid provider.
    # Floor is 1.0, NOT 0.2.x: CR046 M04's dividend_yield_pct is a
    # pass-through round that is only correct on the 1.x convention where
    # info['dividendYield'] is already a percent. 0.2.x returned a decimal
    # fraction → a silent 100× under-report on any rebuild that resolved an
    # older wheel. (Installed: Mac 1.3.0, Alpha 1.5.1 — both satisfy this.)
    "yfinance>=1.0",
    # TradingAgents — installed from local mount for dev; published version in prod
    # "tradingagents @ file:///Volumes/Extreme Pro/TradingAgent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "T20", "RET", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "allow_ledger_drift: this test makes no claim about sim bookkeeping. TWO admissible reasons, and no third: (1) it constructs drift on purpose (the phantom-share detector, its repair script, and DEF316's holdings-vs-ledger gate, whose whole subject is the two sources disagreeing); (2) it hand-seeds sim rows past the engine (fixtures building SimTradeRow/SimHoldingRow directly). A third category — 'the invariant cannot QUERY this schema' — was added for test_def215_schema_ownership.py and then REMOVED: that file's six teardown ERRORs came from DEF324 (a bare reset_for_tests() dropping the suite onto the gitignored backend/.local.db, four migrations stale), not from the older revisions it stands up on purpose. With DEF324 fixed it needs no exemption. The lesson is worth more than the category: an exemption justified by a symptom nobody traced to a cause is how the alarm gets silenced. Exempts it from the autouse ledger-invariant check in conftest.py. State WHICH of the two in a comment beside it: on anything that reaches the engine through submit/evaluate_outcomes/manual_close and expects a CLEAN ledger, this marker is silencing the alarm, not scoping it.",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
