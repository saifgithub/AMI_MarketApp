name: ami-trade-local

# Local + Alpha-host stack.
#
# Runs unchanged on either:
#   - Saiful's Mac (Docker Desktop)   — dev iteration
#   - melehost (Ubuntu Linux server,    — Alpha host. Plain Docker
#     192.168.20.9, plain Docker          Engine, no Docker Desktop.
#     Engine + Compose v5)                See docs/08_tech/hosting.md.
#
# Mirrors the future production stack as closely as possible:
#   - Postgres + Supabase = Supabase Cloud later
#   - Redis = managed Redis later
#   - FastAPI backend = Cloud Run later
#
# Bring up: docker compose up -d
# Tear down: docker compose down
# Logs:     docker compose logs -f api-alpha

services:
  postgres:
    image: postgres:15-alpine
    container_name: ami_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ami_trade
    ports:
      # Host port 5434 to avoid clashing with other Postgres instances on the
      # dev machine (5432, 5433 are commonly taken). Container port stays 5432.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ami_trade"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ami_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Service name matches the public hostname (api-alpha) so the
  # Cloudflare Tunnel ingress rule reads `http://api-alpha:8000` —
  # same name internally and externally is easier to reason about.
  # Build context stays `./backend` (filesystem layout is unchanged).
  api-alpha:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ami_api_alpha
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: ${AMI_ENV:-local}
      # Container-to-container connection still uses 5432 (internal port).
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/ami_trade
      REDIS_URL: redis://redis:6379/0
      # On-prem vLLM (Gemma 4 on the LAN). Empty defaults so the
      # container falls back to mock when not configured. On melehost,
      # set VLLM_BASE_URL=http://192.168.20.74:8000 in .env so the
      # compose backend reaches the on-prem LLM server.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-ami-llm}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # Yahoo quotes vs the mock walk. Set USE_REAL_MARKET_DATA=true in
      # .env to flip on real prices (with a mock-walk fallback). The
      # Yahoo provider works from melehost and the dev Mac.
      USE_REAL_MARKET_DATA: ${USE_REAL_MARKET_DATA:-false}
      # LLM keys — copy from .env file (don't bake into image)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      CORS_ORIGINS: '["https://api-alpha.agenticmarketintel.ai","http://localhost:3000","http://localhost:8000"]'
      # Mount point for the bug_attachments named volume.
      BUG_ATTACHMENTS_DIR: /data/bug_attachments
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
      # Lessons + glossary + ai_coach + daily_challenges all live under
      # /content and are read at boot by LessonsService (and the soon-to-
      # exist GlossaryService etc). lessons_service.py resolves the path
      # via parent.parent.parent.parent → /content/lessons, so the mount
      # point in-container is /content (NOT /app/content). Without this
      # mount the container loads zero lessons.
      - ./content:/content:ro
      # In-app bug-report attachments — photos uploaded via POST
      # /v1/feedback/bug land here. Named volume so they survive
      # container rebuilds. Saiful reviews via:
      #   ssh melehost "ls -la /var/lib/docker/volumes/ami_trade_bug_attachments/_data/"
      - bug_attachments:/data/bug_attachments
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Cloudflare Tunnel (A7) — token-mode connector. Ingress rules,
  # hostname, and Access policy all live in the CF dashboard:
  #   https://one.dash.cloudflare.com/ → Networks → Tunnels → ami-trade
  # Put the real connector token in `.env` (gitignored), NEVER in
  # `.env.example` (committed). See infra/cloudflared/README.md for the
  # systemd path used on the prod host.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ami_tunnel
    command: tunnel --no-autoupdate run
    environment:
      # Empty when not set — `cloudflared` itself fails loudly with
      #   "expected non-empty connector token". Don't use ${VAR:?...} here
      # because Compose evaluates interpolation even for profile-gated
      # services, which would block plain `docker compose config`.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    # On plain Docker Engine for Linux (e.g. Ubuntu / melehost),
    # `host.docker.internal` is NOT provided automatically — only
    # Docker Desktop on Mac / Windows ships it. We add it explicitly
    # via the `host-gateway` keyword so the same dashboard ingress
    # rule (`http://host.docker.internal:8000`) works whether the
    # cloudflared container runs on Docker Desktop or Docker Engine.
    # When the backend is also brought up under this compose stack as
    # the `api-alpha` service, the CF dashboard URL should be flipped
    # to `http://api-alpha:8000` and this extra_hosts entry becomes
    # an unused leftover.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api-alpha:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      # Enable with: docker compose --profile tunnel up -d
      # Skip when developing locally without external HTTPS
      - tunnel

  api-website:
    build:
      context: ./website_api
    container_name: ami_website_api
    restart: unless-stopped
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/ami_website
      CORS_ORIGINS: https://www.agenticmarketintel.ai,https://agenticmarketintel.ai
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  bug_attachments:
