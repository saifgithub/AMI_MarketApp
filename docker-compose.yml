name: ami-trade-local

# Local + Alpha-host stack.
#
# Runs unchanged on either:
#   - Saiful's Mac (Docker Desktop)   — dev iteration
#   - melehost (Ubuntu Linux server,    — Alpha host. Plain Docker
#     192.168.20.9, plain Docker          Engine, no Docker Desktop.
#     Engine + Compose v5)                See docs/initial_specs/08_tech/hosting.md.
#
# Mirrors the future production stack as closely as possible:
#   - Postgres + Supabase = Supabase Cloud later
#   - Redis = managed Redis later
#   - FastAPI backend = Cloud Run later
#
# Bring up: docker compose up -d
# Tear down: docker compose down
# Logs:     docker compose logs -f api-alpha

services:
  postgres:
    # CR124/M14: pinned by digest, not by floating tag. `15-alpine` moves; a
    # rebuild that silently resolves a different image is the supply-chain
    # surface this closes. Refresh deliberately (see infra/README digest note).
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: ami_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # CR124/C3: `postgres`/`postgres` was reachable from any LAN device and
      # read all 30 tables. `:?` refuses to start rather than silently
      # re-defaulting to the known password — the DEF185 pattern, CR040 loud.
      #
      # BEWARE: Postgres only reads this at FIRST init. On an existing
      # `postgres_data` volume the role keeps its OLD password, so changing
      # this alone makes the API unable to connect. The live rotation is an
      # `ALTER USER` in the same window as the recreate — see
      # infra/CR124_HARDENING_RUNBOOK.md, which is the only supported path.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — refusing to boot the default 'postgres' (CR124/C3); see infra/CR124_HARDENING_RUNBOOK.md}
      POSTGRES_DB: ami_trade
    ports:
      # Host port 5434 to avoid clashing with other Postgres instances on the
      # dev machine (5432, 5433 are commonly taken). Container port stays 5432.
      # CR124/C3: bound to loopback. Docker publishes on 0.0.0.0 by default AND
      # bypasses ufw, so the previous "5434:5432" was reachable from the whole
      # LAN regardless of the host firewall.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ami_trade"]
      interval: 5s
      timeout: 3s
      retries: 10
    # CR124/M13: containers were unbounded against the host's 14.86 GiB.
    mem_limit: 2g
    networks: [ami_internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: ami_redis
    # CR124/C3: Redis answered PING with no auth from any LAN device. The
    # loopback bind below is the primary fix; requirepass is the second layer,
    # so a future port-publish mistake is not instantly fatal.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set (CR124/C3); see infra/CR124_HARDENING_RUNBOOK.md}"]
    environment:
      # redis-cli reads REDISCLI_AUTH, so the healthcheck authenticates without
      # putting the password in the process args (`-a` also warns on stderr).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    networks: [ami_internal]
    restart: unless-stopped

  # Service name matches the public hostname (api-alpha) so the
  # Cloudflare Tunnel ingress rule reads `http://api-alpha:8000` —
  # same name internally and externally is easier to reason about.
  # Build context stays `./backend` (filesystem layout is unchanged).
  api-alpha:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # CR175 F2 — deploy identity, passed as build args so the value describes
      # the image rather than the restart. `/promote-to-alpha` exports both
      # before `docker compose build`.
      #
      # `:-unset` is an empty-ish default and NOT the DEF260 shape it resembles:
      # DEF260 was a compose inline default silently supplying a *plausible*
      # value (`${VAR:-30}`) that overrode what the code believed it had set.
      # `unset` is not plausible — it is the sentinel that makes an unstamped
      # container visibly unstamped, and postflight fails on it. A `:?` here
      # would be louder still but compose interpolates the whole file on every
      # command, so it would break `docker compose ps` on melehost.
      args:
        GIT_SHA: ${GIT_SHA:-unset}
        ALPHA_TAG: ${ALPHA_TAG:-unset}
    container_name: ami_api_alpha
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # DEF185 (security review H2): used to default to `local` when
      # AMI_ENV was unset — a publicly-tunneled container silently booting
      # `local` enables legacy unsigned scaffold tokens and leaks
      # magic-link debug codes in the API response. `:?` makes compose
      # itself refuse to start the service rather than silently
      # defaulting — loud per CR040, not a runtime app-level guess.
      ENV: ${AMI_ENV:?AMI_ENV must be set — refusing to silently default to local}
      # Auth HMAC key for scaffold Bearer tokens. Set via ~/ami_trade/.env
      # on melehost (canonical source: infra/alpha.env on Mac, shipped by
      # /promote-to-alpha). Backend refuses to start when env!=local and
      # this is unset (see backend/app/main.py boot check).
      SECRET_KEY: ${SECRET_KEY:-}
      # CR125 — scaffold Bearer token lifetime in days. Backstop expiry for
      # a token nobody ever explicitly signed out; DELETE /v1/auth/session
      # (token_version bump) is the immediate-revocation path.
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
      # CR125 audit — how long past exp a token may still prove account
      # OWNERSHIP on /v1/auth/anon (never authenticate a request). 0
      # re-opens the day-31 orphaning, so it is a choice, not a default.
      AUTH_REBOOTSTRAP_GRACE_DAYS: ${AUTH_REBOOTSTRAP_GRACE_DAYS:-180}
      # CR125 audit — last date a PRE-CR125 token may prove ownership.
      # Empty refuses legacy proof, which orphans every account that has
      # not opened the app since the upgrade. Drop it once the fleet has
      # rolled over (see auth_legacy_rebootstrap_until's log line).
      AUTH_LEGACY_REBOOTSTRAP_UNTIL: ${AUTH_LEGACY_REBOOTSTRAP_UNTIL:-2027-02-07}
      # Admin back-office static bearer (AT:R27). All /v1/admin/* routes
      # require it; empty value returns 503 from those routes (Alpha-only
      # mechanism, replaced by admin_users + JWT in Beta).
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      # CR121 — iOS TestFlight join link for the client-version-gate block
      # screen (no numeric App Store ID exists yet — same DEF100/CR084
      # provisioning gap). Empty = the endpoint falls back to the generic
      # https://testflight.apple.com/ page and logs
      # release_floor_ios_store_url_unconfigured. Set once Saiful has a
      # real join link.
      IOS_TESTFLIGHT_JOIN_URL: ${IOS_TESTFLIGHT_JOIN_URL:-}
      # RevenueCat webhook shared secret (CR084). RC sends this verbatim as the
      # Authorization header on POST /v1/webhooks/revenuecat; the endpoint
      # fails CLOSED (401) on mismatch and refuses LOUDLY (503 + log) when
      # empty — never silent-accept, never silent-reject-all (CR040). Set it in
      # infra/alpha.env to the value pasted into the RC dashboard webhook config.
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      # RevenueCat server-side REST secret key (DEF099). Used server→RC only, to
      # transfer a customer alias orphan→adopter on account claim so post-merge
      # webhooks target the surviving account. Empty = alias transfer degrades
      # loudly (logged, no network call); the webhook merge-trail safety net
      # still re-targets deliveries. Set in infra/alpha.env once RC exists.
      REVENUECAT_SECRET_API_KEY: ${REVENUECAT_SECRET_API_KEY:-}
      # Container-to-container connection still uses 5432 (internal port).
      # CR124/C3: credentials now come from the environment. Both use the same
      # `:?` refusal as the datastore services, so a half-configured host fails
      # at compose time rather than booting an API that cannot reach its DB.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (CR124/C3)}@postgres:5432/ami_trade
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set (CR124/C3)}@redis:6379/0
      # On-prem vLLM (Gemma 4 on the LAN). Empty defaults so the
      # container falls back to mock when not configured. On melehost,
      # set VLLM_BASE_URL=http://192.168.20.74:8000 in .env so the
      # compose backend reaches the on-prem LLM server.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-ami-llm}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # Yahoo quotes vs the mock walk. Set USE_REAL_MARKET_DATA=true in
      # .env to flip on real prices (with a mock-walk fallback). The
      # Yahoo provider works from melehost and the dev Mac.
      USE_REAL_MARKET_DATA: ${USE_REAL_MARKET_DATA:-false}
      # CR136 M03 — cadence of the daily portfolio-value snapshot tick. The job
      # is idempotent per TRADING DAY, so hourly bounds post-restart catch-up
      # delay; it does not mean hourly rows.
      PORTFOLIO_SNAPSHOT_INTERVAL_SECONDS: ${PORTFOLIO_SNAPSHOT_INTERVAL_SECONDS:-3600}
      # CR095 — cadence of the daily-challenge reminder sweep. Users pick an
      # hour, not a minute, so this needs to be well under 3600s (see
      # config.py). Idempotent per (user, local day), so shortening it only
      # tightens latency, never causes a double-send.
      DAILY_REMINDER_TICK_INTERVAL_SECONDS: ${DAILY_REMINDER_TICK_INTERVAL_SECONDS:-900}
      # CR170 §5 — cadence of the resting-order sweep. NOT a latency bound like
      # the ticks above: it is a sampling interval on a continuous price path,
      # so widening it means orders that would have filled in reality do not.
      # Errs conservative (under-fill, never over-fill) by construction.
      SIM_RESTING_ORDER_TICK_INTERVAL_SECONDS: ${SIM_RESTING_ORDER_TICK_INTERVAL_SECONDS:-300}
      # CR136 M06 — whether the Portfolio Health Finding may be narrated by the
      # LLM. False ships the deterministic rendering, which is a complete report.
      PORTFOLIO_HEALTH_LLM_ENABLED: ${PORTFOLIO_HEALTH_LLM_ENABLED:-true}
      # CR109 slice 3c — the house strategy desks. The kill switch removes them
      # from all FUTURE fields; the target size is what they fill TO, so they
      # taper automatically as real entrants arrive.
      GAMES_DESKS_ENABLED: ${GAMES_DESKS_ENABLED:-true}
      GAMES_DESK_TARGET_FIELD_SIZE: ${GAMES_DESK_TARGET_FIELD_SIZE:-8}
      # LLM keys — copy from .env file (don't bake into image)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      # DeepSeek V4 Flash + Qwen Flash (CR017 §3, registered CR141) — same
      # "presence of key turns the feature on" pattern as every other LLM key
      # in this block. DEEPSEEK_API_KEY previously sat in
      # test_config_compose_parity.py's _NOT_FORWARDED (no provider registered
      # against it yet); CR141 registers one, so it must be forwarded here now
      # or it goes dark exactly like DEF063 (CR040).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # Kimi (Moonshot AI), direct API — CR126, Saiful testing as a
      # candidate B7 provider. Mirrors config.py's own defaults into the
      # compose substitution (same pattern as VLLM_MODEL below) — an EMPTY
      # env var still overrides a Settings default, so a bare ":-" here
      # would silently blank base_url/model out even though config.py
      # itself would have picked a sensible default.
      # LLM_FORCE_PROVIDER=kimi actually exercises it for real traffic
      # without touching the vllm>anthropic>kimi>mock preference order —
      # unset (or set to any other registered name) to go back to normal.
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      # Coding Plan endpoint (kimi.com/code console), NOT the general
      # Moonshot Open Platform (api.moonshot.ai) — Saiful's key is scoped to
      # the former; the latter 401s it. See config.py for the full story.
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.kimi.com/coding}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-for-coding}
      # CR130: Kimi is a reasoning model whose chain-of-thought shares the
      # room's per-agent max_tokens budget (600-900, tuned for vLLM) — this
      # floor raises every Kimi call up to at least this value so reasoning
      # never starves the visible answer. See config.py for the measured
      # 900-fails/4000-works curl finding.
      KIMI_MAX_TOKENS_FLOOR: ${KIMI_MAX_TOKENS_FLOOR:-8000}
      LLM_FORCE_PROVIDER: ${LLM_FORCE_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      # OneSignal push (CR027). App ID is client-side too (SDK init); REST
      # key is backend-only, used to call OneSignal's send API. notify()
      # still writes the notifications row and degrades loudly (a logged
      # warning) if either is ever unset.
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_KEY: ${ONESIGNAL_REST_KEY:-}
      # OIDC audiences (DEF038: these lived in .env but were never
      # forwarded here, so the container verified Google tokens against
      # an empty audience list). CSV or single bare value — config.py
      # parses both.
      APPLE_AUDIENCES: ${APPLE_AUDIENCES:-ai.agenticmarketintel.amiTrade}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES:-}
      # Alpaca paper-trading OAuth (AT:R45) — empty until Saiful registers
      # the OAuth app; API-key mode works without them.
      ALPACA_CLIENT_ID: ${ALPACA_CLIENT_ID:-}
      ALPACA_CLIENT_SECRET: ${ALPACA_CLIENT_SECRET:-}
      # Room dedup windows — defaults match config.py; override in .env.
      ROOM_DEDUP_RUNNING_MINUTES: ${ROOM_DEDUP_RUNNING_MINUTES:-30}
      ROOM_DEDUP_COMPLETED_HOURS: ${ROOM_DEDUP_COMPLETED_HOURS:-24}
      # CR098 tenure-drip pull-back — 0 = never withheld, ships as a no-op.
      ROOM_PULLBACK_DAYS_SOCIAL: ${ROOM_PULLBACK_DAYS_SOCIAL:-0}
      ROOM_PULLBACK_DAYS_NEWS: ${ROOM_PULLBACK_DAYS_NEWS:-0}
      ROOM_PULLBACK_DAYS_MARKET: ${ROOM_PULLBACK_DAYS_MARKET:-0}
      # GTM funnel selector (CR047): none (legacy CR039 hard wall) | winzip
      # ("The Winzip" soft wall + cooldown reset). Set GTM_FUNNEL=winzip in
      # infra/alpha.env to arm it on Alpha. Unknown value fails boot by design.
      GTM_FUNNEL: ${GTM_FUNNEL:-none}
      WINZIP_COOLDOWN_MINUTES: ${WINZIP_COOLDOWN_MINUTES:-5}
      # DEF113 — 1-on-1 chat's credit price. 0 in Alpha on purpose (Saiful
      # ruled 2026-07-30): the charging spine is wired and exercised, priced
      # at zero so no existing tester hits a paywall mid-test. Flip to 1 (the
      # credits.md spec price) via infra/alpha.env when ready.
      ONE_ON_ONE_CREDIT_COST: ${ONE_ON_ONE_CREDIT_COST:-0}
      # CR035 ablation toggle — hides the Street consensus line from the
      # agents' fundamentals context. Benchmark windows only; keep false.
      SUPPRESS_ANALYST_CONSENSUS: ${SUPPRESS_ANALYST_CONSENSUS:-false}
      # RULE (CR040): every env-driven Settings field must be forwarded here,
      # or listed in tests/unit/test_config_compose_parity.py::_NOT_FORWARDED
      # with a reason. That test fails the build otherwise. A comment alone is
      # not enough — DEF038 wrote one here and DEF063 still shipped two dark
      # features seven lines below it.
      # Agent live feeds (CR023 news / CR024 social). Both are metered free
      # tiers gated on "key present = feature on", so an EMPTY value is the
      # off switch — see DEF063 before populating them in infra/alpha.env.
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ADANOS_API_KEY: ${ADANOS_API_KEY:-}
      # DEF063, second instance: a live secondary key sat in infra/alpha.env with
      # no Settings field and no line here, so nothing could read it and the
      # parity test could not see it either — it walked Settings → compose, and
      # this key was in neither. 250 paid calls/month idle since 2026-07-21.
      ADANOS_API_KEY_SECONDARY: ${ADANOS_API_KEY_SECONDARY:-}
      # CR041: durable-cache staleness. 30d keeps a 150-ticker benchmark
      # re-runnable at zero quota cost against the 250/month free tier.
      # DEF260: this inline default is a SECOND copy of the value and it is the
      # one that wins — the var is always set in the container, so `config.py`'s
      # default is dead code here. CR148 Tier B changed the Settings default to
      # 7 and the container went on serving 30. Kept in sync by
      # `test_config_compose_parity.py::test_inline_compose_defaults_match_settings`.
      SOCIAL_CACHE_TTL_DAYS: ${SOCIAL_CACHE_TTL_DAYS:-7}
      # Concierge lesson-retrieval mode (CR021): saver | full_context | embedding.
      CONCIERGE_CONTEXT_MODE: ${CONCIERGE_CONTEXT_MODE:-full_context}
      # CR069 Sharia indicator for the `halal` flag. OFF by default → the flag
      # pauses loudly rather than enforcing the retired 7-ticker demo set. Set
      # SHARIA_SCREEN_ENABLED=true in infra/alpha.env once the source fetch is
      # verified. URLs are the published holdings CSVs (SPUS = AAOIFI compliant
      # set; parent = the S&P 500 constituent list for the unknown-vs-screened-out
      # split — DEF089 moved it off the iShares endpoint, which serves an HTML
      # interstitial to a plain client).
      SHARIA_SCREEN_ENABLED: ${SHARIA_SCREEN_ENABLED:-false}
      SHARIA_SPUS_HOLDINGS_URL: ${SHARIA_SPUS_HOLDINGS_URL:-https://www.sp-funds.com/wp-content/uploads/data/TidalFG_Holdings_SPUS.csv}
      SHARIA_PARENT_INDEX_URL: ${SHARIA_PARENT_INDEX_URL:-https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv}
      SHARIA_STALENESS_DAYS: ${SHARIA_STALENESS_DAYS:-7}
      # CR075: the reader's window for a persisted snapshot row. A source outage
      # serves the held list (no request-path fetch) until its as-of ages past
      # this many days, then pauses loudly. Longer than the 7-day fetch window on
      # purpose — a recorded, attributable list is safer to hold than a fresh
      # fetch, and this buys the runway that turns DEF093's block into an ageing.
      SHARIA_HOLD_WINDOW_DAYS: ${SHARIA_HOLD_WINDOW_DAYS:-30}
      # DEF061: sourced sector/industry classification for the no_fossil_fuels +
      # no_tobacco_alcohol_gambling flags. OFF by default → both PAUSE loudly rather
      # than silently permit every name. Flip on once the first live classify pass
      # is verified. Hold window is the reader's runway before a classify outage
      # pauses the filters (longer than the Sharia fetch window — a stored list is
      # safer to hold, and sector/industry drifts far slower than an index).
      CLASSIFICATION_SCREEN_ENABLED: ${CLASSIFICATION_SCREEN_ENABLED:-false}
      CLASSIFICATION_HOLD_WINDOW_DAYS: ${CLASSIFICATION_HOLD_WINDOW_DAYS:-40}
      # CR069-DIVERGE: second-source (HLAL/FTSE) holdings CSV for the
      # divergence MONITOR only — log-only, never read by the halal flag.
      SHARIA_HLAL_HOLDINGS_URL: ${SHARIA_HLAL_HOLDINGS_URL:-https://docs.google.com/spreadsheets/d/1UC1Bk67bGuYsos_i8y_HQpNoHpVHAvqf71MbgrafJOQ/export?format=csv&gid=0}
      # CR128: ticker existence validation — NASDAQ Trader's public, no-auth
      # symbol-directory files, refreshed daily, always on (no feature flag —
      # a bug fix, not a gated feature).
      TICKER_REFERENCE_NASDAQ_LISTED_URL: ${TICKER_REFERENCE_NASDAQ_LISTED_URL:-https://www.nasdaqtrader.com/dynamic/symdir/nasdaqlisted.txt}
      TICKER_REFERENCE_NASDAQ_OTHER_URL: ${TICKER_REFERENCE_NASDAQ_OTHER_URL:-https://www.nasdaqtrader.com/dynamic/symdir/otherlisted.txt}
      # Alpaca paper-trading (AT:R45, DEF044). Encryption key is optional —
      # empty derives the cipher from SECRET_KEY, so at-rest encryption stays
      # on; set it only to rotate independently.
      ALPACA_ENCRYPTION_KEY: ${ALPACA_ENCRYPTION_KEY:-}
      ALPACA_PAPER_BASE_URL: ${ALPACA_PAPER_BASE_URL:-https://paper-api.alpaca.markets}
      ALPACA_OAUTH_TOKEN_URL: ${ALPACA_OAUTH_TOKEN_URL:-https://api.alpaca.markets/oauth/token}
      ALPACA_REDIRECT_URI: ${ALPACA_REDIRECT_URI:-amitrade://alpaca/callback}
      # Bug-report upload cap (bytes) — per-file, then total volume (DEF201).
      BUG_ATTACHMENT_MAX_BYTES: ${BUG_ATTACHMENT_MAX_BYTES:-5242880}
      BUG_ATTACHMENTS_TOTAL_CAP_BYTES: ${BUG_ATTACHMENTS_TOTAL_CAP_BYTES:-2147483648}
      BUG_ATTACHMENTS_RETENTION_DAYS: ${BUG_ATTACHMENTS_RETENTION_DAYS:-60}
      # Concurrent SSE streams one user may hold open across 1-on-1 + Brief
      # combined (DEF201 — the H6 rate limit bounds pace, not concurrency).
      AGENT_STREAM_MAX_CONCURRENT_PER_USER: ${AGENT_STREAM_MAX_CONCURRENT_PER_USER:-2}
      # Reputation + weekly leagues (CR004, D-060).
      REPUTATION_DAILY_CAP: ${REPUTATION_DAILY_CAP:-25}
      LEAGUE_COHORT_SIZE: ${LEAGUE_COHORT_SIZE:-30}
      LEAGUE_PROMOTE_COUNT: ${LEAGUE_PROMOTE_COUNT:-5}
      LEAGUE_RELEGATE_COUNT: ${LEAGUE_RELEGATE_COUNT:-5}
      LEAGUE_ELIGIBLE_PLANS: ${LEAGUE_ELIGIBLE_PLANS:-}
      # CR136 — Portfolio Health access gate. Defaults are MIRRORED into the
      # substitutions on purpose: an empty env var still overrides a Settings
      # default (the KIMI block above records this trap), so a bare `:-` would
      # blank the plans list and hard-close `plan` mode, or blank the mode and
      # fail the Literal at boot. Launch `trial` → full `plan` gating is then a
      # pure env change plus a container recreate; no code path differs.
      PORTFOLIO_HEALTH_GATE_MODE: ${PORTFOLIO_HEALTH_GATE_MODE:-trial}
      PORTFOLIO_HEALTH_TRIAL_DAYS: ${PORTFOLIO_HEALTH_TRIAL_DAYS:-14}
      # DEF266: was `:-7`, the value DEF219 REPLACED. `config.py` and
      # `portfolio_health_constants.TRIAL_FINDINGS_DEFAULT` both say 3 (Saiful's
      # call, 2026-08-06: count the trial in Findings, not days), and compose's
      # stale copy is what the container actually ran — so that decision was
      # dark on Alpha from the day it shipped. Corrected to the decided value.
      PORTFOLIO_HEALTH_TRIAL_FINDINGS: ${PORTFOLIO_HEALTH_TRIAL_FINDINGS:-3}
      PORTFOLIO_HEALTH_DAILY_CAP: ${PORTFOLIO_HEALTH_DAILY_CAP:-2}
      PORTFOLIO_HEALTH_PLANS: ${PORTFOLIO_HEALTH_PLANS:-trader,floor_manager}
      CORS_ORIGINS: '["https://api-alpha.agenticmarketintel.ai","http://localhost:3000","http://localhost:8000"]'
      # Mount point for the bug_attachments named volume.
      BUG_ATTACHMENTS_DIR: /data/bug_attachments
      # SMTP for magic-link email (AT:R26). When SMTP_HOST is empty
      # the email_service is a no-op — keep it empty until a working
      # SMTP route is in place (melehost ISP blocks outbound to
      # mail.agenticmarketintel.ai; Gmail/Resend is the fallback).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      # CR124 deliberately leaves this on 0.0.0.0 while 5434/6379/8001 move to
      # loopback. The Cloudflare Tunnel's ingress target lives in the CF
      # dashboard, not in this repo: if it still points at
      # `http://host.docker.internal:8000` (see the cloudflared block's own
      # comment) then host-gateway — NOT 127.0.0.1 — is the address it dials,
      # and a loopback bind here takes Alpha down. Unlike the datastores this
      # port fronts an authenticated API that is already internet-reachable
      # through the tunnel, so the exposure delta is small. Flip it to
      # "127.0.0.1:8000:8000" only after confirming the dashboard ingress reads
      # `http://api-alpha:8000`; CR124's acceptance list covers 5434/6379/8001.
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
      # DEF201: scripts/ isn't baked into the image, so a script here can't
      # `docker exec` (the way social_cache_warm.py's own docstring already
      # assumes) without this — prune_bug_attachments.py needs app.core.config
      # (pydantic-settings isn't on melehost's bare python3, confirmed 2026-07-30,
      # so it must run inside this container, not on the host).
      - ./backend/scripts:/app/scripts:ro
      # CR164: the backtest harness is a STANDING regression instrument — it
      # re-runs after any infra change — so its batch JSONLs need a path that
      # survives a container recreate. Everything else here is read-only and
      # container /tmp is wiped on every `up --build`, which cost one pilot's
      # records already. Host-side dir, writable, harness output only.
      - ./backtest_results:/backtest_results:rw
      # Lessons + glossary + ai_coach + daily_challenges all live under
      # /content and are read at boot by LessonsService (and the soon-to-
      # exist GlossaryService etc). lessons_service.py resolves the path
      # via parent.parent.parent.parent → /content/lessons, so the mount
      # point in-container is /content (NOT /app/content). Without this
      # mount the container loads zero lessons.
      - ./content:/content:ro
      # In-app bug-report attachments — photos uploaded via POST
      # /v1/feedback/bug land here. Named volume so they survive
      # container rebuilds. Saiful reviews via:
      #   ssh melehost "ls -la /var/lib/docker/volumes/ami_trade_bug_attachments/_data/"
      - bug_attachments:/data/bug_attachments
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # CR124/M13 + DEF184: bounds the request-body buffering DoS. yfinance pulls
    # pandas/numpy in, so this sits well above the datastores.
    mem_limit: 4g
    networks: [ami_internal]
    restart: unless-stopped

  # Cloudflare Tunnel (A7) — token-mode connector. Ingress rules,
  # hostname, and Access policy all live in the CF dashboard:
  #   https://one.dash.cloudflare.com/ → Networks → Tunnels → ami-trade
  # Put the real connector token in `.env` (gitignored), NEVER in
  # `.env.example` (committed). See infra/cloudflared/README.md for the
  # systemd path used on the prod host.
  cloudflared:
    # CR124/M14: digest-pinned like the rest of the stack. `latest` on a tunnel
    # connector is the one pin worth refreshing on a schedule — bump it
    # deliberately when updating, don't drop back to the floating tag.
    image: cloudflare/cloudflared:latest@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    container_name: ami_tunnel
    command: tunnel --no-autoupdate run
    environment:
      # Empty when not set — `cloudflared` itself fails loudly with
      #   "expected non-empty connector token". Don't use ${VAR:?...} here
      # because Compose evaluates interpolation even for profile-gated
      # services, which would block plain `docker compose config`.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
      # DEF070: force HTTP/2 (TCP) transport instead of the default QUIC
      # (UDP). melehost's UDP path to the CF edge drops packets, so QUIC
      # connections flap with "timeout: no recent network activity" and
      # users intermittently get 502s while all edge connections reconnect.
      # HTTP/2 sidesteps every UDP failure mode. Revert to quic/auto only if
      # the UDP path is fixed. Values: quic | http2 | auto.
      TUNNEL_TRANSPORT_PROTOCOL: ${CF_TUNNEL_PROTOCOL:-http2}
    # On plain Docker Engine for Linux (e.g. Ubuntu / melehost),
    # `host.docker.internal` is NOT provided automatically — only
    # Docker Desktop on Mac / Windows ships it. We add it explicitly
    # via the `host-gateway` keyword so the same dashboard ingress
    # rule (`http://host.docker.internal:8000`) works whether the
    # cloudflared container runs on Docker Desktop or Docker Engine.
    # When the backend is also brought up under this compose stack as
    # the `api-alpha` service, the CF dashboard URL should be flipped
    # to `http://api-alpha:8000` and this extra_hosts entry becomes
    # an unused leftover.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api-alpha:
        condition: service_healthy
    mem_limit: 256m
    networks: [ami_internal]
    restart: unless-stopped
    profiles:
      # Enable with: docker compose --profile tunnel up -d
      # Skip when developing locally without external HTTPS
      - tunnel

  api-website:
    build:
      context: ./website_api
    container_name: ami_website_api
    restart: unless-stopped
    environment:
      ENV: prod
      # CR124/M8: was the Postgres SUPERUSER, so any RCE in the public
      # marketing API was a direct pivot into the app database (users,
      # magic-link challenges, mandates). Now a dedicated role that owns only
      # `ami_website`. The role is created by
      # infra/local/postgres-init/01_website_role.sql on a FRESH volume; on the
      # existing melehost volume it must be created by hand — see
      # infra/CR124_HARDENING_RUNBOOK.md step 3.
      DATABASE_URL: postgresql+psycopg2://ami_website:${WEBSITE_DB_PASSWORD:?WEBSITE_DB_PASSWORD must be set (CR124/M8)}@postgres:5432/ami_website
      CORS_ORIGINS: https://www.agenticmarketintel.ai,https://agenticmarketintel.ai
      # On-prem model for the website Concierge (reuses the same LAN server as api-alpha).
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-ami-llm}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # Transactional email (Resend) for auto-answers, acks, and data-request notices.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${WEBSITE_RESEND_FROM:-AMI <support.ai@agenticmarketintel.ai>}
      # Where contact escalations + data requests are forwarded (set to Saiful's inbox).
      NOTIFY_EMAIL: ${WEBSITE_NOTIFY_EMAIL:-}
      # Cloudflare Turnstile secret — unset → bot-check bypassed (see turnstile.py).
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    ports:
      # CR124/C3: loopback only. Cloudflare reaches the marketing API through
      # its own tunnel/proxy, never via a LAN-published port.
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    networks: [ami_internal]

# CR124/N6: the AMI stack gets its OWN network. It previously sat on the
# project default (`ami-trade-local_default`), which melehost's separate `n8n`
# container had joined — giving an RCE-prone automation tool a direct route to
# the superuser database, the unauthenticated Redis and the internal API.
# Declaring the network here evicts it from our side; if n8n's own compose file
# names this network explicitly it must also be edited on melehost (runbook
# step 5).
networks:
  ami_internal:
    name: ami_internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  bug_attachments:
