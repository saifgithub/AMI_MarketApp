name: ami-trade-local

# Local + Alpha-host stack.
#
# Runs unchanged on either:
#   - Saiful's Mac (Docker Desktop)   — dev iteration
#   - melehost (Ubuntu Linux server,    — Alpha host. Plain Docker
#     192.168.20.9, plain Docker          Engine, no Docker Desktop.
#     Engine + Compose v5)                See docs/initial_specs/08_tech/hosting.md.
#
# Mirrors the future production stack as closely as possible:
#   - Postgres + Supabase = Supabase Cloud later
#   - Redis = managed Redis later
#   - FastAPI backend = Cloud Run later
#
# Bring up: docker compose up -d
# Tear down: docker compose down
# Logs:     docker compose logs -f api-alpha

services:
  postgres:
    image: postgres:15-alpine
    container_name: ami_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ami_trade
    ports:
      # Host port 5434 to avoid clashing with other Postgres instances on the
      # dev machine (5432, 5433 are commonly taken). Container port stays 5432.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ami_trade"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ami_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Service name matches the public hostname (api-alpha) so the
  # Cloudflare Tunnel ingress rule reads `http://api-alpha:8000` —
  # same name internally and externally is easier to reason about.
  # Build context stays `./backend` (filesystem layout is unchanged).
  api-alpha:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ami_api_alpha
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: ${AMI_ENV:-local}
      # Auth HMAC key for scaffold Bearer tokens. Set via ~/ami_trade/.env
      # on melehost (canonical source: infra/alpha.env on Mac, shipped by
      # /promote-to-alpha). Backend refuses to start when env!=local and
      # this is unset (see backend/app/main.py boot check).
      SECRET_KEY: ${SECRET_KEY:-}
      # Admin back-office static bearer (AT:R27). All /v1/admin/* routes
      # require it; empty value returns 503 from those routes (Alpha-only
      # mechanism, replaced by admin_users + JWT in Beta).
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      # Container-to-container connection still uses 5432 (internal port).
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/ami_trade
      REDIS_URL: redis://redis:6379/0
      # On-prem vLLM (Gemma 4 on the LAN). Empty defaults so the
      # container falls back to mock when not configured. On melehost,
      # set VLLM_BASE_URL=http://192.168.20.74:8000 in .env so the
      # compose backend reaches the on-prem LLM server.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-ami-llm}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # Yahoo quotes vs the mock walk. Set USE_REAL_MARKET_DATA=true in
      # .env to flip on real prices (with a mock-walk fallback). The
      # Yahoo provider works from melehost and the dev Mac.
      USE_REAL_MARKET_DATA: ${USE_REAL_MARKET_DATA:-false}
      # LLM keys — copy from .env file (don't bake into image)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      # OIDC audiences (DEF038: these lived in .env but were never
      # forwarded here, so the container verified Google tokens against
      # an empty audience list). CSV or single bare value — config.py
      # parses both.
      APPLE_AUDIENCES: ${APPLE_AUDIENCES:-ai.agenticmarketintel.amiTrade}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES:-}
      # Alpaca paper-trading OAuth (AT:R45) — empty until Saiful registers
      # the OAuth app; API-key mode works without them.
      ALPACA_CLIENT_ID: ${ALPACA_CLIENT_ID:-}
      ALPACA_CLIENT_SECRET: ${ALPACA_CLIENT_SECRET:-}
      # Room dedup windows — defaults match config.py; override in .env.
      ROOM_DEDUP_RUNNING_MINUTES: ${ROOM_DEDUP_RUNNING_MINUTES:-30}
      ROOM_DEDUP_COMPLETED_HOURS: ${ROOM_DEDUP_COMPLETED_HOURS:-24}
      # GTM funnel selector (CR047): none (legacy CR039 hard wall) | winzip
      # ("The Winzip" soft wall + cooldown reset). Set GTM_FUNNEL=winzip in
      # infra/alpha.env to arm it on Alpha. Unknown value fails boot by design.
      GTM_FUNNEL: ${GTM_FUNNEL:-none}
      WINZIP_COOLDOWN_MINUTES: ${WINZIP_COOLDOWN_MINUTES:-5}
      # CR035 ablation toggle — hides the Street consensus line from the
      # agents' fundamentals context. Benchmark windows only; keep false.
      SUPPRESS_ANALYST_CONSENSUS: ${SUPPRESS_ANALYST_CONSENSUS:-false}
      # RULE (CR040): every env-driven Settings field must be forwarded here,
      # or listed in tests/unit/test_config_compose_parity.py::_NOT_FORWARDED
      # with a reason. That test fails the build otherwise. A comment alone is
      # not enough — DEF038 wrote one here and DEF063 still shipped two dark
      # features seven lines below it.
      # Agent live feeds (CR023 news / CR024 social). Both are metered free
      # tiers gated on "key present = feature on", so an EMPTY value is the
      # off switch — see DEF063 before populating them in infra/alpha.env.
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ADANOS_API_KEY: ${ADANOS_API_KEY:-}
      # CR041: durable-cache staleness. 30d keeps a 150-ticker benchmark
      # re-runnable at zero quota cost against the 250/month free tier.
      SOCIAL_CACHE_TTL_DAYS: ${SOCIAL_CACHE_TTL_DAYS:-30}
      # Concierge lesson-retrieval mode (CR021): saver | full_context | embedding.
      CONCIERGE_CONTEXT_MODE: ${CONCIERGE_CONTEXT_MODE:-full_context}
      # CR069 Sharia indicator for the `halal` flag. OFF by default → the flag
      # pauses loudly rather than enforcing the retired 7-ticker demo set. Set
      # SHARIA_SCREEN_ENABLED=true in infra/alpha.env once the source fetch is
      # verified. URLs are the published holdings CSVs (SPUS = AAOIFI compliant
      # set; parent = the S&P 500 constituent list for the unknown-vs-screened-out
      # split — DEF089 moved it off the iShares endpoint, which serves an HTML
      # interstitial to a plain client).
      SHARIA_SCREEN_ENABLED: ${SHARIA_SCREEN_ENABLED:-false}
      SHARIA_SPUS_HOLDINGS_URL: ${SHARIA_SPUS_HOLDINGS_URL:-https://www.sp-funds.com/wp-content/uploads/data/TidalFG_Holdings_SPUS.csv}
      SHARIA_PARENT_INDEX_URL: ${SHARIA_PARENT_INDEX_URL:-https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv}
      SHARIA_STALENESS_DAYS: ${SHARIA_STALENESS_DAYS:-7}
      # CR069-DIVERGE: second-source (HLAL/FTSE) holdings CSV for the
      # divergence MONITOR only — log-only, never read by the halal flag.
      SHARIA_HLAL_HOLDINGS_URL: ${SHARIA_HLAL_HOLDINGS_URL:-https://docs.google.com/spreadsheets/d/1UC1Bk67bGuYsos_i8y_HQpNoHpVHAvqf71MbgrafJOQ/export?format=csv&gid=0}
      # Alpaca paper-trading (AT:R45, DEF044). Encryption key is optional —
      # empty derives the cipher from SECRET_KEY, so at-rest encryption stays
      # on; set it only to rotate independently.
      ALPACA_ENCRYPTION_KEY: ${ALPACA_ENCRYPTION_KEY:-}
      ALPACA_PAPER_BASE_URL: ${ALPACA_PAPER_BASE_URL:-https://paper-api.alpaca.markets}
      ALPACA_OAUTH_TOKEN_URL: ${ALPACA_OAUTH_TOKEN_URL:-https://api.alpaca.markets/oauth/token}
      ALPACA_REDIRECT_URI: ${ALPACA_REDIRECT_URI:-amitrade://alpaca/callback}
      # Bug-report upload cap (bytes).
      BUG_ATTACHMENT_MAX_BYTES: ${BUG_ATTACHMENT_MAX_BYTES:-5242880}
      # Reputation + weekly leagues (CR004, D-060).
      REPUTATION_DAILY_CAP: ${REPUTATION_DAILY_CAP:-25}
      LEAGUE_COHORT_SIZE: ${LEAGUE_COHORT_SIZE:-30}
      LEAGUE_PROMOTE_COUNT: ${LEAGUE_PROMOTE_COUNT:-5}
      LEAGUE_RELEGATE_COUNT: ${LEAGUE_RELEGATE_COUNT:-5}
      LEAGUE_ELIGIBLE_PLANS: ${LEAGUE_ELIGIBLE_PLANS:-}
      CORS_ORIGINS: '["https://api-alpha.agenticmarketintel.ai","http://localhost:3000","http://localhost:8000"]'
      # Mount point for the bug_attachments named volume.
      BUG_ATTACHMENTS_DIR: /data/bug_attachments
      # SMTP for magic-link email (AT:R26). When SMTP_HOST is empty
      # the email_service is a no-op — keep it empty until a working
      # SMTP route is in place (melehost ISP blocks outbound to
      # mail.agenticmarketintel.ai; Gmail/Resend is the fallback).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
      # Lessons + glossary + ai_coach + daily_challenges all live under
      # /content and are read at boot by LessonsService (and the soon-to-
      # exist GlossaryService etc). lessons_service.py resolves the path
      # via parent.parent.parent.parent → /content/lessons, so the mount
      # point in-container is /content (NOT /app/content). Without this
      # mount the container loads zero lessons.
      - ./content:/content:ro
      # In-app bug-report attachments — photos uploaded via POST
      # /v1/feedback/bug land here. Named volume so they survive
      # container rebuilds. Saiful reviews via:
      #   ssh melehost "ls -la /var/lib/docker/volumes/ami_trade_bug_attachments/_data/"
      - bug_attachments:/data/bug_attachments
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Cloudflare Tunnel (A7) — token-mode connector. Ingress rules,
  # hostname, and Access policy all live in the CF dashboard:
  #   https://one.dash.cloudflare.com/ → Networks → Tunnels → ami-trade
  # Put the real connector token in `.env` (gitignored), NEVER in
  # `.env.example` (committed). See infra/cloudflared/README.md for the
  # systemd path used on the prod host.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ami_tunnel
    command: tunnel --no-autoupdate run
    environment:
      # Empty when not set — `cloudflared` itself fails loudly with
      #   "expected non-empty connector token". Don't use ${VAR:?...} here
      # because Compose evaluates interpolation even for profile-gated
      # services, which would block plain `docker compose config`.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
      # DEF070: force HTTP/2 (TCP) transport instead of the default QUIC
      # (UDP). melehost's UDP path to the CF edge drops packets, so QUIC
      # connections flap with "timeout: no recent network activity" and
      # users intermittently get 502s while all edge connections reconnect.
      # HTTP/2 sidesteps every UDP failure mode. Revert to quic/auto only if
      # the UDP path is fixed. Values: quic | http2 | auto.
      TUNNEL_TRANSPORT_PROTOCOL: ${CF_TUNNEL_PROTOCOL:-http2}
    # On plain Docker Engine for Linux (e.g. Ubuntu / melehost),
    # `host.docker.internal` is NOT provided automatically — only
    # Docker Desktop on Mac / Windows ships it. We add it explicitly
    # via the `host-gateway` keyword so the same dashboard ingress
    # rule (`http://host.docker.internal:8000`) works whether the
    # cloudflared container runs on Docker Desktop or Docker Engine.
    # When the backend is also brought up under this compose stack as
    # the `api-alpha` service, the CF dashboard URL should be flipped
    # to `http://api-alpha:8000` and this extra_hosts entry becomes
    # an unused leftover.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api-alpha:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      # Enable with: docker compose --profile tunnel up -d
      # Skip when developing locally without external HTTPS
      - tunnel

  api-website:
    build:
      context: ./website_api
    container_name: ami_website_api
    restart: unless-stopped
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/ami_website
      CORS_ORIGINS: https://www.agenticmarketintel.ai,https://agenticmarketintel.ai
      # On-prem model for the website Concierge (reuses the same LAN server as api-alpha).
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-ami-llm}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # Transactional email (Resend) for auto-answers, acks, and data-request notices.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${WEBSITE_RESEND_FROM:-AMI <support.ai@agenticmarketintel.ai>}
      # Where contact escalations + data requests are forwarded (set to Saiful's inbox).
      NOTIFY_EMAIL: ${WEBSITE_NOTIFY_EMAIL:-}
      # Cloudflare Turnstile secret — unset → bot-check bypassed (see turnstile.py).
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  bug_attachments:
