# CR200-R003 slice 1 — AMI Ops tool surface (read-only).
# Imported into Dify as a custom tool; auth is Bearer with the Alpha
# ADMIN_SECRET (configured in Dify, never in this file). Server is the
# LAN-direct alpha API; override via the servers block if the port moves.
openapi: 3.0.3
info:
  title: AMI Trade Admin API (read-only subset)
  version: 0.1.0
servers:
  - url: http://192.168.20.59:8000
paths:
  /v1/admin/users:
    get:
      operationId: user_search
      summary: Find a user by exact email or device_user_id (one is required).
      parameters:
        - name: email
          in: query
          schema: { type: string }
        - name: device_user_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Up to 20 matching users }
  /v1/admin/users/{user_id}:
    get:
      operationId: user_detail
      summary: Full profile for one user — plan, credits, devices, trial, suspension.
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: User detail }
  /v1/admin/overview:
    get:
      operationId: health_overview
      summary: Ops heartbeat — readiness probes, build sha, LLM status and cache rate, release floor, market-data mode.
      responses:
        '200': { description: Overview }
  /v1/admin/config-check:
    get:
      operationId: config_check
      summary: Which configured features are live vs dark (degrade-loudly diagnostic).
      responses:
        '200': { description: Config coverage }
  /v1/admin/analytics/summary:
    get:
      operationId: analytics_summary
      summary: Headline scalars — total/DAU/WAU/MAU users and related counts.
      responses:
        '200': { description: Summary }
  /v1/admin/analytics/timeseries:
    get:
      operationId: analytics_timeseries
      summary: Per-day series (signups, active_users, room_runs, credits_spent, trades, game_players), zero-filled, oldest to newest.
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
      responses:
        '200': { description: Timeseries }
  /v1/admin/analytics/revenuecat:
    get:
      operationId: analytics_revenuecat
      summary: RevenueCat event counts and recent feed.
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
      responses:
        '200': { description: RevenueCat }
  /v1/admin/chart.svg:
    get:
      operationId: chart
      summary: Render one timeseries as an SVG chart. Embed the URL in chat as a markdown image — it renders as a real chart.
      parameters:
        - name: series
          in: query
          required: true
          schema:
            type: string
            enum: [signups, active_users, room_runs, credits_spent, trades, game_players]
        - name: days
          in: query
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: SVG chart (image/svg+xml)
          content:
            image/svg+xml: {}
  /v1/admin/messages/replies:
    get:
      operationId: replies_list
      summary: Inbound tester replies to broadcasts, newest first, optionally filtered by time.
      parameters:
        - name: since
          in: query
          description: ISO-8601 timestamp with Z suffix, e.g. 2026-10-08T00:00:00Z
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Replies }
  /v1/admin/bugs:
    get:
      operationId: bug_list
      summary: Bug reports with per-status counts across all reports.
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200': { description: Bug list }
  /v1/admin/messages/preview:
    post:
      operationId: message_preview
      summary: Dry-run a broadcast — resolves the audience and returns the exact recipient count. Sends nothing. ALWAYS call this before message_send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, audience]
              properties:
                title: { type: string }
                body: { type: string }
                priority: { type: string, enum: [normal, high], default: normal }
                audience:
                    type: object
                    description: 'JSON object, e.g. {"mode":"all"}'
                    additionalProperties: false
                    required: [mode]
                    properties:
                      mode: { type: string, enum: [all, build, activity, user] }
                      app_version_lt: { type: string, description: 'mode=build only, with +<build> suffix e.g. 0.1.0+92' }
                      active_within_days: { type: integer, minimum: 1 }
                      dormant_beyond_days: { type: integer, minimum: 1 }
                      user_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: '{recipient_count: int}'
          content:
            application/json: {}
  /v1/admin/messages:
    get:
      operationId: broadcasts_list
      summary: Past admin broadcasts with reply counts.
      responses:
        '200': { description: Broadcasts }
    post:
      operationId: message_send
      summary: Fan out an in-app broadcast to the resolved audience. NEVER call without a message_preview of the identical payload in the same session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, audience]
              properties:
                title: { type: string }
                body: { type: string }
                priority: { type: string, enum: [normal, high], default: normal }
                audience:
                    type: object
                    description: 'JSON object, e.g. {"mode":"all"}'
                    additionalProperties: false
                    required: [mode]
                    properties:
                      mode: { type: string, enum: [all, build, activity, user] }
                      app_version_lt: { type: string, description: 'mode=build only, with +<build> suffix e.g. 0.1.0+92' }
                      active_within_days: { type: integer, minimum: 1 }
                      dormant_beyond_days: { type: integer, minimum: 1 }
                      user_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: '{broadcast_id, recipient_count}'
          content:
            application/json: {}
  /v1/admin/push/preview:
    post:
      operationId: push_preview
      summary: Dry-run a push broadcast — resolves the audience, returns recipient count and whether push is configured. Sends nothing. ALWAYS call this before push_send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience]
              properties:
                audience:
                    type: object
                    description: 'JSON object, e.g. {"mode":"all"}'
                    additionalProperties: false
                    required: [mode]
                    properties:
                      mode: { type: string, enum: [all, build, activity, user] }
                      app_version_lt: { type: string, description: 'mode=build only, with +<build> suffix e.g. 0.1.0+92' }
                      active_within_days: { type: integer, minimum: 1 }
                      dormant_beyond_days: { type: integer, minimum: 1 }
                      user_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: '{audience_mode, recipient_count, push_configured}'
          content:
            application/json: {}
  /v1/admin/push:
    post:
      operationId: push_send
      summary: Push-notify every resolved user (notifications row + OneSignal). NEVER call without a push_preview in the same session; refuse on zero recipients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience, title, body]
              properties:
                audience:
                    type: object
                    description: 'JSON object, e.g. {"mode":"all"}'
                    additionalProperties: false
                    required: [mode]
                    properties:
                      mode: { type: string, enum: [all, build, activity, user] }
                      app_version_lt: { type: string, description: 'mode=build only, with +<build> suffix e.g. 0.1.0+92' }
                      active_within_days: { type: integer, minimum: 1 }
                      dormant_beyond_days: { type: integer, minimum: 1 }
                      user_ids: { type: array, items: { type: string, format: uuid } }
                title: { type: string }
                body: { type: string }
      responses:
        '200':
          description: '{recipient_count, status_counts}'
          content:
            application/json: {}
components:
  securitySchemes:
    bearer:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    Audience:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [all, build, activity, user] }
        app_version_lt: { type: string, description: 'mode=build only, with +<build> suffix e.g. 0.1.0+92' }
        active_within_days: { type: integer, minimum: 1 }
        dormant_beyond_days: { type: integer, minimum: 1 }
        user_ids: { type: array, items: { type: string, format: uuid } }
security:
  - bearer: []
