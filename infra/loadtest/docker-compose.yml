name: ami-loadtest

# CR246 — disposable load-test stack for minihost (192.168.20.14).
#
# A second, fully isolated copy of the backend: own Postgres, own Redis, own
# SECRET_KEY, mock LLM. Exists so the multi-user concurrency harness
# (backend/scripts/load_test_mix.js) can drive realistic load through the real
# API without ever touching Alpha (melehost serves real users).
#
# Deliberately NOT a copy of the root docker-compose.yml: the parity test
# (backend/tests/unit/test_config_compose_parity.py) guards that file's
# api-alpha block; this file only sets what the loadtest instance needs —
# everything else falls to config.py defaults.
#
# Bring up:   docker compose up -d
# Tear down:  docker compose down -v   (destroys all loadtest data — by design)

services:
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: ami_loadtest_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see infra/loadtest/loadtest.env.example}
      POSTGRES_DB: ami_trade
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ami_trade"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    networks: [loadtest_internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: ami_loadtest_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    networks: [loadtest_internal]
    restart: unless-stopped

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unset}
        ALPHA_TAG: ${LOADTEST_TAG:-unset}
    container_name: ami_loadtest_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: staging
      # Own HMAC key — loadtest tokens are invalid on Alpha and vice versa.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — generate per loadtest.env.example}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET must be set}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@postgres:5432/ami_trade
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      # CR246 decision (2026-09-30): mock LLM — deterministic, zero-cost, and
      # any slowness is then provably app/DB, not the model.
      LLM_FORCE_PROVIDER: mock
      VLLM_BASE_URL: ""
      USE_REAL_MARKET_DATA: "false"
    ports:
      # LAN-reachable so k6 can run from the Mac too; the primary path is a
      # dockerized k6 on minihost itself (see deploy.sh / runbook).
      - "8000:8000"
    volumes:
      # Same rsync-driven bind-mount pattern as Alpha: the running Python is
      # the host filesystem, so a redeploy is rsync + restart, no rebuild.
      - ../../backend/app:/app/app:ro
      - ../../backend/scripts:/app/scripts:ro
      - ../../content:/content:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    mem_limit: 4g
    networks: [loadtest_internal]
    restart: unless-stopped
    stop_grace_period: 15s

networks:
  # Explicit name so the dockerized k6 runner can join it predictably
  # (docker run --network ami_loadtest_internal ...).
  loadtest_internal:
    name: ami_loadtest_internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
